<style>
/* Standalone reset (the Claude artifact wrapper adds this there). */
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { margin: 0; }
img { max-width: 100%; }

/* Chinese text uses Hanyi Senty Foundation (漢儀新蒂語文體) where it is installed; no font file is shipped,
   so everyone else gets Noto Sans SC. */
@font-face { font-family: "Atlas CJK"; src: local("HanyiSentyFoundation"), local("HanyiSentyFoundation Regular"), local("漢儀新蒂語文體"); size-adjust: 112%; unicode-range: U+3000-303F, U+3400-9FFF, U+FF00-FFEF; }
/* without Hanyi, a system Chinese font at the same size bump (the Noto web font below stays the last resort) */
@font-face { font-family: "Atlas CJK Sys"; src: local("Microsoft YaHei"), local("PingFang SC"), local("Noto Sans CJK SC"), local("Noto Sans SC"); size-adjust: 112%; unicode-range: U+3000-303F, U+3400-9FFF, U+FF00-FFEF; }
/* Layout: a quiet judge-style bar over three views. The tree is the one rich element: a route map with one lane per
   level, coloured with Codeforces rating colours (基 pupil green, 进 expert blue, 拓 candidate-master violet, NOI master
   orange). Those four colours appear only on chapter ids and in the tree; everything else is a graphite ramp. */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --raised: #eef0f3;
  --line: rgba(17, 24, 39, 0.10);
  --line-strong: rgba(17, 24, 39, 0.18);
  --fg: #151a22;
  --fg-2: #4a5362;
  --muted: #5d6573;
  --accent: #2f5fd0;
  --lv-b: #1a7a43;
  --lv-j: #2f5fd0;
  --lv-t: #9b3fb5;
  --lv-n: #ad4f09;
  --trap: #c2372f;
  --code-bg: #f8f9fb;
  --k-kw: #8a3fb0;
  --k-ty: #1f6fb0;
  --k-str: #2c7a3f;
  --k-num: #b45309;
  --k-com: #7b8594;
  --k-pre: #b0306a;
  --r-tag: 6px;
  --r-ctl: 8px;
  --r-card: 12px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1); /* on-screen movement: visualizer bars and pointers */
  --f-ui: "JetBrains Mono", "Atlas CJK", "Atlas CJK Sys", "Noto Sans SC", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --f-cjk: "JetBrains Mono", "Atlas CJK", "Atlas CJK Sys", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", monospace;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1d22; --surface: #21252b; --raised: #2a2f36; --line: rgba(236, 239, 244, 0.08); --line-strong: rgba(236, 239, 244, 0.16);
    --fg: #eceff4; --fg-2: #b3b9c3; --muted: #8a919c; --accent: #7aa2ff;
    --lv-b: #4cc47e; --lv-j: #7aa2ff; --lv-t: #c98be0; --lv-n: #f2994a; --trap: #ff7b72; --code-bg: #15181c;
    --k-kw: #d2a8ff; --k-ty: #79c0ff; --k-str: #7ee787; --k-num: #f2b35a; --k-com: #7d8896; --k-pre: #ff8fc0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1d22; --surface: #21252b; --raised: #2a2f36; --line: rgba(236, 239, 244, 0.08); --line-strong: rgba(236, 239, 244, 0.16);
  --fg: #eceff4; --fg-2: #b3b9c3; --muted: #8a919c; --accent: #7aa2ff;
  --lv-b: #4cc47e; --lv-j: #7aa2ff; --lv-t: #c98be0; --lv-n: #f2994a; --trap: #ff7b72; --code-bg: #15181c;
  --k-kw: #d2a8ff; --k-ty: #79c0ff; --k-str: #7ee787; --k-num: #f2b35a; --k-com: #7d8896; --k-pre: #ff8fc0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--f-ui); font-size: 15.5px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4 { font-weight: 500; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cjk { font-family: var(--f-cjk); }
.mono { font-family: var(--f-mono); }
/* code shows the characters you type: no != → ≠ or >= → ≥ ligatures */
code, pre, .mono, kbd, samp, .wout, .wsort, .wcode, .trace { font-variant-ligatures: none; font-feature-settings: "calt" 0, "liga" 0; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.label { font-size: 13px; color: var(--muted); margin: 0 0 8px; font-weight: 500; }
.hint { color: var(--muted); font-size: 14.5px; }

/* bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 12px; max-width: 1520px; margin: 0 auto; }
.brand { display: flex; align-items: baseline; gap: 12px; text-decoration: none; color: var(--fg); }
.brand b { font-weight: 500; font-size: 17.5px; }
.brand span { font-family: var(--f-cjk); color: var(--muted); font-size: 13px; }
.nav { display: flex; gap: 4px; }
.nav a { text-decoration: none; color: var(--fg-2); padding: 4px 12px; border-radius: var(--r-ctl); font-size: 14.5px; transition: background-color .15s var(--ease), color .15s var(--ease); }
.nav a:hover { background: var(--raised); }
.nav a[aria-current="page"] { color: var(--fg); background: var(--raised); box-shadow: inset 0 -2px 0 var(--accent); }
.search { position: relative; flex: 1 1 160px; max-width: 360px; margin-left: auto; }
@media (max-width: 1440px) and (min-width: 768px) { .brand span { display: none; } }
.search input { width: 100%; height: 32px; padding: 0 12px 0 32px; border: 1px solid var(--line-strong); border-radius: var(--r-ctl); background: var(--bg); }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; fill: var(--muted); }
.results { position: absolute; top: calc(100% + 8px); left: 0; right: 0; min-width: 320px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-card); box-shadow: 0 8px 24px rgba(0, 0, 0, .10); max-height: 60vh; overflow: auto; padding: 4px; }
.results a { display: block; padding: 8px 12px; border-radius: var(--r-ctl); text-decoration: none; color: var(--fg); }
.results a:hover, .results a.on { background: var(--raised); }
.results small { display: block; color: var(--muted); font-size: 13px; }
.results .none { padding: 12px; color: var(--muted); font-size: 14.5px; }

main { max-width: 1520px; margin: 0 auto; padding-block: 24px 64px; }

/* level id: the signature */
.lv { --c: var(--muted); display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 13px; font-weight: 600; color: var(--c); }
.lv::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.lv-b { --c: var(--lv-b); } .lv-j { --c: var(--lv-j); } .lv-t { --c: var(--lv-t); } .lv-n { --c: var(--lv-n); }

/* progress strip */
.strip { display: flex; gap: 8px 32px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; font-size: 14.5px; color: var(--fg-2); }
.strip .item { display: inline-flex; align-items: center; gap: 8px; }
.strip .meter { width: 72px; height: 4px; background: var(--raised); border-radius: 2px; overflow: hidden; display: inline-flex; }
.strip .meter i { display: block; height: 100%; background: var(--c); }
.strip .meter i.half { opacity: .4; }
.strip .n { font-variant-numeric: tabular-nums; color: var(--muted); }
.strip .name { font-family: var(--f-cjk); }

.tools { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.chipset { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line-strong); background: var(--surface); height: 28px; padding: 0 12px; border-radius: 14px; font-size: 13px; transition: background-color .15s var(--ease); }
.chip:hover { background: var(--raised); }
.chip[aria-pressed="true"] { border-color: var(--fg); background: var(--fg); color: var(--bg); }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r-ctl); overflow: hidden; }
.seg button { border: 0; background: transparent; height: 28px; padding: 0 12px; font-size: 13px; color: var(--fg-2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

/* tree */
.treeview { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; align-items: start; }
.canvas { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); overflow: auto; max-height: calc(100vh - 150px); min-height: 560px; position: relative; }
.canvas svg { display: block; }
.canvas { cursor: grab; touch-action: pan-x pan-y; }
.canvas.dragging { cursor: grabbing; user-select: none; }
.zoom button { min-width: 32px; }
.zoom .pct { display: inline-flex; align-items: center; justify-content: center; min-width: 52px; font-size: 13px; color: var(--fg-2); font-variant-numeric: tabular-nums; border-inline: 1px solid var(--line-strong); }
.lane-bg { fill: var(--c); opacity: .045; }
.lane-rule { stroke: var(--line); stroke-width: 1; }
.edge { fill: none; stroke: color-mix(in srgb, var(--fg) 26%, transparent); stroke-width: 1.4; vector-effect: non-scaling-stroke; }
.edge.hot { stroke: var(--fg); stroke-width: 2; }
.edge.dim { opacity: .2; }
.node { cursor: pointer; }
.node rect.box { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1; transition: stroke .12s ease; }
.node text.id { font-family: var(--f-mono); font-size: 11px; font-weight: 600; fill: var(--c); }
.node text.t { font-family: var(--f-cjk); font-size: 13px; font-weight: 500; fill: var(--fg); }
.node text.en { font-family: var(--f-mono); font-size: 10.5px; fill: var(--muted); }
.node circle.ready { fill: transparent; }
.node.ready circle.ready { fill: var(--c); }
.node.learning rect.box { stroke: var(--c); stroke-width: 1.5; stroke-dasharray: 5 3; }
.node.learned rect.box { fill: var(--c); stroke: var(--c); }
.node.learned text.t, .node.learned text.id { fill: var(--surface); }
.node.learned text.en { fill: var(--surface); opacity: .8; }
.node.sel rect.box { stroke: var(--fg); stroke-width: 2.5; }
.node.dim { opacity: .25; }
.node:hover rect.box { stroke: var(--fg); }
.node:focus-visible rect.box { stroke: var(--accent); stroke-width: 3; }
.legend { display: flex; gap: 8px 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 12px; }
.legend span { display: inline-flex; gap: 8px; align-items: center; }
.sw { width: 18px; height: 12px; border-radius: 3px; border: 1.5px solid var(--muted); display: inline-block; }
.sw.learning { border-style: dashed; }
.sw.learned { background: var(--muted); }

/* side and aside: plain sections, one card for the selected chapter */
.aside { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px); display: grid; gap: 24px; min-width: 0; align-content: start; grid-template-columns: minmax(0, 1fr); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px; min-width: 0; }
.card h2 { margin: 8px 0 0; font-family: var(--f-cjk); font-size: 22px; line-height: 1.3; text-wrap: balance; }
.en { color: var(--muted); margin: 0 0 8px; }
.block p { margin: 0 0 8px; }
.block + .block { margin-top: 20px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.btn { border: 1px solid var(--line-strong); background: var(--surface); height: 32px; padding: 0 12px; border-radius: var(--r-ctl); font-size: 14.5px; text-decoration: none; color: var(--fg); display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; transition: background-color .15s var(--ease), border-color .15s var(--ease), transform .12s var(--ease); }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn:hover { border-color: var(--fg); }
.btn:active { transform: scale(.98); }
.btns.even { display: grid; grid-template-columns: 1fr 1fr; }
.links { display: flex; flex-wrap: wrap; gap: 4px; }
.links a { font-family: var(--f-mono); font-size: 13px; text-decoration: none; padding: 2px 8px; border-radius: var(--r-tag); background: var(--raised); color: var(--fg); }
.links a:hover { background: var(--line-strong); }
.links a.done { text-decoration: line-through; color: var(--muted); }
ol.path { margin: 0; padding-left: 24px; }
ol.path li { margin: 4px 0; }
ol.path a { text-decoration: none; color: var(--fg); }
ol.path a:hover .cjk { text-decoration: underline; }
.cc { font-family: var(--f-mono); font-size: 13px; background: var(--raised); border-radius: var(--r-ctl); padding: 8px 12px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0 0 4px; }

/* list view */
.levels { display: grid; gap: 40px; }
.level h2 { font-family: var(--f-cjk); margin: 0 0 12px; font-size: 20px; display: flex; gap: 12px; align-items: baseline; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.tile { display: grid; gap: 4px; text-decoration: none; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 12px 16px; min-width: 0; transition: border-color .15s var(--ease); }
.tile:hover { border-color: var(--line-strong); }
.tile .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tile .t { font-family: var(--f-cjk); font-weight: 500; }
.tile small { color: var(--muted); font-size: 13px; }
.tile.learned { border-color: var(--c); }
.tile.learning { border-style: dashed; border-color: var(--c); }
.pill { font-size: 12px; font-family: var(--f-mono); padding: 1px 6px; border-radius: var(--r-tag); background: var(--raised); color: var(--muted); white-space: nowrap; }

/* chapter view */
.chapter { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 40px; align-items: start; }
.crumbs { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-bottom: 12px; }
.crumbs a { color: var(--muted); }
.chead h1 { font-family: var(--f-cjk); font-size: clamp(28px, 4vw, 36px); line-height: 1.15; margin: 8px 0 4px; text-wrap: balance; }
.chead .en { font-size: 17.5px; }
.chead .sum { max-width: 72ch; margin: 12px 0 0; color: var(--fg-2); line-height: 1.7; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 24px 0 24px; overflow-x: auto; }
.tabs a { text-decoration: none; color: var(--muted); padding: 8px 12px; border-bottom: 2px solid transparent; white-space: nowrap; font-size: 14.5px; transition: color .15s var(--ease); }
.tabs a:hover { color: var(--fg); }
.tabs a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--fg); }
.tabs a small { font-family: var(--f-mono); font-size: 12px; color: var(--muted); margin-left: 4px; }
.sec { margin: 32px 0 12px; display: flex; gap: 12px; align-items: baseline; }
.sec:first-child { margin-top: 0; }
.sec .n { font-family: var(--f-mono); color: var(--muted); font-size: 14.5px; }
.sec h3 { margin: 0; font-family: var(--f-cjk); font-size: 18.5px; }
.box { --k: var(--accent); border: 1px solid color-mix(in srgb, var(--k) 28%, var(--line)); background: color-mix(in srgb, var(--k) 5%, var(--surface)); border-radius: var(--r-card); padding: 14px 18px 16px; max-width: 72ch; line-height: 1.85; }
.box.key { --k: var(--v-done); } .box.trap { --k: var(--trap); } .box.note { --k: var(--muted); }
.box b { font-family: var(--f-mono); font-size: 13px; font-weight: 600; color: var(--k); display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.box b .hint { font-weight: 400; }
.ci { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.box.trap { border-color: color-mix(in srgb, var(--trap) 35%, var(--line)); }
.box.trap b { color: var(--trap); }
.jump { font-size: 13px; color: var(--muted); text-decoration: none; }
.jump:hover { color: var(--fg); }
.flow { display: grid; gap: 12px; max-width: 72ch; }
.flow .sec { margin: 48px 0 4px; padding-top: 20px; border-top: 1px solid var(--line); }
.flow .sec:first-child { margin-top: 0; }
.flow .box { max-width: none; }
.sub { font-family: var(--f-cjk); font-size: 16.5px; margin: 28px 0 0; padding-left: 12px; border-left: 2px solid var(--line-strong); }
.sub .n, .outline .n { font-family: var(--f-mono); color: var(--muted); font-weight: 400; }
.lede { color: var(--fg-2); margin: -2px 0 6px; font-size: 16.5px; line-height: 1.6; }
.para { margin: 0; line-height: 1.9; font-size: 16px; }
.para.li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: start; }
.para.li .num { width: 24px; height: 24px; border-radius: 50%; background: var(--raised); color: var(--fg-2); display: grid; place-items: center; font-size: 12px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.tbl { display: grid; gap: 4px; }
.tbl pre { margin: 0; font-family: var(--f-mono); font-size: 13px; line-height: 1.7; background: var(--raised); border-radius: var(--r-card); padding: 12px 16px; overflow-x: auto; }
.fig { justify-self: start; }
.outline { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.outline li.h3 { padding-left: 16px; }
.linkish { border: 0; background: none; padding: 2px 0; text-align: left; color: var(--fg-2); font-size: 14.5px; cursor: pointer; }
.linkish:hover { color: var(--fg); }
.prog { border: 1px solid var(--line); border-radius: var(--r-card); background: var(--surface); margin: 0 0 16px; overflow: hidden; }
.prog header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 12px 8px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.prog header .mono { font-weight: 600; }
.prog header small { color: var(--muted); font-size: 13px; }
pre.code { margin: 0; padding: 12px 16px; background: var(--code-bg); overflow-x: auto; font-family: var(--f-mono); font-size: 14.5px; line-height: 1.6; tab-size: 4; counter-reset: ln; }
pre.code .l { display: block; }
pre.code .l::before { counter-increment: ln; content: counter(ln); display: inline-block; width: 2.6em; margin-right: 12px; text-align: right; color: var(--k-com); opacity: .7; user-select: none; }
.io { background: var(--code-bg); display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); border-top: 1px solid var(--line); }
.io > div { padding: 8px 16px 12px; min-width: 0; }
.io > div + div { border-left: 1px solid var(--line); }
.io b { font-size: 13px; font-weight: 500; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
.io pre { margin: 4px 0 0; font-family: var(--f-mono); font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.copy { border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r-tag); font-size: 13px; height: 24px; padding: 0 8px; color: var(--fg-2); transition: background-color .15s var(--ease); }
.copy:hover { background: var(--raised); }
.hljs-keyword, .hljs-built_in { color: var(--k-kw); }
.hljs-type { color: var(--k-ty); }
.hljs-string, .hljs-char { color: var(--k-str); }
.hljs-number, .hljs-literal { color: var(--k-num); }
.hljs-comment { color: var(--k-com); }
.hljs-meta, .hljs-meta .hljs-keyword { color: var(--k-pre); }
.hljs-meta .hljs-string { color: var(--k-str); }
.hljs-title { color: var(--k-ty); }

.ptools { display: flex; gap: 8px 12px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.ptools select, .ptools input[type="text"] { border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r-ctl); height: 28px; padding: 0 8px; font-size: 13px; }
.ptools label { font-size: 13px; color: var(--fg-2); display: inline-flex; gap: 6px; align-items: center; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-card); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 13px; color: var(--muted); font-weight: 500; background: var(--raised); position: sticky; top: 0; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: color-mix(in srgb, var(--raised) 60%, transparent); }
td.num { font-variant-numeric: tabular-nums; text-align: right; color: var(--muted); font-size: 13px; }
td.id a { font-weight: 600; text-decoration: none; }
tr.solved td:not(:first-child) { opacity: .5; }
.diff { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: var(--r-tag); color: #fff; white-space: nowrap; }
.star { color: var(--lv-n); }
.reader { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px 20px; white-space: pre-wrap; font-family: var(--f-cjk); font-size: 14.5px; line-height: 1.8; overflow-wrap: anywhere; max-width: 88ch; }
.reader .pg { display: block; font-family: var(--f-mono); font-size: 12px; color: var(--muted); border-top: 1px dashed var(--line-strong); margin: 16px 0 8px; padding-top: 8px; }
textarea.notes { width: 100%; min-height: 260px; border: 1px solid var(--line-strong); border-radius: var(--r-card); background: var(--surface); padding: 12px 16px; line-height: 1.7; }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 40px; flex-wrap: wrap; }
.pager a { text-decoration: none; border: 1px solid var(--line); border-radius: var(--r-card); padding: 12px 16px; color: var(--fg); background: var(--surface); flex: 1 1 200px; min-width: 0; transition: border-color .15s var(--ease); }
.pager a:hover { border-color: var(--line-strong); }
.pager a small { display: block; color: var(--muted); font-size: 13px; }
.pager a.next { text-align: right; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 8px); opacity: 0; pointer-events: none; background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: var(--r-ctl); font-size: 14.5px; z-index: 20; transition: opacity .15s var(--ease), transform .15s var(--ease); }
.toast.show { opacity: 1; transform: translate(-50%, 0); transition-duration: .2s; } /* arrive in 200ms, leave in 150ms */
/* motion: press feedback, solved-row fade, map zoom origin */
.status button:active, .copy:active, .chip:active, .seg button:active { transform: scale(.97); }
.copy, .chip, .seg button { transition: background-color .15s var(--ease), transform .12s var(--ease); }
tr td { transition: opacity .15s var(--ease); }
.canvas svg { transform-origin: 0 0; }
.resume { font-size: 14.5px; color: var(--fg-2); margin: -4px 0 16px; }
.resume a { text-decoration: none; }
.resume a:hover .cjk { text-decoration: underline; }
/* front page */
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
.frame { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; min-width: 0; }
.frame .top { display: flex; justify-content: space-between; gap: 12px; padding: 8px 16px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.frame svg { display: block; width: 100%; height: auto; }
.stars { display: grid; gap: 8px; margin: 16px 0 0; padding: 0; list-style: none; }
.stars li { display: flex; gap: 12px; align-items: center; font-size: 14.5px; }
.stars a { font-weight: 600; text-decoration: none; }
.term { background: var(--code-bg); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px; font-family: var(--f-mono); font-size: 14.5px; line-height: 1.9; }
.term .p { color: var(--muted); }
.outlinks { display: flex; gap: 8px 20px; flex-wrap: wrap; font-size: 14.5px; }
.empty { color: var(--muted); padding: 24px; text-align: center; }
.status { display: flex; border: 1px solid var(--line-strong); border-radius: var(--r-ctl); overflow: hidden; }
.status button { flex: 1 1 auto; border: 0; background: transparent; height: 32px; padding: 0 8px; font-size: 13px; color: var(--fg-2); white-space: nowrap; transition: background-color .15s var(--ease), transform .12s var(--ease); }
.status button:hover { background: var(--raised); }
.status button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.progress-page { display: grid; gap: 32px; max-width: 880px; }
.side { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px 40px; align-items: start; min-width: 0; }
.selcard { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px 40px; align-items: start; }
.selcard .block + .block { margin-top: 16px; }

/* loading skeleton: the page's own outline, still (no shimmer) */
.skeleton { display: grid; gap: 24px; }
.sk { background: linear-gradient(90deg, var(--raised) 0%, color-mix(in srgb, var(--raised) 55%, var(--surface)) 50%, var(--raised) 100%); background-size: 200% 100%; border-radius: var(--r-ctl); animation: shimmer 1.4s linear infinite; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.sk-strip { height: 16px; width: min(560px, 100%); }
.sk-hero { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 48px; align-items: center; min-height: calc(100vh - 220px); }
.sk-h1 { height: 40px; margin-bottom: 12px; } .sk-h1.short { width: 60%; }
.sk-line { height: 14px; margin-top: 16px; width: 90%; }
.sk-btns { height: 32px; width: 260px; margin-top: 24px; }
.sk-map { height: 340px; border-radius: var(--r-card); }

/* topic icons and pills */
.ficon { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.fam { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
.ichip { display: inline-flex; align-items: center; gap: 6px; }

/* minimap */
.mapwrap { position: relative; min-width: 0; }
.minimap { position: absolute; right: 12px; bottom: 12px; width: 200px; height: auto; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-ctl); box-shadow: 0 4px 12px rgba(0, 0, 0, .12); cursor: pointer; touch-action: none; }
.mm-view { fill: color-mix(in srgb, var(--accent) 14%, transparent); stroke: var(--accent); stroke-width: 1.5; vector-effect: non-scaling-stroke; }

/* visualizers */
.vis { border: 1px solid var(--line); border-radius: var(--r-card); background: var(--surface); padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; margin-bottom: 20px; }
.vis-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
.vis-head b { font-weight: 500; }
.vis-stage { min-height: 120px; overflow-x: auto; position: relative; }
.vis-cap { margin: 0; min-height: 3.2em; color: var(--fg-2); line-height: 1.6; }
.vis-ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.bars { height: 172px; min-width: min(352px, 100%); }
.vbar { position: absolute; bottom: 24px; left: 0; width: 36px; background: var(--raised); border: 1px solid var(--line-strong); border-radius: 6px 6px 0 0; transition: transform .3s var(--ease-in-out), background-color .15s ease; }
.vbar span { position: absolute; bottom: -22px; width: 100%; text-align: center; font-size: 13px; color: var(--fg-2); }
.vbar.done { background: color-mix(in srgb, var(--accent) 22%, var(--surface)); }
.vbar.on { background: var(--accent); border-color: var(--accent); }
.cells .row { display: flex; gap: 4px; }
.cell { width: 36px; height: 44px; flex: none; display: grid; place-items: center; border: 1px solid var(--line-strong); border-radius: 6px; font-size: 13px; position: relative; transition: opacity .15s ease, background-color .15s ease; }
.cell small { position: absolute; top: 2px; left: 4px; font-size: 9px; color: var(--muted); }
.cell.out { opacity: .3; }
.cell.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
.cell.hit { background: var(--accent); color: var(--bg); }
.ptrs { position: relative; height: 24px; margin-top: 6px; }
.ptr { position: absolute; left: 0; width: 36px; text-align: center; font-size: 11px; color: var(--accent); transition: transform .3s var(--ease-in-out), opacity .15s ease; }
.ptr.lo, .ptr.hi { color: var(--muted); }
.ptr.mid { top: 10px; }
.gsvg, .tsvg { width: 100%; max-width: 480px; height: auto; display: block; }
.gsvg line, .tsvg line { stroke: var(--line-strong); stroke-width: 1.5; }
.gn circle { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.5; transition: fill .15s ease; }
.gn text { text-anchor: middle; font-size: 12px; fill: var(--fg); font-family: var(--f-mono); }
.gn text.d { fill: var(--accent); font-size: 11px; }
.gn.seen circle { fill: color-mix(in srgb, var(--accent) 22%, var(--surface)); stroke: var(--accent); }
.gn.cur circle { fill: var(--accent); }
.gn.cur text:not(.d) { fill: var(--bg); }
.queue { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; margin-top: 8px; font-size: 13px; }
.qcell { border: 1px solid var(--accent); border-radius: 4px; padding: 2px 8px; font-family: var(--f-mono); }
.tn rect { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.2; transition: fill .15s ease; }
.tn text { text-anchor: middle; font-family: var(--f-mono); fill: var(--fg); }
.tn .rg { font-size: 10px; } .tn .sm { font-size: 9px; fill: var(--muted); }
.tn.full rect { fill: var(--accent); stroke: var(--accent); }
.tn.full text { fill: var(--bg); }
.tn.split rect { stroke: var(--accent); stroke-width: 2; }
.tn.out { opacity: .35; }
.mem { display: grid; gap: 12px; }
.memrow { display: flex; gap: 12px; align-items: center; }
.memrow .hint, .ptrlbl { width: 64px; flex: none; font-size: 13px; }
.ptrlbl { color: var(--accent); font-family: var(--f-mono); }
.blk { display: flex; gap: 3px; flex-wrap: wrap; }
.mc { width: 26px; height: 26px; border: 1px solid var(--line-strong); border-radius: 4px; display: grid; place-items: center; font-size: 11px; font-family: var(--f-mono); }
.mc.f { background: color-mix(in srgb, var(--accent) 22%, var(--surface)); border-color: var(--accent); }
.memrow.old .mc { opacity: .45; text-decoration: line-through; }

/* heatmap, cheat-sheet, Big-O */
.heat { display: grid; grid-template-rows: repeat(7, 12px); grid-auto-flow: column; grid-auto-columns: 12px; gap: 3px; overflow-x: auto; }
.hm { border-radius: 2px; background: var(--raised); }
.hm.l1 { background: color-mix(in srgb, var(--accent) 30%, var(--raised)); }
.hm.l2 { background: color-mix(in srgb, var(--accent) 60%, var(--raised)); }
.hm.l3 { background: var(--accent); }
.cheat td, .cheat th { white-space: nowrap; }
code.bigo { font-family: var(--f-mono); font-size: .92em; background: var(--raised); border-radius: 4px; padding: 0 4px; white-space: nowrap; }


/* visualizer colour grammar, shared by every visualizer */
:root { --v-cur: #4f5fd6; --v-cmp: #c98a00; --v-done: #237a4b; --v-bad: #d0453b; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --v-cur: #8f9bff; --v-cmp: #f0b429; --v-done: #4cc38a; --v-bad: #ff7b72; } }
:root[data-theme="dark"] { --v-cur: #8f9bff; --v-cmp: #f0b429; --v-done: #4cc38a; --v-bad: #ff7b72; }
.vkey { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.vkey i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-left: 6px; }
.k-cur { background: var(--v-cur); } .k-cmp { background: var(--v-cmp); } .k-done { background: var(--v-done); } .k-bad { background: var(--v-bad); }
.cell.on, .vbar.on { background: color-mix(in srgb, var(--v-cmp) 28%, var(--surface)); border-color: var(--v-cmp); }
.cell.hit { background: var(--v-done); border-color: var(--v-done); color: #fff; }
.cell.done, .vbar.done { background: color-mix(in srgb, var(--v-done) 18%, var(--surface)); border-color: color-mix(in srgb, var(--v-done) 50%, var(--line-strong)); }
.cell.bad { background: color-mix(in srgb, var(--v-bad) 22%, var(--surface)); border-color: var(--v-bad); }
.cell.pad { opacity: .45; }
.ptr.mid { color: var(--v-cmp); }
.gn.cur circle, .rn.cur circle { fill: var(--v-cur); stroke: var(--v-cur); }
.gn.cur text:not(.d) { fill: #fff; }
.gn.seen circle, .rn.ret circle { fill: color-mix(in srgb, var(--v-done) 22%, var(--surface)); stroke: var(--v-done); }
.gn.open circle { stroke: var(--v-cmp); }
.tn.full rect { fill: var(--v-done); stroke: var(--v-done); }
.tn.split rect { stroke: var(--v-cmp); }
.gsvg line.hot { stroke: var(--v-cmp); } .gsvg line.mst { stroke: var(--v-done); } .gsvg line.skip { stroke: var(--v-bad); }
.ivs rect.take { fill: var(--v-done); stroke: var(--v-done); } .ivs rect.cur { stroke: var(--v-cmp); }
.vis-ctl select { border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r-ctl); height: 32px; padding: 0 6px; font-size: 13px; }
.mvar { border: 1px solid var(--line-strong); border-radius: var(--r-ctl); padding: 8px 12px; display: grid; gap: 6px; }
.mvar.bad { border-color: var(--v-bad); background: color-mix(in srgb, var(--v-bad) 8%, var(--surface)); }
.mhead { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.mhead b { margin-left: auto; }
.bytes { display: flex; gap: 4px; flex-wrap: wrap; }
.byte { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; padding: 2px 6px; border-radius: 4px; background: var(--raised); }
.mvar.bad .byte { background: color-mix(in srgb, var(--v-bad) 18%, var(--surface)); }

/* chapter header card, done bar, ladder, mastery */
.metacard { margin-top: 20px; display: grid; gap: 12px; padding: 16px 18px; border: 1px solid var(--line); border-radius: var(--r-card); background: var(--surface); max-width: 72ch; }
.metarow { display: flex; gap: 8px 20px; flex-wrap: wrap; align-items: center; font-size: 14.5px; color: var(--fg-2); }
.metarow b { color: var(--fg); font-variant-numeric: tabular-nums; }
.dstars { color: var(--v-cmp); letter-spacing: 2px; white-space: nowrap; } .dstars i { color: var(--line-strong); font-style: normal; }
.goals ul { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 2px; font-size: 14.5px; }
.donebar { margin-top: 48px; padding: 16px 18px; border: 1px dashed var(--line-strong); border-radius: var(--r-card); display: flex; gap: 12px 20px; align-items: center; flex-wrap: wrap; max-width: 72ch; }
.donebar .status { flex: 1 1 280px; }
.ladder { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin: 0 0 20px; }
.tier { border: 1px solid var(--line); border-radius: var(--r-card); padding: 12px 14px; display: grid; gap: 6px; align-content: start; background: var(--surface); }
.tier .label { margin: 0 0 4px; }
.tp { text-decoration: none; color: var(--fg); font-size: 14.5px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tp:hover .cjk { text-decoration: underline; }
.mastery { display: grid; gap: 8px; }
.mrow { display: grid; grid-template-columns: 200px minmax(0, 1fr) 48px; gap: 12px; align-items: center; font-size: 14.5px; }
.mrow .fam { color: var(--fg-2); }
.mbar { height: 6px; background: var(--raised); border-radius: 3px; overflow: hidden; }
.mbar i { display: block; height: 100%; background: var(--v-done); transform-origin: left; animation: grow .7s var(--ease) both; }
.mrow .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.outline .linkish.active { color: var(--fg); font-weight: 600; }
.outline .linkish.active .n { color: var(--accent); }
.prefs { display: flex; gap: 4px; }
.btn.sm { height: 28px; padding: 0 10px; font-size: 13px; }
.readbar { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + var(--bar-h, 57px)); height: 2px; background: var(--accent); transform-origin: left; transform: scaleX(0); opacity: 0; z-index: 6; transition: opacity .2s ease; }

/* themes picked by hand: light, dark, warm paper (the default follows the system) */
:root[data-skin="light"] { --bg: #f6f7f9; --surface: #ffffff; --raised: #eef0f3; --line: rgba(17, 24, 39, 0.10); --line-strong: rgba(17, 24, 39, 0.18); --fg: #151a22; --fg-2: #4a5362; --muted: #5d6573; --accent: #2f5fd0; --lv-b: #1a7a43; --lv-j: #2f5fd0; --lv-t: #9b3fb5; --lv-n: #ad4f09; --trap: #c2372f; --code-bg: #f8f9fb; --k-kw: #8a3fb0; --k-ty: #1f6fb0; --k-str: #2c7a3f; --k-num: #b45309; --k-com: #7b8594; --k-pre: #b0306a; --v-cur: #4f5fd6; --v-cmp: #c98a00; --v-done: #237a4b; --v-bad: #d0453b; color-scheme: light; }
:root[data-skin="dark"] { --bg: #131a26; --surface: #1a2232; --raised: #243045; --line: rgba(226, 232, 240, 0.08); --line-strong: rgba(226, 232, 240, 0.16); --fg: #e2e8f0; --fg-2: #b4bfcd; --muted: #8b96a8; --accent: #8ea8ff; --lv-b: #4cc47e; --lv-j: #8ea8ff; --lv-t: #c98be0; --lv-n: #f2994a; --trap: #ff7b72; --code-bg: #0d131d; --k-kw: #d2a8ff; --k-ty: #79c0ff; --k-str: #7ee787; --k-num: #f2b35a; --k-com: #7d8896; --k-pre: #ff8fc0; --v-cur: #8f9bff; --v-cmp: #f0b429; --v-done: #4cc38a; --v-bad: #ff7b72; color-scheme: dark; }
:root[data-skin="paper"] { --bg: #f4efe4; --surface: #fbf8f1; --raised: #ece5d6; --line: rgba(60, 45, 20, 0.12); --line-strong: rgba(60, 45, 20, 0.22); --fg: #2b2418; --fg-2: #574c3a; --muted: #665a46; --accent: #8a5110; --lv-b: #346a30; --lv-j: #2f5f9a; --lv-t: #8a3f8f; --lv-n: #9c460c; --trap: #b23b2e; --code-bg: #f6f1e6; --k-kw: #7d3f93; --k-ty: #2a5d8f; --k-str: #3f6e2c; --k-num: #9a5b13; --k-com: #8a7c66; --k-pre: #a0375f; --v-cur: #2f5f9a; --v-cmp: #b07a00; --v-done: #346a30; --v-bad: #b23b2e; color-scheme: light; }
@media (max-width: 560px) { .mrow { grid-template-columns: 140px minmax(0, 1fr) 40px; } .prefs { order: 2; } }
@media (prefers-reduced-motion: reduce) { .sk, .mbar i { animation: none; } }


/* ---- round 3 ---- */
/* topic colours: icons and pills only (lanes keep the level colours) */
:root { --fam-basics: #1f9d6b; --fam-algo: #2b8fd6; --fam-ds: #2b8fd6; --fam-dp: #c98a00; --fam-graph: #7c5cd6; --fam-math: #d44a76; --fam-str: #d44a76; --fam-geo: #7c5cd6; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --fam-basics: #4cc38a; --fam-algo: #5cb8ff; --fam-ds: #5cb8ff; --fam-dp: #f0b429; --fam-graph: #a78bfa; --fam-math: #f472a6; --fam-str: #f472a6; --fam-geo: #a78bfa; } }
:root[data-theme="dark"], :root[data-skin="dark"] { --fam-basics: #4cc38a; --fam-algo: #5cb8ff; --fam-ds: #5cb8ff; --fam-dp: #f0b429; --fam-graph: #a78bfa; --fam-math: #f472a6; --fam-str: #f472a6; --fam-geo: #a78bfa; }
.ficon { color: var(--fc, currentColor); transition: transform .25s var(--ease); }
.ficon > *, .ci > *, .medal > * { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .8s var(--ease) .1s forwards; }
@media (hover: hover) and (pointer: fine) {
  .chip:hover .ficon, .tile:hover .ficon, .trackcard:hover .ficon, .mrow:hover .ficon { transform: rotate(-10deg) scale(1.18); }
  .box:hover .ci { transform: scale(1.12) rotate(-6deg); }
  .tile:hover, .trackcard:hover, .tier:hover, .badge.got:hover, .place:hover, .nextcard:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0, 0, 0, .12); }
}
.ci { transition: transform .25s var(--ease); }
.tile, .trackcard, .tier, .badge, .place, .nextcard { transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .15s var(--ease); }

/* frosted header, pill nav */
.bar { background: color-mix(in srgb, var(--surface) 80%, transparent); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); }
.nav { background: var(--raised); padding: 3px; border-radius: 10px; gap: 2px; }
.nav a { border-radius: 8px; }
.nav a[aria-current="page"] { background: var(--surface); box-shadow: 0 1px 3px rgba(0, 0, 0, .18); }
@media (max-width: 767px) {
  /* a blurred header would pin the fixed tab bar to itself, so phones get a solid header */
  .bar { background: var(--surface); -webkit-backdrop-filter: none; backdrop-filter: none; }
  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border-radius: 0; gap: 4px;
    padding: 6px max(8px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-right, 0px));
    background: color-mix(in srgb, var(--surface) 88%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-top: 1px solid var(--line); }
  .nav a { min-height: 44px; display: grid; place-items: center; font-size: 12px; padding: 4px 2px; }
  main { padding-bottom: 96px; }
  .toast { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
}

/* map node states and path colours */
.node.locked rect.box { stroke-dasharray: 4 3; }
.node.locked text { opacity: .9; }
.node .lock { fill: none; stroke: var(--muted); stroke-width: 1.4; }
.node.learning rect.box { stroke: var(--v-cmp); stroke-width: 2.2; stroke-dasharray: none; }
.node.learned text.mark { fill: var(--surface); font-size: 13px; font-weight: 700; }
.node.startpick rect.box { stroke: var(--v-cur); stroke-width: 3; }
.edge.hot.in { stroke: #22b8cf; } .edge.hot.out { stroke: var(--v-done); }
.node .pulse { fill: none; stroke: var(--accent); stroke-width: 3; transform-box: fill-box; transform-origin: center; animation: pulse 1.2s var(--ease) 2; pointer-events: none; }
@keyframes pulse { from { opacity: .9; transform: scale(1); } to { opacity: 0; transform: scale(1.35); } }
.sw.locked { border-style: dashed; opacity: .6; } .sw.ready { border-color: var(--fg-2); background: radial-gradient(circle at 78% 30%, var(--fg-2) 0 2px, transparent 2.5px); } .sw.learning { border-color: var(--v-cmp); border-style: solid; } .sw.learned { background: var(--muted); }
.ln { width: 22px; height: 4px; border-radius: 2px; display: inline-block; background-size: 8px 4px; }
.ln.in { background-image: linear-gradient(90deg, #22b8cf 0 5px, transparent 5px); } .ln.out { background-image: linear-gradient(90deg, var(--v-done) 0 5px, transparent 5px); }

/* chapter list: queue, card actions, table */
.tilewrap { position: relative; min-width: 0; }
.tilewrap .tile { height: 100%; }
.tilewrap.startpick .tile { box-shadow: 0 0 0 2px var(--v-cur); }
.tileacts { position: absolute; right: 8px; bottom: 8px; display: flex; gap: 2px; }
.iconbtn { border: 1px solid transparent; background: transparent; width: 28px; height: 28px; border-radius: 6px; color: var(--muted); font-size: 16.5px; line-height: 1; transition: background-color .15s ease, color .15s ease, transform .12s var(--ease); }
.iconbtn:hover { background: var(--raised); color: var(--fg); }
.iconbtn:active { transform: scale(.97); }
.iconbtn[aria-pressed="true"] { color: var(--v-cmp); }
.tile .row small { flex: 1; }
.tile { padding-bottom: 40px; }
.queue-card { margin-bottom: 16px; }
.qrow { display: flex; gap: 8px; flex-wrap: wrap; }
.qitem { text-decoration: none; color: var(--fg); border: 1px solid var(--line-strong); border-radius: var(--r-ctl); padding: 6px 10px; font-size: 14.5px; }
table.syl td.fam { white-space: nowrap; }
table.syl a { color: var(--fg); text-decoration: none; } table.syl a:hover { text-decoration: underline; }
table.syl tr.learned td { opacity: .7; }

/* progress: stats, next chapter, badges, heatmap for a year */
.heat { grid-auto-columns: 11px; grid-template-rows: repeat(7, 11px); gap: 2px; }
.statrow { display: flex; gap: 8px 24px; flex-wrap: wrap; margin-top: 10px; font-size: 14.5px; color: var(--fg-2); }
.statrow b { font-size: 20px; color: var(--fg); font-variant-numeric: tabular-nums; margin-right: 4px; }
.nextrow { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.nextrow > div:nth-child(2) { flex: 1 1 240px; }
.nextrow .fam .ficon { width: 32px; height: 32px; }
.nexttitle { color: var(--fg); text-decoration: none; font-size: 18.5px; font-weight: 500; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.badge { border: 1px dashed var(--line-strong); border-radius: var(--r-card); padding: 12px; display: grid; gap: 4px; justify-items: start; opacity: .55; }
.badge.got { opacity: 1; border-style: solid; border-color: color-mix(in srgb, var(--v-cmp) 50%, var(--line)); background: color-mix(in srgb, var(--v-cmp) 7%, var(--surface)); }
.medal { width: 30px; height: 30px; fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.badge.got .medal { stroke: var(--v-cmp); }
.badge span { font-size: 14.5px; font-weight: 500; }

/* front page dashboard */
.dash { display: flex; gap: 32px; align-items: center; flex-wrap: wrap; }
.ringcard { position: relative; width: 150px; height: 150px; flex: none; }
.ring { width: 150px; height: 150px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 10; }
.rtrack { stroke: var(--raised); }
.rfill { stroke: var(--v-done); stroke-linecap: round; stroke-dasharray: 100; animation: ringfill 1.1s var(--ease) both; }
@keyframes ringfill { from { stroke-dashoffset: 100; } }
.ringtext { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ringtext b { font-size: 33px; font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; flex: 1 1 360px; }
.stat { border: 1px solid var(--line); border-radius: var(--r-card); padding: 14px 16px; background: var(--surface); display: grid; gap: 2px; }
.stat b { font-size: 28.5px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }
.tracks { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.trackcard { text-decoration: none; color: var(--fg); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px; background: var(--surface); display: grid; gap: 6px; border-top: 3px solid var(--c); }
.trackcard b { font-size: 20px; font-weight: 500; }
.ticons { display: flex; gap: 6px; margin: 4px 0; }
.tbar { height: 6px; background: var(--raised); border-radius: 3px; overflow: hidden; }
.tbar i { display: block; height: 100%; background: var(--c); transform-origin: left; animation: grow .8s var(--ease) both; }
.places { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.place { text-align: left; border: 1px solid var(--line-strong); border-radius: var(--r-card); background: var(--surface); padding: 14px 16px; display: grid; gap: 6px; cursor: pointer; }
.place.on { border-color: var(--v-cur); box-shadow: 0 0 0 2px color-mix(in srgb, var(--v-cur) 35%, transparent); }
.pickrow { margin-top: 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 14.5px; }
.skgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
@media (prefers-reduced-motion: reduce) {
  .ficon > *, .ci > *, .medal > * { animation: none; stroke-dashoffset: 0; }
  .rfill, .tbar i, .node .pulse { animation: none; }
}


/* ---- map redesign: rail, step row, hover ---- */
.mapwrap { display: grid; grid-template-columns: 176px minmax(0, 1fr); gap: 0 12px; align-items: start; }
.mapcol { position: relative; min-width: 0; }
.lanerail { position: relative; overflow: hidden; margin-top: 30px; border-radius: var(--r-card); }
.rail-item { position: absolute; left: 0; right: 0; top: 0; display: block; padding: 0; border: 0; border-left: 4px solid var(--c); border-radius: 0 var(--r-card) var(--r-card) 0;
  background: color-mix(in srgb, var(--c) 9%, var(--surface)); text-align: left; cursor: pointer; overflow: hidden; transition: background-color .15s ease; }
.rail-item:hover { background: color-mix(in srgb, var(--c) 16%, var(--surface)); }
.rail-label { display: grid; gap: 4px; padding: 12px 14px; will-change: transform; }
.rail-key { font-family: var(--f-mono); font-size: 13px; font-weight: 700; color: var(--c); }
.rail-name { font-size: 24px; line-height: 1.15; color: var(--fg); font-weight: 600; }
.rail-en { font-size: 13px; color: var(--muted); }
.rail-bar { height: 5px; background: var(--raised); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.rail-bar i { display: block; height: 100%; background: var(--c); transform-origin: left; animation: grow .8s var(--ease) both; }
.rail-n { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; } .rail-n b { color: var(--fg); font-size: 15.5px; }
/* details fade (opacity, transform), and only then give up their space in one step, so the layout changes once, not every frame */
.rail-en, .rail-bar, .rail-n { max-height: 40px; overflow: hidden; transition: opacity .3s ease, transform .3s ease, max-height 0s linear 0s, margin 0s linear 0s; }
.rail-item.tight .rail-en, .rail-item.tight .rail-bar, .rail-item.tight .rail-n { opacity: 0; transform: translateY(-4px); max-height: 0; margin: 0; transition: opacity .3s ease, transform .3s ease, max-height 0s linear .3s, margin 0s linear .3s; }
.steprow { position: relative; height: 30px; overflow: hidden; }
.step i { font-style: normal; } .steprow.narrow .step i { display: none; }
.step { position: absolute; left: 0; top: 6px; font-family: var(--f-mono); font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; transition: opacity .15s ease; }
svg .node rect.box, svg .edge { transition: opacity .18s ease, stroke .18s ease, stroke-width .2s ease, scale .2s var(--ease); }
/* one moving part per chapter: translate applies on top of the box's own position. (Not the scale property:
   on an SVG box it grows around the corner of the whole map, so far-away boxes jump.) */
.node { transition: translate .2s var(--ease); }
svg.lifting .node { translate: 0 -7px; }
.glayer rect { transition: fill .25s ease, stroke .25s ease, stroke-width .25s ease, filter .3s ease; }
svg.hovering .node:not(.hl) { opacity: .28; }
svg.hovering .edge:not(.hin):not(.hout) { opacity: .1; }
.edge.hin { stroke: #22b8cf; } .edge.hout { stroke: var(--v-done); }
.node rect.box { transform-box: fill-box; transform-origin: center; }
@media (hover: hover) and (pointer: fine) {
  /* a chapter rises toward you with a glow in its level colour; a group box brightens and its icon plays */
  .node:hover { translate: 0 -4px; }
  .node:hover rect.box { stroke: var(--c); stroke-width: 3; scale: 1.03; } /* the border grows around its own centre */
  .gbox:hover rect { fill: color-mix(in srgb, var(--c) 12%, transparent); stroke: color-mix(in srgb, var(--c) 65%, transparent); stroke-width: 2.5; filter: drop-shadow(0 10px 24px color-mix(in srgb, var(--c) 22%, transparent)); }
}
@keyframes breathe { 50% { transform: scale(1.7); opacity: .35; } }
.node.ready:not(.learned):not(.learning) circle.ready { transform-box: fill-box; transform-origin: center; animation: breathe 2.2s ease-in-out 3; }
@media (max-width: 767px) {
  .mapwrap { grid-template-columns: 64px minmax(0, 1fr); gap: 0 6px; }
  .lanerail { width: 64px; }
  .rail-label { padding: 10px 6px; }
  .rail-name, .rail-en, .rail-bar { display: none; }
  .rail-key { font-size: 22px; text-align: center; }
  .rail-n { text-align: center; font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .edge.hot, .edge.hin, .edge.hout { animation: none; stroke-dasharray: none; }
  .node.ready circle.ready, .rail-bar i { animation: none; }
  .node:hover, svg.lifting .node { translate: none; } .node:hover rect.box { scale: none; }
}


/* ---- round 5: practice hub, calculator, goal, self-check, mistakes, sharing ---- */
.storewarn { margin-top: 12px; padding: 10px 16px; border: 1px solid var(--trap); border-radius: var(--r-card); color: var(--fg); background: color-mix(in srgb, var(--trap) 10%, var(--surface)); }
.practice-page { display: grid; gap: 24px; max-width: 960px; }
.ptitle { font-family: var(--f-cjk); font-size: clamp(26px, 3.4vw, 34px); margin: 0; }
.practice-page .lead { color: var(--fg-2); margin: 0; max-width: 64ch; line-height: 1.7; }
.phub { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.hubcard { text-decoration: none; color: var(--fg); transition: border-color .15s var(--ease), transform .2s var(--ease); }
.hubcard p:last-child { margin: 0; color: var(--fg-2); }
.hubcard:hover { border-color: var(--line-strong); }
@media (hover: hover) and (pointer: fine) { .hubcard:hover { transform: translateY(-2px); } }
.dash2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.dash2:empty { display: none; }
.daily .nexttitle { display: block; }
.calc { margin-top: 16px; }
.calcin { display: flex; gap: 12px 24px; flex-wrap: wrap; margin-bottom: 12px; }
.calcin input { width: 110px; height: 32px; border: 1px solid var(--line-strong); border-radius: var(--r-ctl); background: var(--surface); padding: 0 8px; font-family: var(--f-mono); }
.calchead { margin: 0 0 8px; }
.crows { display: grid; gap: 4px; }
.crow { display: grid; grid-template-columns: 120px 1fr 80px auto; gap: 12px; align-items: center; padding: 4px 8px; border-radius: var(--r-ctl); font-size: 14.5px; }
.crow.fits { background: color-mix(in srgb, var(--v-done) 12%, transparent); }
.crow.tight { background: color-mix(in srgb, var(--v-cmp) 14%, transparent); }
.crow.slow { color: var(--muted); }
.crow .verdict { font-weight: 600; }
.glossq { height: 36px; border: 1px solid var(--line-strong); border-radius: var(--r-ctl); background: var(--surface); padding: 0 12px; max-width: 420px; width: 100%; }
table.gloss td.cjk { font-size: 16px; white-space: nowrap; }
.flash { display: grid; gap: 4px; border-left: 4px solid var(--c); }
.flash .label a { text-decoration: none; color: inherit; }
.cue { font-size: 18px; line-height: 1.6; margin: 4px 0 8px; color: var(--fg); }
.checkcard { display: block; border-left: 4px solid var(--accent); }
.contest .ctime { font-family: var(--f-mono); font-size: clamp(40px, 7vw, 64px); font-weight: 600; margin: 0 0 16px; font-variant-numeric: tabular-nums; }
.cprobs { display: grid; gap: 10px; padding-left: 0; list-style: none; margin: 0; }
.cprobs li { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.cprobs a { text-decoration: none; color: var(--fg); }
.mlist { list-style: none; padding: 0; margin: 0 0 8px; display: grid; gap: 4px; }
.mlist li { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 6px 10px; background: var(--raised); border-radius: var(--r-ctl); font-size: 14.5px; }
.madd { display: flex; gap: 8px; }
.madd input { flex: 1; min-width: 0; height: 32px; border: 1px solid var(--line-strong); border-radius: var(--r-ctl); background: var(--surface); padding: 0 10px; }
.mybox ul { margin: 0; padding-left: 20px; }
.sol { font-size: 13px; margin-left: 6px; }
.goalblock { background: color-mix(in srgb, var(--accent) 7%, var(--surface)); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.node.goal rect.box { stroke: var(--accent); stroke-width: 2.2; }
.node.goalend rect.box { stroke-width: 3.5; }
.edge.goaledge { stroke: var(--accent); stroke-width: 2.2; opacity: .85; }
svg.searching .node:not(.match) { opacity: .22; }
.node.match rect.box { stroke: var(--accent); stroke-width: 3; }
.foldtxt { font-family: var(--f-cjk); font-size: 15px; fill: var(--fg-2); }
.listmap { margin-bottom: 16px; padding: 8px; }
.listmap svg { display: block; width: 100%; height: auto; max-height: 180px; }
.listmap rect.hl { stroke: var(--fg); stroke-width: 14; opacity: 1 !important; }
.sharebanner { border-left: 4px solid var(--accent); margin-bottom: 16px; }
.shared .frame { margin-top: 16px; overflow: auto; }
.shared .frame svg { width: 100%; height: auto; min-width: 900px; }
@media (max-width: 767px) { .crow { grid-template-columns: 96px 1fr 64px; } .crow .links, .crow > a { display: none; } }


/* ---- tree: far mode, floating card, filters menu, skip link ---- */
/* past 45% the details fade out and the large id fades (and grows) in, both ways */
.node text.far { opacity: 0; font-family: var(--f-mono); font-size: 34px; font-weight: 700; fill: var(--c); transform-box: fill-box; transform-origin: center; scale: .75; transition: opacity .4s var(--ease), scale .5s var(--ease); }
.node text.t, .node text.en, .node text.id, .node circle.ready, .node .lock, .node .badge, .node .lbar { transition: opacity .4s var(--ease); }
svg.far .node text.t, svg.far .node text.en, svg.far .node text.id, svg.far .node circle.ready, svg.far .node .lock { opacity: 0; }
svg.far .node text.far { opacity: 1; scale: 1; }
svg.far .node.learned text.far { fill: var(--surface); }
.node.sel rect.box { stroke-dasharray: none; }
::placeholder { color: var(--muted); opacity: 1; }
.side p { text-wrap: pretty; }
.peek { position: absolute; top: 42px; right: 12px; width: min(340px, calc(100% - 24px)); z-index: 3; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-card); padding: 14px 16px 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, .22); animation: peekin .2s var(--ease) both; }
@keyframes peekin { from { opacity: 0; transform: translateY(-6px) scale(.98); } }
.peek .label { margin: 0 24px 4px 0; }
.peekt { font-size: 20px; font-weight: 600; margin: 0; line-height: 1.3; }
.peek .hint { margin: 2px 0 0; }
.peekn { margin: 8px 0 0; font-size: 14px; color: var(--fg-2); }
.peek .btns { margin-top: 12px; }
.peekx { position: absolute; top: 8px; right: 8px; }
/* ---- the small map on the Tree tab, and the full-screen map ---- */
.mappreview { display: block; position: relative; text-decoration: none; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; margin-bottom: 24px; transition: border-color .15s ease; }
.mpsvg { height: clamp(220px, 32vw, 380px); padding: 16px; pointer-events: none; }
.mpsvg svg { display: block; width: 100%; height: 100%; transition: transform .4s var(--ease); }
.pvedge { fill: none; stroke: color-mix(in srgb, var(--fg) 18%, transparent); stroke-width: 4; }
.pvhere { fill: none; stroke: var(--fg); stroke-width: 8; }
.mpcta { position: absolute; left: 16px; bottom: 16px; display: grid; gap: 2px; padding: 12px 16px; background: color-mix(in srgb, var(--surface) 90%, transparent); border: 1px solid var(--line-strong); border-radius: var(--r-ctl); box-shadow: 0 6px 18px rgba(0, 0, 0, .18); }
.mpcta b { font-size: 17px; }
@media (hover: hover) and (pointer: fine) { .mappreview:hover { border-color: var(--line-strong); } .mappreview:hover .mpsvg svg { transform: scale(1.015); } }
::view-transition-group(atlasmap) { animation-duration: .45s; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
body.mapopen { overflow: hidden; }
.mapfull { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; padding: calc(12px + env(safe-area-inset-top, 0px)) 12px 12px; }
.mapmain { min-width: 0; min-height: 0; }
.mapfull .canvas { height: calc(100dvh - 54px - env(safe-area-inset-top, 0px)); max-height: none; min-height: 0; }
.mappanel { min-height: 0; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px; display: grid; gap: 18px; align-content: start; }
.mappanel section .label { margin-bottom: 6px; }
.mappanel .seg { flex-wrap: wrap; }
.mphead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.mphead b { font-size: 18px; }
.mpside .selcard { padding: 14px; }
.mapbar { display: none; }
.toast { z-index: 60; }
/* the level rail slides away for other arrangements and flows back slowly for Prerequisites */
/* the rail keeps its width and slides by exactly as much as its column grows or shrinks, so its edge pushes the map's
   edge (the column width does animate: a deliberate cost for the push) */
.mapwrap { transition: grid-template-columns .7s var(--ease), column-gap .7s var(--ease); }
.lanerail { width: 176px; transition: transform .7s var(--ease), opacity .35s ease; }
.mapmain { overflow: hidden; }
.steprow, .minimap { transition: opacity .5s ease .2s, transform .6s var(--ease) .2s; }
.mapwrap.grouped { grid-template-columns: 0px minmax(0, 1fr); column-gap: 0; }
.mapwrap.grouped .lanerail { transform: translateX(-100%); pointer-events: none; }
.mapwrap.grouped .steprow, .mapwrap.grouped .minimap { opacity: 0; pointer-events: none; transition-delay: 0s; }
.mapwrap.grouped .steprow { transform: translateY(-8px); }
.rail-label { transition: opacity .4s ease; }
.rail-item { display: flex; flex-direction: column; justify-content: flex-start; } /* a button centres its content; the name belongs at the top of its lane */
.arrsub { margin-top: 10px; }
.mappanel .seg.arr { grid-template-columns: repeat(3, 1fr); }
/* no scrollbars on the map or its panel: drag, wheel and touch move them */
.mapfull .canvas, .mappanel { scrollbar-width: none; }
.mapfull .canvas::-webkit-scrollbar, .mappanel::-webkit-scrollbar { display: none; }
/* chapters can fly through space outside the drawing while they move */
.canvas svg { overflow: visible; }
.arrsub { transition: opacity .2s ease; } .arrsub.swap { opacity: 0; }
@keyframes gIn { from { opacity: 0; transform: scale(.985); } }
/* chapter states, readable at a glance */
.hatchbg { fill: var(--surface); } .hatchln { stroke: color-mix(in srgb, var(--fg) 9%, transparent); stroke-width: 3.5; }
.node.locked rect.box { fill: url(#hatch); stroke: color-mix(in srgb, var(--fg) 30%, transparent); stroke-width: 1.4; stroke-dasharray: 5 4; }

/* legend animations: locked shakes, ready sends out a ring, learning half fills, learned fills and checks, needs flows in,
   unlocks flows out. They play when the legend appears and again when you point at an entry (the second names restart them). */
.legend .sw { position: relative; width: 22px; height: 14px; }
@keyframes swShake { 20% { transform: rotate(-9deg); } 40% { transform: rotate(7deg); } 60% { transform: rotate(-4deg); } 80% { transform: rotate(2deg); } }
@keyframes swShake2 { 20% { transform: rotate(-9deg); } 40% { transform: rotate(7deg); } 60% { transform: rotate(-4deg); } 80% { transform: rotate(2deg); } }
@keyframes swRing { from { transform: scale(.7); opacity: .9; } to { transform: scale(1.5); opacity: 0; } }
@keyframes swRing2 { from { transform: scale(.7); opacity: .9; } to { transform: scale(1.5); opacity: 0; } }
@keyframes swHalf { from { transform: scaleX(0); } to { transform: scaleX(.5); } }
@keyframes swHalf2 { from { transform: scaleX(0); } to { transform: scaleX(.5); } }
@keyframes swFill { from { transform: scaleX(0); } }
@keyframes swFill2 { from { transform: scaleX(0); } }
@keyframes swTick { 0% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.3); opacity: 1; } }
@keyframes swTick2 { 0% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.3); opacity: 1; } }
@keyframes lnIn { from { background-position: -16px 0; } to { background-position: 0 0; } }
@keyframes lnIn2 { from { background-position: -16px 0; } to { background-position: 0 0; } }
@keyframes lnOut { from { background-position: 0 0; } to { background-position: 16px 0; } }
@keyframes lnOut2 { from { background-position: 0 0; } to { background-position: 16px 0; } }
.legend .sw.locked { animation: swShake .7s var(--ease) .3s both; }
.legend .sw.ready::after { content: ""; position: absolute; inset: -4px; border-radius: 6px; border: 2px solid var(--accent); opacity: 0; animation: swRing 1.2s ease-out .4s 2; }
.legend .sw.learning { background: color-mix(in srgb, var(--v-cmp) 18%, transparent); }
.legend .sw.learning::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--v-cmp); transform-origin: left; transform: scaleX(.5); animation: swHalf 1.1s var(--ease) .5s both; }
.legend .sw.learned { background: none; border-color: var(--v-done); overflow: hidden; }
.legend .sw.learned::before { content: ""; position: absolute; inset: 0; background: var(--v-done); transform-origin: left; animation: swFill .6s var(--ease) .6s both; }
.legend .sw.learned::after { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; font-size: 10px; line-height: 1; color: var(--surface); animation: swTick .45s var(--ease) 1.1s both; }
.legend .ln.in { animation: lnIn .8s linear .3s 3; } .legend .ln.out { animation: lnOut .8s linear .3s 3; }
.legend span:hover .sw.locked { animation: swShake2 .7s var(--ease); }
.legend span:hover .sw.ready::after { animation: swRing2 1.2s ease-out 2; }
.legend span:hover .sw.learning::after { animation: swHalf2 1.1s var(--ease) both; }
.legend span:hover .sw.learned::before { animation: swFill2 .6s var(--ease) both; } .legend span:hover .sw.learned::after { animation: swTick2 .45s var(--ease) .5s both; }
.legend span:hover .ln.in { animation: lnIn2 .8s linear 3; } .legend span:hover .ln.out { animation: lnOut2 .8s linear 3; }
/* ready to learn next: each chapter is a box that lifts when you point at it */
.readybox ol.path { list-style: none; padding: 0; display: grid; gap: 8px; }

@media (prefers-reduced-motion: reduce) {

.lcard { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; padding: 16px 18px; border: 1px solid var(--line); border-radius: var(--r-card); background: var(--surface); line-height: 1.6; }

  .fflow { gap: 6px; align-items: stretch; }
  .fflow > i { display: none; }
  .fchip { flex: none; width: 100%; max-width: none; grid-template-columns: 24px auto 1fr; justify-items: start; align-items: center; column-gap: 12px; text-align: left; padding: 10px 14px; }
  .fchip > :first-child:not(b) { grid-column: 1 / 3; }
  .fchip small { max-width: none; justify-self: end; text-align: right; }
  .forder { grid-template-columns: 28px 1fr; }
  .forder small { grid-column: 2; margin-top: -10px; }
  .ltable thead { display: none; }
  .ltable tr { display: grid; gap: 6px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .ltable tr:last-child { border-bottom: 0; }

  .lcards { grid-template-columns: minmax(0, 1fr); }
  .lsteps li { grid-template-columns: 26px minmax(0, 1fr); gap: 4px 14px; }

}

/* the visualizer slider: a slim track that fills as the steps advance, and a round thumb */
.vis-ctl input[type="range"] { flex: 1 1 160px; -webkit-appearance: none; appearance: none; height: 6px; margin: 0 6px; border-radius: 999px; cursor: pointer;
  background: linear-gradient(var(--accent), var(--accent)) 0 / var(--p, 0%) 100% no-repeat, var(--raised); transition: background-size .2s var(--ease); }
.vis-ctl input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); box-shadow: 0 1px 4px rgba(0, 0, 0, .3); transition: transform .15s var(--ease); }
.vis-ctl input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); box-shadow: 0 1px 4px rgba(0, 0, 0, .3); transition: transform .15s var(--ease); }
.vis-ctl input[type="range"]::-moz-range-track { background: transparent; }
@media (hover: hover) and (pointer: fine) { .vis-ctl input[type="range"]:hover::-webkit-slider-thumb { transform: scale(1.15); } .vis-ctl input[type="range"]:hover::-moz-range-thumb { transform: scale(1.15); } }
.vis-ctl input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.25); }
.vis-ctl input[type="range"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; }
.vis-ctl .vplay { min-width: 92px; } .vis-ctl .vplay span { font-size: 11px; }
[data-n] { font-variant-numeric: tabular-nums; min-width: 4.5ch; text-align: right; }

/* the code run: a bar slides to the running line; values that change flash */
.trace { position: relative; }
.trace span { position: relative; z-index: 1; transition: color .2s var(--ease); }
.trace .tbar { position: absolute; left: 0; right: 0; top: 0; height: 0; z-index: 0; opacity: 0; pointer-events: none; background: color-mix(in srgb, var(--v-cmp) 18%, transparent); border-left: 3px solid var(--v-cmp);
  transition: transform .22s var(--ease-in-out), height .22s var(--ease-in-out), opacity .2s var(--ease); }

@keyframes lsFlash { from { background: color-mix(in srgb, var(--v-cmp) 45%, var(--surface)); transform: scale(1.08); } }

/* lesson widgets */
.lwid { display: grid; gap: 16px; padding: 22px 24px 24px; border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--line)); border-radius: var(--r-card); background: color-mix(in srgb, var(--accent) 4%, var(--surface)); }
.lwhead { margin: 0; display: flex; gap: 10px; align-items: center; font-weight: 600; }
.lwhead span { white-space: nowrap; font-size: 12px; font-weight: 600; color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); padding: 2px 8px; border-radius: 999px; }
.wq { margin: 0; color: var(--fg-2); }
.wfb { margin: 0; min-height: 1.6em; color: var(--fg-2); line-height: 1.6; }
.wfb.ok { color: var(--v-done); } .wfb.bad { color: var(--v-bad); }
.wfb.show { animation: lsIn .3s var(--ease) both; }
.werr { background: var(--code-bg); border: 1px solid color-mix(in srgb, var(--v-bad) 40%, var(--line)); border-radius: 8px; padding: 10px 14px; color: var(--v-bad); font-size: 13.5px; overflow-x: auto; }
.wcode { display: grid; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 0; overflow-x: auto; }
.wcode button { all: unset; display: grid; grid-template-columns: 32px 1fr; align-items: baseline; padding: 3px 12px 3px 0; cursor: pointer; border-left: 3px solid transparent; font: 14px/1.6 var(--f-mono); white-space: pre; transition: background-color .15s var(--ease), border-color .15s var(--ease); }

.wcode button code { background: none; padding: 0; }
@media (hover: hover) and (pointer: fine) { .wcode button:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); } }
.wcode button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.wcode button.bad { border-left-color: var(--v-bad); animation: lsShake .35s var(--ease); }
.wcode button.ok { border-left-color: var(--v-done); background: color-mix(in srgb, var(--v-done) 14%, transparent); }
.wcode .fix { color: var(--v-done); animation: lsPop .4s var(--ease) both; display: inline-block; }
@keyframes lsShake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.wpre { display: flex; gap: 8px; flex-wrap: wrap; }
.win { display: flex; gap: 16px; flex-wrap: wrap; }
.win label { display: flex; gap: 10px; align-items: center; font-weight: 600; }
.win input { width: 130px; height: 40px; border: 1px solid var(--line-strong); border-radius: var(--r-ctl); background: var(--bg); color: var(--fg); font: 600 18px var(--f-mono); padding: 0 12px; }
.win input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.wres { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.wres > div { display: grid; gap: 8px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.wres code { color: var(--muted); font-size: 13px; }
.wres b { font: 600 24px var(--f-mono); font-variant-numeric: tabular-nums; display: inline-block; justify-self: start; }
.pop { animation: lsPop .35s var(--ease); }
@keyframes lsPop { from { transform: scale(.7); opacity: .3; } }
.wdots { display: flex; gap: 6px; }
.wdots i { width: 22px; height: 4px; border-radius: 2px; background: var(--raised); transition: background-color .3s var(--ease); }
.wdots i.d { background: var(--v-done); } .wdots i.c { background: var(--accent); }
.wquiz { display: grid; gap: 14px; }
.wquiz .wq code { font-size: 1.05em; }
.wopts { display: flex; gap: 10px; flex-wrap: wrap; }
.wopts .btn { min-width: 72px; height: 44px; font: 600 16px var(--f-mono); }
.wopts .btn.ok { border-color: var(--v-done); background: color-mix(in srgb, var(--v-done) 16%, var(--surface)); animation: lsPop .3s var(--ease); }
.wopts .btn.bad { border-color: var(--v-bad); background: color-mix(in srgb, var(--v-bad) 14%, var(--surface)); animation: lsShake .35s var(--ease); }
.wopts .btn:disabled { cursor: default; opacity: 1; }
.wdone { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; animation: lsIn .4s var(--ease) both; }
.wdone b { font-size: 28px; color: var(--v-done); }
.wswap { display: flex; gap: 32px; align-items: center; flex-wrap: wrap; }
.wcode.small { padding: 10px 0; min-width: 180px; }
.wcode.small span { display: block; padding: 2px 14px; border-left: 3px solid transparent; font: 14px/1.7 var(--f-mono); color: var(--muted); transition: color .2s var(--ease), background-color .2s var(--ease), border-color .2s var(--ease); }
.wcode.small span.on { color: var(--fg); border-left-color: var(--v-cmp); background: color-mix(in srgb, var(--v-cmp) 16%, transparent); }
.wcode.small span.done { color: var(--fg-2); border-left-color: color-mix(in srgb, var(--v-cmp) 45%, transparent); background: color-mix(in srgb, var(--v-cmp) 6%, transparent); }
.wboxes { display: flex; gap: 16px; }
.wboxes .vbox b { font: inherit; }
.wboxes .vbox { transition: opacity .25s var(--ease), border-color .2s var(--ease), background-color .2s var(--ease); }
.wboxes .vbox.off { opacity: .3; }
.lwid .btn:disabled { opacity: .5; cursor: default; }

/* lesson pieces rise in as they scroll into view, their parts one after another */
.rv { opacity: 0; transform: translateY(14px); transition: opacity .5s var(--ease), transform .5s var(--ease); }
.rv.in { opacity: 1; transform: none; }
.rv.in :is(.fchip, .fvars > div, .fswap > div, .lsteps > li, .lcard, .fascii > div, .fverd > div, .fprec > div, .fchain .row, .frow, .fkeys > div, .fstruct > div), .rv.in .forder > div > * { animation: lsIn .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 90ms + 120ms); }
.rv.in .forder > div > * { animation-delay: calc(var(--i, 0) * 260ms + 150ms); }
.rv.in .fflow > i { animation: lsIn .4s var(--ease) both; animation-delay: .45s; }
.rv.in .fline .arc { stroke-dashoffset: 0; animation: lsDraw .8s var(--ease) .35s both; }
.rv.in .fline .to { transform-box: fill-box; transform-origin: center; animation: lsPop .4s var(--ease) 1s both; }
.rv.in .fchip.ok { animation-name: lsIn, lsGlow; animation-duration: .45s, 1.2s; animation-delay: calc(var(--i, 0) * 90ms + 120ms), .9s; }
@keyframes lsIn { from { opacity: 0; transform: translateY(10px); } }
@keyframes lsDraw { from { opacity: 0; } }
@keyframes lsGlow { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--v-done) 25%, transparent); } }
@media (max-width: 640px) {
  .wres { grid-template-columns: minmax(0, 1fr); }
  .wres > div { grid-template-columns: 1fr auto; align-items: center; }
  .wswap { gap: 18px; }
}
@media (prefers-reduced-motion: reduce) {
  .rv { opacity: 1; transform: none; transition: none; }
  .trace .tbar, .vis-ctl input[type="range"] { transition: none; }
  .qcell.chg, .wfb.show, .pop, .wcode button.bad, .wopts .btn.ok, .wopts .btn.bad, .wdone, .wcode .fix { animation: none; }
}


/* 基2 figures and widgets */
.fsize { display: grid; grid-template-columns: max-content minmax(0, 1fr) max-content; gap: 12px 16px; align-items: center; width: 100%; max-width: 620px; }
.fsize > div { display: contents; }
.fsize .bar { display: flex; gap: 3px; }
.fsize .bar i { flex: 0 1 22px; height: 22px; border-radius: 4px; background: color-mix(in srgb, var(--v-cur) 55%, var(--surface)); }
.fsize small { color: var(--muted); font-size: 12.5px; }
.rv.in .fsize .bar i { animation: lsPop .3s var(--ease) both; animation-delay: calc(var(--i, 0) * 120ms + 150ms); }
.fascii { display: flex; gap: 12px; align-items: stretch; justify-content: center; flex-wrap: wrap; }
.fascii > div { display: grid; gap: 6px; justify-items: center; text-align: center; padding: 14px 16px; min-width: 130px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--bg); }
.fascii b { font: 600 18px var(--f-mono); }
