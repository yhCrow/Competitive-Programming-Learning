.fascii .plus { align-self: center; font-style: normal; color: var(--v-cmp); font-weight: 600; font-size: 13px; }
.fline .band { fill: color-mix(in srgb, var(--v-done) 22%, transparent); }
.fline .tri { fill: color-mix(in srgb, var(--v-cur) 14%, transparent); stroke: var(--v-cur); stroke-width: 2; }
.fheron { display: flex; gap: 24px; align-items: center; justify-content: center; flex-wrap: wrap; width: 100%; }
.fheron .fline { width: 200px; max-width: 200px; }
.fheron .forder { width: auto; }
.fverd { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; width: 100%; }
.fverd > div { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.fverd small { grid-column: 2; color: var(--muted); font-size: 12.5px; line-height: 1.5; }
.fverd > div > span { font-weight: 600; }
.vd { grid-row: span 2; min-width: 48px; text-align: center; padding: 6px 8px; border-radius: 8px; font: 700 15px var(--f-mono); background: var(--raised); color: var(--fg-2); }
.vd.ok { background: color-mix(in srgb, var(--v-done) 20%, var(--surface)); color: var(--v-done); }
.vd.bad { background: color-mix(in srgb, var(--v-bad) 18%, var(--surface)); color: var(--v-bad); }
.vd.warn { background: color-mix(in srgb, var(--v-cmp) 20%, var(--surface)); color: var(--v-cmp); }
.wmeter { position: relative; height: 26px; border-radius: 8px; background: var(--raised); overflow: hidden; }
.wmeter i { position: absolute; inset: 0 auto 0 0; width: 0; background: color-mix(in srgb, var(--v-done) 45%, var(--surface)); transition: width .45s var(--ease), background-color .3s var(--ease); }
.wmeter i.bad { background: color-mix(in srgb, var(--v-bad) 50%, var(--surface)); }
.wmeter::after { content: ""; position: absolute; top: 0; bottom: 0; left: calc(100% / 1.15); border-left: 2px dashed var(--fg-2); }
.wmeter span { position: absolute; left: 10px; top: 4px; z-index: 1; font-size: 12px; color: var(--fg-2); }
.wres.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.wres b.bad { color: var(--v-bad); }
.wres b.sm { font-size: 18px; letter-spacing: .04em; }
.win label { min-width: 0; max-width: 100%; }
.win input[type="text"] { width: min(380px, 100%); text-align: left; font-size: 17px; }
.win input[type="text"][maxlength="1"] { width: 70px; text-align: center; font-size: 18px; }
.win input[type="range"] { width: 200px; height: auto; border: 0; padding: 0; background: none; accent-color: var(--accent); }
.chip.mono { font-family: var(--f-mono); }
.wpre .chip[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--surface)); color: var(--fg); }
.wprint { display: grid; gap: 10px; padding: 16px; border-radius: 10px; background: var(--code-bg); border: 1px solid var(--line); }
.wcall { color: var(--muted); font-size: 13.5px; }
.wout { display: flex; gap: 3px; min-height: 40px; flex-wrap: wrap; }
.wout span { width: 26px; height: 38px; display: grid; place-items: center; border-radius: 6px; background: var(--raised); font: 600 18px var(--f-mono); }
.wout span.pad { color: var(--v-cmp); background: color-mix(in srgb, var(--v-cmp) 14%, transparent); }
.wsteps { max-width: none; }
.wsteps code { white-space: normal !important; }
.wclock { display: flex; gap: 12px; align-items: baseline; }
.wclock b { font: 700 36px var(--f-mono); font-variant-numeric: tabular-nums; color: var(--v-done); display: inline-block; }
.wclock small { color: var(--muted); }
@media (max-width: 640px) {
  .fsize { grid-template-columns: max-content minmax(0, 1fr); }
  .fsize small { grid-column: 2; margin-top: -8px; }
  .fsize .bar i { height: 16px; }
  .fverd { grid-template-columns: minmax(0, 1fr); }
  .wres.two { grid-template-columns: minmax(0, 1fr); }
  .fascii .plus { width: 100%; text-align: center; }
}
@media (prefers-reduced-motion: reduce) { .wout span, .rv.in .fsize .bar i { animation: none; } .wmeter i { transition: none; } }


/* 基3 figures and widgets */
.fprec { display: grid; gap: 8px; width: 100%; max-width: 560px; }
.fprec > div { width: var(--w); display: grid; grid-template-columns: 26px auto 1fr; gap: 14px; align-items: center; padding: 10px 14px; border-radius: 10px; background: color-mix(in srgb, var(--v-cur) 10%, var(--surface)); border: 1px solid var(--line); }
.fprec .n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: var(--raised); color: var(--fg-2); }
.fprec code { font-size: 16px; font-weight: 600; white-space: pre; }
.fprec small { color: var(--muted); font-size: 12.5px; text-align: right; }
.fprec .floop { margin-top: 6px; }
.fchain { display: grid; gap: 4px; width: 100%; max-width: 520px; }
.fchain .row { display: grid; grid-template-columns: minmax(0, 1fr) 64px minmax(0, 1fr); gap: 10px; align-items: center; }
.fchain .cond { padding: 12px 14px; border: 1px solid var(--v-cmp); border-radius: 10px; background: color-mix(in srgb, var(--v-cmp) 10%, var(--surface)); font: 600 14px var(--f-mono); text-align: center; }
.fchain .cond.else { border-style: dashed; border-color: var(--line-strong); background: var(--bg); }
.fchain i { font-style: normal; color: var(--muted); font-size: 12.5px; text-align: center; }
.fchain .res { padding: 12px 14px; border-radius: 10px; background: color-mix(in srgb, var(--v-done) 14%, var(--surface)); border: 1px solid var(--v-done); font-weight: 600; text-align: center; }
.fchain .no { padding-left: calc(25% - 16px); color: var(--muted); font-size: 12.5px; }
.wtog { display: flex; gap: 12px; flex-wrap: wrap; }
.wtog .btn { height: 44px; min-width: 132px; font: 600 15px var(--f-mono); }
.wtog .btn[aria-pressed="true"] { border-color: var(--v-done); background: color-mix(in srgb, var(--v-done) 14%, var(--surface)); }
.wtog .btn[aria-pressed="false"] { border-color: var(--v-bad); background: color-mix(in srgb, var(--v-bad) 12%, var(--surface)); }
.wres b.t { color: var(--v-done); } .wres b.f { color: var(--v-bad); }
.wquad { display: grid; grid-template-columns: minmax(0, 200px) minmax(0, 1fr); gap: 20px; align-items: center; }
.wplane { width: 100%; cursor: crosshair; border-radius: 10px; }
.wplane .bg { fill: var(--bg); }
.wplane .g { stroke: var(--line); stroke-width: 1; }
.wplane .ax { stroke: var(--fg-2); stroke-width: 1.5; }
.wplane .q { fill: var(--muted); font: 600 18px var(--f-mono); text-anchor: middle; dominant-baseline: middle; opacity: .6; }
.wplane .pt { fill: var(--v-cmp); stroke: var(--surface); stroke-width: 2; transition: cx .25s var(--ease-in-out), cy .25s var(--ease-in-out); }
.wtree { width: 100%; }
.wtree line { stroke: var(--line-strong); stroke-width: 1.5; transition: stroke .2s var(--ease); }
.wtree line.hit { stroke: var(--v-cmp); stroke-width: 3; }
.wtree .el { fill: var(--muted); font: 11px var(--f-mono); text-anchor: middle; }
.wtree .tn rect { fill: var(--bg); stroke: var(--line-strong); stroke-width: 1.2; transition: fill .2s var(--ease), stroke .2s var(--ease); }
.wtree .tn text { fill: var(--fg-2); font: 12px var(--f-mono); text-anchor: middle; }
.wtree .tn.hit rect { fill: color-mix(in srgb, var(--v-cmp) 18%, var(--surface)); stroke: var(--v-cmp); }
.wtree .tn.hit.leaf rect { fill: color-mix(in srgb, var(--v-done) 22%, var(--surface)); stroke: var(--v-done); }
.wtree .tn.hit text { fill: var(--fg); font-weight: 600; }
.wtree .tn { transform-box: fill-box; transform-origin: center; }

.wsort { display: grid; gap: 8px; }
.wsort > div { display: grid; grid-template-columns: 150px repeat(3, 44px); gap: 8px; align-items: center; }
.wsort small { color: var(--muted); font-size: 12.5px; }
.wsort span { height: 38px; display: grid; place-items: center; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); font: 600 17px var(--f-mono); }
.wsort span.cmp { border-color: var(--v-cmp); }
.wsort span.swp { border-color: var(--v-cmp); background: color-mix(in srgb, var(--v-cmp) 20%, var(--surface)); }
.wclock b.bad { color: var(--v-bad); }
.wpacks > div { align-content: start; }
.wpacks small { color: var(--muted); font-size: 12.5px; }
.wpacks > div.best { border-color: var(--v-done); background: color-mix(in srgb, var(--v-done) 12%, var(--surface)); }
.wpacks > div.best b { color: var(--v-done); }
@media (max-width: 640px) {
  .fprec > div { width: 100%; }
  .wquad { grid-template-columns: minmax(0, 1fr); }
  .wplane { max-width: 240px; justify-self: center; }
  .wsort > div { grid-template-columns: minmax(0, 1fr) repeat(3, 38px); }

.wsortrun .wres > [hidden] { display: none; }


/* a swap or shift in the code-synced sorting players: the pair turns red and slides */
.cell.swp { border-color: var(--v-bad) !important; background: color-mix(in srgb, var(--v-bad) 22%, var(--surface)) !important; color: var(--v-bad); font-weight: 700; }
.cr-rows .cell { transition: transform .45s var(--ease-in-out); }
.cr-rows .cell.void { visibility: hidden; }
@media (prefers-reduced-motion: reduce) { .cr-rows .cell { transition: none; } }

/* 基10: every placement of an h × w block */
.wplaces { display: flex; flex-wrap: wrap; gap: 10px; }
.wmini { display: grid; grid-template-columns: repeat(var(--m), 14px); gap: 2px; }
.wmini i { height: 14px; border-radius: 3px; background: var(--raised); }
.wmini i.on { background: color-mix(in srgb, var(--v-done) 65%, var(--surface)); }

/* 基11 widgets */
.wpaths { display: grid; grid-template-columns: repeat(var(--n), 52px); gap: 6px; max-width: 100%; }
.wpaths button { height: 46px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); color: var(--fg); font: 600 15px var(--f-mono); cursor: pointer; transition: background-color .15s var(--ease), border-color .15s var(--ease); }
.wpaths button.blk { background: color-mix(in srgb, var(--v-bad) 30%, var(--surface)); border-color: var(--v-bad); color: var(--v-bad); }
.wpaths button.end { border-color: var(--v-done); color: var(--v-done); }
@media (hover: hover) and (pointer: fine) { .wpaths button:hover { border-color: var(--v-cmp); } }
@media (max-width: 640px) { .wpaths { grid-template-columns: repeat(var(--n), minmax(0, 1fr)); } }
.gsvg rect.disk { fill: color-mix(in srgb, var(--v-done) 55%, var(--surface)); stroke: var(--v-done); transition: fill .2s var(--ease); }
.gsvg rect.disk.hot { fill: var(--v-cmp); stroke: var(--v-cmp); }

/* a chapter card's title grows into the chapter heading */
::view-transition-group(chtitle) { animation-duration: .3s; animation-timing-function: var(--ease); }

/* this round: merged programs, tag search, more visualizers, motion */
details.prog { border: 1px solid var(--line); border-radius: var(--r-card); background: var(--surface); overflow: hidden; }
details.prog summary { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; padding: 10px 16px; cursor: pointer; list-style: none; }
details.prog summary::-webkit-details-marker { display: none; }
details.prog summary .mono { font-weight: 600; }
details.prog summary small { color: var(--muted); font-size: 13px; }
details.prog summary .show { margin-left: auto; font-size: 13px; color: var(--accent); }
details.prog summary .show::before { content: "▸ "; display: inline-block; transition: transform .2s var(--ease); }
details.prog[open] summary .show::before { transform: rotate(90deg); }
details.prog[open] summary .show { color: var(--muted); font-size: 0; }
details.prog[open] summary .show::before { font-size: 13px; }
details.prog[open] summary .show::after { content: "Hide code"; font-size: 13px; }
details.prog[open] summary { border-bottom: 1px solid var(--line); }
.progbar { display: flex; justify-content: flex-end; padding: 6px 12px 0; background: var(--code-bg); }
details.prog[open] .progbody { animation: rise .22s var(--ease) both; }
.tagcloud { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 8px 8px; }
.results:not([hidden]) { animation: pop .14s var(--ease) both; transform-origin: top; }
@keyframes pop { from { opacity: 0; transform: scale(.98) translateY(-4px); } }
.arow { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
.alabel { width: 92px; flex: none; font-size: 12px; color: var(--muted); text-align: right; }
.cell.done { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.gsvg line.hot { stroke: var(--accent); stroke-width: 3; }
.gsvg line.mst { stroke: var(--accent); stroke-width: 4; }
.gsvg line.skip { stroke-dasharray: 4 4; opacity: .5; }
.gsvg text.w { font-size: 11px; fill: var(--muted); text-anchor: middle; font-family: var(--f-mono); }
.gn.open circle { stroke: var(--accent); stroke-dasharray: 3 3; }
.rn circle { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.2; transition: fill .15s ease; }
.rn text { text-anchor: middle; font-family: var(--f-mono); font-size: 11px; fill: var(--fg); }
.rn text.v { fill: var(--accent); font-size: 10px; }
.rn { opacity: 0; transition: opacity .2s ease; }
.rn.on { opacity: 1; }
.rn.ret circle { fill: color-mix(in srgb, var(--accent) 20%, var(--surface)); }
.rn.cur circle { stroke: var(--accent); stroke-width: 2.5; }
.tsvg line { transition: opacity .2s ease; }
.ivs rect { fill: var(--raised); stroke: var(--line-strong); }
.ivs rect.take { fill: var(--accent); stroke: var(--accent); }
.ivs rect.skip { opacity: .35; }
.ivs rect.cur { stroke: var(--fg); stroke-width: 2; }
.ivs .tick { font-size: 11px; fill: var(--muted); font-family: var(--f-mono); }

/* the map draws itself the first time it appears, column by column */
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes nodein { from { opacity: 0; transform: translateY(6px); } }
.intro .edge { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .6s var(--ease) forwards; animation-delay: calc(min(var(--d), 8) * 50ms); }
.intro .node > * { animation: nodein .4s var(--ease) both; animation-delay: calc(min(var(--d), 8) * 50ms); }
/* a chosen chapter's path draws in */
/* highlighted paths flow in the direction you would learn them */
@keyframes flow { to { stroke-dashoffset: -0.06; } }
.edge.hot { stroke-width: 2.4; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .6s var(--ease) forwards; }
.edge.hin, .edge.hout { stroke-width: 2.4; stroke-dasharray: 0.035 0.025; animation: flow 1.2s linear infinite; } /* hover only, so it ends on pointer-leave */
.edge.hot.hin, .edge.hot.hout { animation: draw .6s var(--ease) forwards, flow 1.2s linear infinite; } /* keep the finished draw in the list so leaving the hover doesn't redraw the path */
/* a chapter just marked learned pops */
@keyframes popnode { 40% { transform: scale(1.08); } }
.node.pop rect.box { transform-box: fill-box; transform-origin: center; animation: popnode .45s var(--ease); }
/* checkmarks draw themselves */
.chk { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; margin-right: 4px; vertical-align: -1px; }
.chk path { stroke-dasharray: 1; stroke-dashoffset: 1; }
[aria-pressed="true"] .chk path { animation: draw .35s var(--ease) .05s forwards; }
.tick { display: inline-grid; place-items: center; width: 18px; height: 18px; border: 1.5px solid var(--line-strong); border-radius: 5px; cursor: pointer; position: relative; transition: background-color .15s ease, border-color .15s ease; }
.tick input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.tick svg { width: 14px; height: 14px; fill: none; stroke: var(--bg); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.tick path { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset .3s var(--ease); }
.tick:has(input:checked) { background: var(--accent); border-color: var(--accent); }
.tick:has(input:checked) path { stroke-dashoffset: 0; }
.tick:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
/* progress bars grow in when a view opens */
@keyframes grow { from { transform: scaleX(0); } }
.strip:not(.still) .meter i { transform-origin: left; animation: grow .7s var(--ease) both; }
.cheat tbody tr { animation: rise .35s var(--ease) both; animation-delay: calc(var(--i) * 45ms); }
/* page changes by click: the old view lifts away, the new one settles in */
@keyframes vt-out { to { opacity: 0; transform: translateY(-6px); } }
@keyframes vt-in { from { opacity: 0; transform: translateY(10px); } }
::view-transition-old(root) { animation: vt-out .16s var(--ease) both; }
::view-transition-new(root) { animation: vt-in .26s var(--ease) both; }
@media (prefers-reduced-motion: reduce) {
  .intro .edge, .edge.hot { animation: none; stroke-dasharray: none; stroke-dashoffset: 0; }
  .intro .node > *, .node.pop rect.box, .strip .meter i, .cheat tbody tr, details.prog[open] .progbody, .results:not([hidden]) { animation: none; }
}

@media (max-width: 1000px) {
  .treeview, .chapter { grid-template-columns: minmax(0, 1fr); }
  .side, .aside { position: static; }
}
@media (max-width: 560px) {
  .bar-in { gap: 8px 12px; padding-block: 8px; }
  .brand span { display: none; }
  .search { order: 3; flex-basis: 100%; max-width: none; }
  .strip { gap: 4px 16px; font-size: 13px; }
  .strip .meter, .strip .en { display: none; }
  .canvas { max-height: 64vh; min-height: 200px; }
  .minimap { width: 120px; }
  .sk-hero { grid-template-columns: minmax(0, 1fr); min-height: 0; }
  .frame .top span + span, .tools .hint { display: none; }
  .ptag { display: none; }
  .results { min-width: 0; }
}
/* Reduced motion: drop movement, keep the fades and colour changes that confirm an action. */
@media (prefers-reduced-motion: reduce) {
  .toast, .toast.show { transform: translate(-50%, 0); }
  .btn:active, .status button:active, .copy:active, .chip:active, .seg button:active, .iconbtn:active { transform: none; }
  .chip:hover .ficon, .tile:hover .ficon, .trackcard:hover .ficon, .mrow:hover .ficon, .box:hover .ci,
  .tile:hover, .trackcard:hover, .tier:hover, .badge.got:hover, .place:hover, .nextcard:hover { transform: none; }
}

<body>

  <div class="bar-in wrap">

    <div class="prefs"><button class="btn sm" id="langBtn" data-lang aria-label="Switch interface language">中</button><button class="btn sm" id="skinBtn" data-skin aria-label="Change theme">Auto</button></div>
    <div class="search" role="search">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11.7 10.3a6 6 0 1 0-1.4 1.4l3.6 3.6 1.4-1.4-3.6-3.6zM6.8 11a4.2 4.2 0 1 1 0-8.4 4.2 4.2 0 0 1 0 8.4z"/></svg>

<main class="wrap" id="view" aria-busy="true">

    <div class="sk-hero"><div><div class="sk sk-h1"></div><div class="sk sk-h1 short"></div><div class="sk sk-line"></div><div class="sk sk-line"></div><div class="sk sk-btns"></div></div><div class="sk sk-map"></div></div>
  </div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script defer src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/CustomEase.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
<script>
(function () {
  "use strict";
  const LEVELS = [
    { key: "基", slug: "b", name: "基础篇", en: "Basics" },
    { key: "进", slug: "j", name: "进阶篇", en: "Intermediate" },
    { key: "拓", slug: "t", name: "拓展篇", en: "Extended" },
    { key: "N", slug: "n", name: "NOI篇", en: "NOI" },
  ];
  const LUOGU = [
    ["入门", "#fe4c61"], ["普及−", "#f39c11"], ["普及", "#d99500"], ["普及+/提高−", "#3fa415"],
    ["提高", "#3498db"], ["提高+/省选−", "#9d3dcf"], ["省选/NOI−", "#0e1d69"], ["NOI/NOI+/CTS", "#222222"],
  ];
  const cfColor = r => r < 1200 ? "#808080" : r < 1400 ? "#2e8b2e" : r < 1600 ? "#03a89e" : r < 1900 ? "#3b5bdb" : r < 2100 ? "#a0a" : r < 2400 ? "#e08a00" : "#d22";
  const KIND = { "IDEA": "Idea", "KEY POINT": "Key point", "TRAP": "Trap", "NOTE": "Note", "TIP": "Tip", "WARNING": "Warning" };

  let A = [], byId = {}, bySlug = {}, kids = {};
  let problems = null, selected = null, levelFilter = "all";
  let introPending = true, justLearned = null, pulseId = null;
  let startPick = null; // read from storage once it exists (below)
  // Open the map on one chapter: select it, zoom to 100%, glide there and pulse.
  function locate(id) { selected = id; zoomS = 1; pulseId = id; if (location.hash === "#map") viewTree(); else location.hash = "map"; }
  let zoomS = null, curS = 1; // chosen map scale (null = fit) and the one drawn now
  const ZMIN = 0.2, ZSTEPS = [0.2, 0.3, 0.45, 0.6, 0.8, 1];

  // ---- per-viewer storage (this browser only) ----
  const store = {
    get(k, d) { try { const v = localStorage.getItem("atlas." + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("atlas." + k, JSON.stringify(v)); } catch (e) { /* storage blocked: keep in memory */ } },
  };
  let prog = store.get("progress", {});
  let solved = new Set(store.get("solved", []));
  let notes = store.get("notes", {});
  let mistakes = store.get("mistakes", {}), checks = store.get("checks", {}), goal = store.get("goal", null);
  let shareProg = null; // someone else's progress, shown read-only on #shared
  const statusOf = id => (shareProg || prog)[id] || "none";
  function setStatus(id, s) {
    const key = id.replace(/\d+$/, ""), full = () => A.filter(c => c.id.startsWith(key)).every(c => statusOf(c.id) === "learned");
    const was = full();
    if (s === "none") delete prog[id]; else prog[id] = s;
    store.set("progress", prog);
    layout = null; // folded levels depend on status
    if (s === "learned") { justLearned = id; setTimeout(() => (justLearned = null), 700); }
    if (s === "learned") { learnedAt[id] = Date.now(); delete reviews[id]; store.set("learnedAt", learnedAt); store.set("reviews", reviews); }
    logDay();
    toast(`${id} · ${s === "none" ? "not started" : s}`);
    if (!was && full()) setTimeout(() => celebrate(key)); // after the caller re-renders
  }
  // Rare moment, so it may run longer than UI motion: the finished lane lights up once.
  function celebrate(key) {
    toast(`${LEVELS.find(l => l.key === key).name} complete`);
    // An opacity glow with no movement, so it stays under reduced motion.
    const lane = document.querySelector(`.lane-bg[data-lv="${key}"]`);
    if (lane) lane.animate([{ opacity: 0.045 }, { opacity: 0.22 }, { opacity: 0.045 }], { duration: 900, easing: "cubic-bezier(0.22, 1, 0.36, 1)" }); // same curve as --ease; WAAPI can't read CSS variables
  }
  function toggleSolved(pid) { solved.has(pid) ? solved.delete(pid) : solved.add(pid); store.set("solved", [...solved]); logDay(); }

  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const lvOf = c => LEVELS.find(l => c.id.startsWith(l.key));
  const lvClass = c => "lv-" + lvOf(c).slug;
  const isReady = c => statusOf(c.id) !== "learned" && c.pre.every(p => statusOf(p) === "learned");
  let toastTimer = 0;
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800); }
  const problemUrl = (judge, id) => judge === "luogu" ? `https://www.luogu.com.cn/problem/${id}` : (m => m ? `https://codeforces.com/problemset/problem/${m[1]}/${m[2]}` : "#")(id.match(/^(\d+)([A-Z]\d?)$/));
  // First starred problem of a chapter not ticked yet (the stars in atlas.json, so no extra fetch).
  function nextStar(c) {
    const x = [...c.stars.luogu.map(p => ["luogu", p]), ...c.stars.codeforces.map(p => ["codeforces", p])].find(([, p]) => !solved.has(p.id));
    return x ? { judge: x[0], p: x[1], label: (x[0] === "luogu" ? "" : "CF ") + x[1].id, url: problemUrl(x[0], x[1].id) } : null;
  }
  function nextChapter() {
    const gp = goalPath(), gnext = gp.length ? byId[gp.find(id => isReady(byId[id])) || gp[0]] : null;
    return { gnext, cur: gnext || A.find(c => statusOf(c.id) === "learning") || A.find(isReady) || A.find(c => statusOf(c.id) !== "learned") };
  }
  function resumeHtml() {
    const { gnext, cur } = nextChapter();
    if (!cur) return "";
    const s = nextStar(cur);
    return `<p class="resume">${gnext ? `Toward ${esc(goal)}: ` : "Continue: "}<a href="#ch-${cur.slug}"><span class="lv ${lvClass(cur)}">${cur.id}</span> <span class="cjk">${esc(cur.title)}</span></a>${s ? ` → next ★ <a href="${s.url}" target="_blank" rel="noopener" class="mono">${esc(s.label)}</a> <span class="cjk">${esc(s.p.name)}</span>` : ""}</p>`;
  }
  // FLIP: draw the full-size map at the clicked box's old size, then let it grow into place.
  function zoomFrom(before, id) {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const svg = document.querySelector("#canvas svg"), node = document.querySelector(`.node[data-id="${id}"]`);
    if (!svg || !node) return;
    const after = node.getBoundingClientRect(), o = svg.getBoundingClientRect(), s = before.width / after.width;
    const tx = before.left - o.left - s * (after.left - o.left), ty = before.top - o.top - s * (after.top - o.top);
    svg.style.transition = "none";
    svg.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
    svg.getBoundingClientRect();
    svg.style.transition = "transform 280ms var(--ease)";
    svg.style.transform = "";
    svg.addEventListener("transitionend", () => (svg.style.transition = ""), { once: true });
  }
  async function copy(text) {
    try { await navigator.clipboard.writeText(text); toast("Copied"); }
    catch (e) {
      const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); toast("Copied"); } catch (e2) { toast("Select the text and copy it"); }
      ta.remove();
    }
  }

  // ---- graph helpers ----
  function ancestors(id, acc = new Set()) { for (const p of byId[id].pre) if (!acc.has(p)) { acc.add(p); ancestors(p, acc); } return acc; }
  function descendants(id, acc = new Set()) { for (const k of kids[id] || []) if (!acc.has(k)) { acc.add(k); descendants(k, acc); } return acc; }
  const depth = {};
  function depthOf(id) { if (depth[id] !== undefined) return depth[id]; const c = byId[id]; depth[id] = c.pre.length ? 1 + Math.max(...c.pre.map(depthOf)) : 0; return depth[id]; }
  function pathTo(id) {
    const need = [...ancestors(id)].filter(x => statusOf(x) !== "learned");
    need.sort((a, b) => depthOf(a) - depthOf(b) || A.indexOf(byId[a]) - A.indexOf(byId[b]));
    return need;
  }

  // ---- lane layout: one horizontal lane per level, columns = prerequisite depth ----
  const W = 212, H = 56, COLW = 244, ROWH = 68, LANEW = 28, PADY = 14, LANEGAP = 16, LANEPAD = 14;
  let layout = null, foldDone = store.get("foldDone", false), readyOnly = false, phoneOpened = false;
  const FOLDH = 40;
  const folded = key => foldDone && A.filter(c => c.id.startsWith(key)).every(c => statusOf(c.id) === "learned");
  const isFoldedId = id => !!(layout && layout.lanes.find(l => l.folded && id.startsWith(l.level.key)));
  function computeLayout() {
    const order = A.map(c => c.id);
    const maxD = Math.max(...A.map(c => depthOf(c.id)));
    const cells = {}; // level -> depth -> [ids]
    LEVELS.forEach(l => (cells[l.key] = Array.from({ length: maxD + 1 }, () => [])));
    A.forEach(c => cells[lvOf(c).key][depthOf(c.id)].push(c.id));
    const xy = {};
    let lanes = [];
    const place = () => {
      let y = PADY;
      lanes = LEVELS.map(l => {
        const top = y;
        if (folded(l.key)) { // a finished level shrinks to one bar; its nodes sit on the bar so sort keys still work
          cells[l.key].forEach((col, d) => col.forEach(id => (xy[id] = { x: LANEW + d * COLW, y: top })));
          y += FOLDH + LANEGAP;
          return { level: l, top, height: FOLDH, folded: true };
        }
        const rows = Math.max(1, ...cells[l.key].map(col => col.length));
        cells[l.key].forEach((col, d) => col.forEach((id, i) => (xy[id] = { x: LANEW + d * COLW, y: top + LANEPAD + i * ROWH })));
        y += rows * ROWH + LANEPAD * 2 - (ROWH - H) + LANEGAP;
        return { level: l, top, height: y - top - LANEGAP };
      });
      return y;
    };
    let height = place();
    for (let sweep = 0; sweep < 6; sweep++) {
      LEVELS.forEach(l => cells[l.key].forEach(col => {
        const key = id => { const ps = byId[id].pre; return ps.length ? ps.reduce((s, p) => s + xy[p].y, 0) / ps.length : xy[id].y; };
        col.sort((a, b) => key(a) - key(b) || order.indexOf(a) - order.indexOf(b));
      }));
      height = place();
    }
    layout = { xy, lanes, maxD, width: LANEW + maxD * COLW + W + 24 + 216, height: height - LANEGAP + 12, mapHeight: height - LANEGAP + 12 }; // +216: room to scroll past the minimap

      <div class="block"><p class="label">Mastery by topic</p><div class="mastery">${FAMILIES.map(f => { const all = A.filter(c => c.fam === f.key), done = all.filter(c => statusOf(c.id) === "learned").length; return `<div class="mrow"><span class="fam">${icon(f.key)}${f.name}</span><span class="mbar"><i style="width:${(done / all.length) * 100}%"></i></span><span class="n">${done}/${all.length}</span></div>`; }).join("")}</div></div>
      ${nextChapterCard()}
      <div class="block"><p class="label">Study days · last 12 months</p>${heatmapHtml()}</div>
      <div class="block"><p class="label">Milestones</p><div class="badges">${MILESTONES.map(m => { const got = m.test(); return `<div class="badge${got ? " got" : ""}"><svg class="medal" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="14" r="6" pathLength="1"/><path d="M8.5 3l3.5 5 3.5-5" pathLength="1"/><path d="M12 11.5l.9 1.9 2 .3-1.5 1.4.4 2-1.8-1-1.8 1 .4-2-1.5-1.4 2-.3z" pathLength="1"/></svg><span>${m.name}</span><small class="hint">${got ? "Earned" : m.how}</small></div>`; }).join("")}</div></div>
      <div class="block"><p class="label">Problems ticked · ${solved.size}</p><div class="links">${[...solved].slice(0, 200).map(p => `<span class="pill">${esc(p)}</span>`).join("") || '<span class="hint">None yet</span>'}</div></div>
      <div class="card"><p class="label">Send to CP Coach</p><p style="margin:0 0 12px">Progress here is saved in this browser only. To copy it into the CP Coach mod, paste this to Claude.</p>
        <div class="cc">${esc(cc)}</div><div class="btns"><button class="btn primary" data-copy-cc>Copy</button></div></div>
      ${allMistakesHtml()}
      <div class="card"><p class="label">Share your progress</p><p style="margin:0 0 12px">A read-only link: whoever opens it sees your map coloured by what you've learned, and their own progress isn't touched. Or save a picture of it.</p>
        <div class="cc" id="shareLink">${esc(shareLink())}</div><div class="btns"><button class="btn primary" data-copy-share>Copy link</button><button class="btn" data-card-img>Download progress picture</button></div></div>
      <div class="card"><p class="label">Back up your progress</p><p style="margin:0 0 12px">Save a backup file and keep it somewhere safe, or load one to move your progress to another browser or device.</p>
        <div class="btns" style="margin:0 0 12px"><button class="btn primary" data-backup="download">Download backup file</button><label class="btn">Load a backup file<input type="file" id="restoreFile" accept=".json,application/json" hidden></label><button class="btn" data-backup="copy">Copy as text</button></div>
        <textarea class="notes" id="restoreText" style="min-height:80px" placeholder="Paste a backup here" aria-label="Backup to restore"></textarea>
        <div class="btns"><button class="btn" data-backup="restore">Restore from backup</button></div>
        <p class="hint" id="restoreNote" hidden>Press Restore again to replace everything in this browser with the backup.</p></div>
      <div class="block"><p class="label">Mark a whole level learned</p><div class="btns" style="margin-top:0">${LEVELS.map(l => `<button class="btn" data-bulk="${l.key}">${l.name}</button>`).join("")}<button class="btn" data-bulk="reset">Reset everything</button></div>
        <p class="hint" id="resetNote" hidden>Press Reset everything again to confirm. This clears chapter status, ticked problems, your goal and your mistake notes in this browser.</p></div>
      </div>`;
    $("#view").dataset.cc = cc;
  }

  function codeHtml(code) {
    let html;
    try { html = window.hljs ? hljs.highlight(code, { language: "cpp", ignoreIllegals: true }).value : esc(code); } catch (e) { html = esc(code); }
    const out = []; const open = [];
    html.split("\n").forEach(line => {
      const prefix = open.join("");
      (line.match(/<span[^>]*>|<\/span>/g) || []).forEach(t => (t.startsWith("</") ? open.pop() : open.push(t)));
      out.push(`<span class="l">${prefix}${line}${"</span>".repeat(open.length)}</span>`);
    });
    return out.join("");
  }

  // The handout in reading order: headings, paragraphs, boxes, tables, numbered points, program links.
  const secId = num => "sec-" + num.replace(/\./g, "-");
  function concepts(c) {
    // Each chapter's text is its own file, fetched the first time the chapter opens.
    if (c.flow === undefined) {
      fetch(`handouts/${c.slug}.flow.json`).then(r => r.json()).then(f => { c.flow = f; route(); }).catch(() => { c.flow = null; route(); });
      return `<p class="empty">Loading the chapter text</p>`;
    }
    const pdf = page => `handouts/${c.slug}.pdf#page=${page}`;
    const flow = c.flow || [];
    // a hand-written lesson places its own visualizer and uses the roomier layout
    const lesson = flow.some(b => LESSON_BLOCKS.has(b.t));
    const vis = VIS[c.id] && !flow.some(b => b.t === "vis") ? `<div class="vis" id="vis"></div>` : "";
    const luogu = s => s.replace(/\b([PB]\d{4})\b/g, id => `<a class="mono" href="${problemUrl("luogu", id)}" target="_blank" rel="noopener">${id}</a>`);
    const html = vis + flow.map(b => {
      switch (b.t) {
        case "h2": return `<div class="sec" id="${secId(b.num)}"><span class="n">${b.num}</span><h3>${esc(b.title)}</h3></div>`;
        case "h3": return `<h4 class="sub" id="${secId(b.num)}"><span class="n">${b.num}</span> ${esc(b.title)}</h4>`;
        case "lede": return `<p class="lede">${rich(b.text)}</p>`;
        case "p": return `<p class="para">${rich(b.text)}</p>`;
        case "li": { const m = b.text.match(/^(\d+)\.\s*([\s\S]*)$/); return m ? `<p class="para li"><span class="num">${m[1]}</span><span>${rich(m[2])}</span></p>` : `<p class="para li">${rich(b.text)}</p>`; }
        case "box": { const k = CALLOUT[b.kind] || CALLOUT.NOTE; return `<div class="box ${k.cls}"><b>${k.icon}<span>${k.zh}</span><span class="hint">${k.en}</span></b><div>${rich(b.text)}</div></div>`; }
        case "pre": return `<div class="tbl"><pre>${esc(b.lines.join("\n"))}</pre><a class="jump" href="${pdf(b.page)}" target="_blank" rel="noopener">Laid out properly in the PDF, page ${b.page} →</a></div>`;
        case "fig": return `<a class="jump fig" href="${pdf(b.page)}" target="_blank" rel="noopener">Diagram on PDF page ${b.page} →</a>`;
        case "prog": { const k = c.programs.findIndex(p => p.file === b.file); return k < 0 ? "" : progBlock(c, k, b.open); }
        case "figure": return FIG[b.name] ? `<figure class="lfig">${FIG[b.name]()}</figure>` : "";
        case "vis": return VIS[c.id] ? `<div class="vis"${b.k ? "" : ' id="vis"'} data-vk="${b.k || 0}"></div>` : "";
        case "widget": return WIDGET[b.name] ? `<section class="lwid" data-widget="${b.name}"><p class="lwhead"><span>Try it</span>${esc(WIDGET[b.name].title)}</p>${WIDGET[b.name].html()}</section>` : "";
        case "table": {
          const code = new Set(b.code || []);
          const cell = (v, j) => (j === b.link ? `<a class="mono" href="${problemUrl("luogu", v)}" target="_blank" rel="noopener">${esc(v)}</a>` : code.has(j) ? `<code>${esc(v)}</code>` : rich(v));
          return `<div class="ltable">${b.title ? `<p class="ltitle">${esc(b.title)}</p>` : ""}<div class="tablewrap"><table><thead><tr>${b.cols.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${b.rows.map(r => `<tr>${r.map((v, j) => `<td>${cell(v, j)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
        }
        case "steps": return `<ol class="lsteps">${b.items.map((s, k) => `<li><span class="n">${k + 1}</span><b>${esc(s.h)}</b><span>${luogu(rich(s.p))}</span></li>`).join("")}</ol>`;
        case "cards": return `<div class="lcards${b.try ? " try" : ""}">${b.title ? `<p class="ltitle">${esc(b.title)}</p>` : ""}${b.items.map((t, k) => `<div class="lcard"><span class="n">${b.try ? "Try " + (k + 1) : "✓"}</span><span>${rich(t)}</span></div>`).join("")}</div>`;
        default: return "";
      }
    }).join("");
    // programs the text never mentions still belong to the chapter: list them at the end
    const placed = new Set((c.flow || []).filter(b => b.t === "prog").map(b => b.file));
    const rest = c.programs.map((p, k) => (placed.has(p.file) ? "" : progBlock(c, k))).join("");
    const all = html + (rest ? `<div class="sec"><span class="n">+</span><h3>More programs</h3></div>${rest}` : "");
    return all ? `<div class="flow${lesson ? " lesson" : ""}">${all}</div>` : `<p class="empty">This handout's text could not be read. Open the PDF instead</p>`;
  }
  // A program sits folded where the handout shows it (a lesson may show it open); clicking opens the code, its samples and copy buttons.
  function progBlock(c, i, open) {
    const p = c.programs[i];
    return `<details class="prog" id="prog-${i}"${open ? " open" : ""}><summary><span class="mono">${esc(p.file)}</span><small>${p.code.split("\n").length} lines${p.samples.length ? " · sample input and output" : ""}</small><span class="show">Show code</span></summary>
      <div class="progbody"><div class="progbar"><button class="copy" data-copy-prog="${i}">Copy code</button></div><pre class="code"><code>${codeHtml(p.code)}</code></pre>
      ${p.samples.length ? `<div class="io">${p.samples.map((s, j) => `<div><b><span>${esc(s.label)}</span><button class="copy" data-copy-io="${i}:${j}">Copy</button></b><pre>${esc(s.text)}</pre></div>`).join("")}</div>` : ""}</div></details>`;
  }
  const outline = c => (c.flow || []).filter(b => b.t === "h2" || b.t === "h3")
    .map(b => `<li class="${b.t}"><button class="linkish" data-goto="${secId(b.num)}" data-spy="${secId(b.num)}"><span class="n">${b.num}</span> <span class="cjk">${esc(b.title)}</span></button></li>`).join("");

  function problemRows(c, judge, filter) {
    const list = (problems && problems[c.id] && problems[c.id][judge]) || [];
    const rows = list.filter(p => (!filter.star || p.star) && (!filter.hide || !solved.has(p.id)) && (filter.d === "" || (judge === "luogu" ? String(p.d) === filter.d : String(Math.floor(p.r / 400) * 400) === filter.d)) && (!filter.q || (p.name + " " + p.id + " " + p.tags.join(" ")).toLowerCase().includes(filter.q)));
    const diff = p => judge === "luogu" ? `<span class="diff" style="background:${LUOGU[p.d][1]}">${LUOGU[p.d][0]}</span>` : `<span class="diff" style="background:${cfColor(p.r)}">${p.r}</span>`;
    const done = list.filter(p => solved.has(p.id)).length;
    return { html: rows.length ? `<div class="tablewrap"><table><thead><tr><th>Done</th><th>Problem</th><th>Name</th><th>${judge === "luogu" ? "Difficulty" : "Rating"}</th><th class="ptag">Tags</th><th style="text-align:right">${judge === "luogu" ? "Accepted" : "Solved"}</th></tr></thead><tbody>
      ${rows.map(p => `<tr class="${solved.has(p.id) ? "solved" : ""}"><td><label class="tick"><input type="checkbox" id="s-${judge}-${esc(p.id)}" data-solve="${esc(p.id)}" ${solved.has(p.id) ? "checked" : ""} aria-label="Mark ${esc(p.id)} solved"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" pathLength="1"/></svg></label></td>
        <td class="id">${p.star ? '<span class="star" title="Tests exactly this chapter\'s technique">★</span> ' : ""}<a href="${problemUrl(judge, p.id)}" target="_blank" rel="noopener">${judge === "luogu" ? esc(p.id) : "CF " + esc(p.id)}</a></td>
        <td class="cjk">${esc(p.name)}${judge === "luogu" ? (solved.has(p.id) ? ` <a class="sol" href="${solutionUrl(p.id)}" target="_blank" rel="noopener">题解</a>` : ` <button class="linkish sol" data-stuck="${esc(p.id)}">Stuck?</button>`) : ""}</td><td>${diff(p)}</td><td class="hint ptag">${esc(p.tags.slice(0, 4).join(", "))}</td><td class="num">${p.ac.toLocaleString("en-US")}</td></tr>`).join("")}</tbody></table></div>` : `<p class="empty">No problems match these filters</p>`, done, total: list.length, shown: rows.length };
  }

  let pstate = { judge: "luogu", star: false, hide: false, d: "", q: "" };
  function problemsTab(c) {
    if (!problems) {
      fetch("problems.json").then(r => r.json()).then(j => { problems = j; route(); }).catch(() => { $("#tabbody").innerHTML = `<p class="empty">The problem list didn't load. Reload the page to try again</p>`; });
      return `<p class="empty">Loading ${c.counts.luogu + c.counts.codeforces} problems</p>`;
    }
    const r = problemRows(c, pstate.judge, pstate);
    const ladder = ladderHtml(c);
    const opts = pstate.judge === "luogu" ? LUOGU.map((l, i) => `<option value="${i}" ${pstate.d === String(i) ? "selected" : ""}>${l[0]}</option>`).join("") : [800, 1200, 1600, 2000, 2400, 2800, 3200].map(v => `<option value="${v}" ${pstate.d === String(v) ? "selected" : ""}>${v}–${v + 399}</option>`).join("");
    return `<div class="ptools">
      <div class="seg" role="group" aria-label="Judge"><button data-judge="luogu" aria-pressed="${pstate.judge === "luogu"}">Luogu ${c.counts.luogu}</button><button data-judge="codeforces" aria-pressed="${pstate.judge === "codeforces"}">Codeforces ${c.counts.codeforces}</button></div>
      <select id="pdiff" aria-label="Difficulty"><option value="">All difficulties</option>${opts}</select>
      <input type="text" id="pq" placeholder="Filter" value="${esc(pstate.q)}" aria-label="Filter problems by name or tag">
      <label><input type="checkbox" id="pstar" ${pstate.star ? "checked" : ""}> ★ only</label>
      <label><input type="checkbox" id="phide" ${pstate.hide ? "checked" : ""}> Hide done</label>
      <span class="hint">${r.done}/${r.total} done · showing ${r.shown}</span></div>
      ${ladder}
      <p class="hint" style="margin:0 0 12px">★ problems test exactly this chapter's technique, so do those first. Lists run easiest to hardest, and ticks are saved in this browser</p>
      ${r.html}`;
  }

  function viewChapter(slug, tab, sec) {
    const c = bySlug[slug];
    if (!c) return viewTree();
    if (tab !== "problems") tab = "concepts"; // old links to the Code, Handout and Notes tabs land on the chapter
    const i = A.indexOf(c), prev = A[i - 1], next = A[i + 1];
    const tabs = [["concepts", "Learn", `${c.boxes.length} ideas · ${c.programs.length} programs`], ["problems", "Problems", c.counts.luogu + c.counts.codeforces]];
    const body = tab === "problems" ? problemsTab(c) : myMistakesBox(c) + concepts(c);
    const need = pathTo(c.id), star = nextStar(c);
    $("#view").innerHTML = `<div class="chapter" style="--c: var(--${lvClass(c)})">
      <div style="min-width:0">
        <div class="crumbs"><a href="#map" data-select="${c.id}">Tree</a><span>/</span><a href="#list">${lvOf(c).name}</a><span>/</span><span>${c.id}</span></div>
        <div class="chead"><span class="lv ${lvClass(c)}">${c.id} · ${lvOf(c).name} 第${c.num}章</span> <span class="fam hint">${icon(c.fam)}${famOf(c.fam).name}</span><h1 style="view-transition-name: chtitle">${esc(c.title)}</h1><p class="en">${esc(c.en)}</p><p class="sum">${esc(c.summary)}</p>
          <div class="metacard">${headerMeta(c)}</div></div>
        <nav class="tabs" aria-label="Chapter sections">${tabs.map(([k, label, n]) => `<a href="#ch-${c.slug}${k === "concepts" ? "" : "-" + k}" ${(tab || "concepts") === k ? 'aria-current="page"' : ""}>${tabLabel(label)}<small>${n}</small></a>`).join("")}</nav>
        <div id="tabbody">${body}</div>
        <div class="donebar"><span>Finished reading ${c.id}?</span>${statusButtons(c.id)}</div>
        <div class="pager">${prev ? `<a href="#ch-${prev.slug}"><small>← ${prev.id}</small><span class="cjk">${esc(prev.title)}</span></a>` : "<span></span>"}${next ? `<a class="next" href="#ch-${next.slug}"><small>${next.id} →</small><span class="cjk">${esc(next.title)}</span></a>` : "<span></span>"}</div>
      </div>
      <aside class="aside">
        <div class="block"><p class="label">Status</p>${statusButtons(c.id)}
          <div class="btns even"><a class="btn primary" href="handouts/${c.slug}.pdf" target="_blank" rel="noopener">Handout PDF</a><a class="btn" href="#map" data-select="${c.id}">Show in tree</a></div>
          <div class="btns"><button class="btn" data-goal="${c.id}">${goal === c.id ? "Clear goal" : "Set as my goal"}</button></div></div>
        ${mistakesHtml(c)}
        ${star ? `<div class="block"><p class="label">Next ★ problem</p><a class="btn" style="width:100%;justify-content:flex-start" href="${star.url}" target="_blank" rel="noopener"><span class="mono">${esc(star.label)}</span><span class="cjk" style="overflow:hidden;text-overflow:ellipsis">${esc(star.p.name)}</span></a></div>` : ""}
        <div class="block"><p class="label">On this page</p><ol class="outline">${outline(c)}</ol></div>
        <div class="block"><p class="label">Needs</p><div class="links">${c.pre.length ? c.pre.map(chLink).join("") : '<span class="hint">Nothing, a starting point</span>'}</div></div>
        <div class="block"><p class="label">Unlocks</p><div class="links">${(kids[c.id] || []).map(chLink).join("") || '<span class="hint">Nothing further</span>'}</div></div>
        ${need.length ? `<div class="block"><p class="label">Still to learn first · ${need.length}</p><div class="links">${need.map(chLink).join("")}</div></div>` : ""}
        <div class="block"><p class="label">With CP Coach</p><div class="cc">/learn ${c.id}</div><div class="cc">/practice ${c.id}</div><p class="hint" style="margin-top:8px">Type these in Claude Code to study this chapter or get its next problems</p></div>
      </aside></div>`;
    if ((tab || "concepts") === "concepts") { mountVis(c); mountWidgets(); spyOutline(); if (sec) { const el = document.getElementById("sec-" + sec); if (el) setTimeout(() => el.scrollIntoView({ block: "start" }), 0); } }
    const nx = A[i + 1]; // fetch the next chapter's text now so Next feels instant
    if (nx && nx.flow === undefined) fetch(`handouts/${nx.slug}.flow.json`).then(r => r.json()).then(f => { if (nx.flow === undefined) nx.flow = f; }).catch(() => {});
    window.scrollTo(0, 0);
  }

  // ---- front page: what the site is, shown with its own map, one chapter and the CP Coach link ----
  // ================= Home: what the site is, what you learn, what you get, and a few things to try =================
  const PLACES = [["基1", "New to programming", "Start from your first C++ program"], ["进1", "Know the basics · CSP-J", "Start at the intermediate techniques"], ["拓1", "Experienced · CSP-S / NOIP", "Start at the extended topics"]];
  function placesHtml() {
    const pick = startPick && byId[startPick];
    return `<div id="lpPlaces"><div class="places">${PLACES.map(([id, who, what]) => `<button class="place${startPick === id ? " on" : ""}" data-start="${id}"><b>${who}</b><span class="hint">${what}</span><span class="lv ${lvClass(byId[id])}">${id} ${esc(byId[id].title)}</span></button>`).join("")}</div>
      ${pick ? `<p class="pickrow">Your starting point is <a href="#ch-${pick.slug}" class="cjk"><span class="lv ${lvClass(pick)}">${pick.id}</span> ${esc(pick.title)}</a>. It is ringed on the map and in the chapter list.</p>` : ""}</div>`;
  }
  // Returning students see where they stand first.
  function progressHtml() {
    if (!learnedN() && !Object.keys(days).length) return "";
    const n = learnedN(), pct = Math.round((n / A.length) * 100), streakN = (() => { let k = 0; for (let d = new Date(); days[dayKey(d.getTime())]; d.setDate(d.getDate() - 1)) k++; return k; })();
    return `<section class="lp-section reveal" aria-label="Your progress"><div class="dash">
      <div class="ringcard"><svg class="ring" viewBox="0 0 120 120" aria-hidden="true"><circle class="rtrack" cx="60" cy="60" r="50" pathLength="100"/><circle class="rfill" cx="60" cy="60" r="50" pathLength="100" style="stroke-dashoffset:${100 - pct}"/></svg>
        <div class="ringtext"><b data-count="${pct}" data-suffix="%">${pct}%</b><span class="hint">of the course</span></div></div>
      <div class="stats">
        <div class="stat"><b data-count="${n}">${n}</b><span>chapters learned</span></div>
        <div class="stat"><b data-count="${solved.size}">${solved.size}</b><span>problems ticked</span></div>
        <div class="stat"><b data-count="${streakN}">${streakN}</b><span>day streak</span></div>
        <div class="stat"><b data-count="${dueReviews().length}">${dueReviews().length}</b><span>reviews due</span></div>
      </div></div>
      <div class="dash2" style="margin-top:16px">${dailyHtml()}${reviewsHtml()}</div></section>`;
  }
  // The hero's map: every chapter as a block that pops in by step, a path that traces itself, and blocks you can point at.
  function heroMapSvg() {
    const { xy, lanes, mapWidth: width, mapHeight: height } = layout, cur = nextChapter().cur;
    const chain = [...pathTo("进6"), "进6"].sort((a, b) => depthOf(a) - depthOf(b));
    const trace = chain.map((id, k) => `${k ? "L" : "M"}${xy[id].x + W / 2},${xy[id].y + H / 2}`).join(" ");
    return `<svg viewBox="0 0 ${width - 216} ${height}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="The course map: every chapter as a block, one lane per level">
      ${lanes.map(({ level: l, top, height: h }) => `<rect class="hm-lane" x="0" y="${top}" width="${width - 216}" height="${h}" rx="18" style="--c: var(--lv-${l.slug})"/>`).join("")}
      ${A.flatMap(c => c.pre.map(p => { const a = xy[p], b = xy[c.id]; return `<path class="hm-edge" data-f="${p}" data-t="${c.id}" d="M${a.x + W},${a.y + H / 2} C${a.x + W + 60},${a.y + H / 2} ${b.x - 60},${b.y + H / 2} ${b.x},${b.y + H / 2}"/>`; })).join("")}
      <path class="hm-trace" pathLength="1" d="${trace}"/>
      ${A.map(c => { const st = statusOf(c.id); return `<rect class="hm-block ${st}" data-heroid="${c.id}" x="${xy[c.id].x}" y="${xy[c.id].y}" width="${W}" height="${H}" rx="12" style="--c: var(--${lvClass(c)}); --d:${depthOf(c.id)}"><title>${esc(c.id + " " + c.title + " · " + c.en)}</title></rect>`; }).join("")}
      ${cur ? `<rect class="pvhere" x="${xy[cur.id].x - 10}" y="${xy[cur.id].y - 10}" width="${W + 20}" height="${H + 20}" rx="18"/>` : ""}</svg>`;
  }
  // Pointing at a block lights the chain it needs; the caption names it.
  function wireHeroMap() {
    const box = $("#heroMap"), cap = $("#heroCap");
    if (!box) return;
    const svg = box.querySelector("svg");

      const a = [3, 1, 4, 1, 5, 9, 2, 6, 5, 3], d = [], F = [];
      const snap = (i, pos, text) => F.push({ rows: [{ label: "a", vals: a, marks: i >= 0 ? { [i]: "hit" } : {} }, { label: "tails", vals: [...d], idx: d.map((_, k) => `len ${k + 1}`), marks: pos >= 0 ? { [pos]: "on" } : {} }], text });
      snap(-1, -1, "tails[k] = the smallest last value of any increasing subsequence of length k + 1 seen so far. It is always sorted");
      a.forEach((x, i) => {
        let lo = 0, hi = d.length; while (lo < hi) { const m = (lo + hi) >> 1; if (d[m] < x) lo = m + 1; else hi = m; }
        if (lo === d.length) { d.push(x); snap(i, lo, `${x} is bigger than every tail: extend, length ${d.length}`); }
        else { const old = d[lo]; d[lo] = x; snap(i, lo, `lower_bound finds tails[${lo}] = ${old} ≥ ${x}: replace it with ${x}, a smaller end for length ${lo + 1}`); }
      });
      snap(-1, -1, `The LIS has length ${d.length}. n binary searches: O(n log n), against O(n²) for the plain DP`);
      return F;
    },
    mount: rowsMount,
  };
  // Linear (Euler) sieve. 基21.
  VIS["基21"] = {
    title: "Linear sieve up to 30: each composite crossed out once",
    frames() {
      const N = 30, lpf = Array(N + 1).fill(0), primes = [], F = [];
      const rows = (cur, hit) => [2, 17].map(s => { const nums = [...Array(Math.min(15, N - s + 1)).keys()].map(k => s + k); return { label: s === 2 ? "2–16" : "17–30", vals: nums.map(x => (lpf[x] === x ? "P" : lpf[x] ? "×" + lpf[x] : "")), idx: nums, marks: Object.fromEntries(nums.map((x, k) => [k, x === cur ? "on" : hit.includes(x) ? "hit" : lpf[x] === x ? "done" : ""])) }; });
      F.push({ rows: rows(0, []), text: "Walk i from 2 to 30. An empty cell when we reach it means i is prime" });
      for (let i = 2; i <= N; i++) {
        let fresh = false;
        if (!lpf[i]) { lpf[i] = i; primes.push(i); fresh = true; }
        const hit = [];
        for (const p of primes) { if (p > lpf[i] || i * p > N) break; lpf[i * p] = p; hit.push(i * p); }
        if (fresh || hit.length) F.push({ rows: rows(i, hit), text: `${fresh ? `${i} is prime. ` : ""}${hit.length ? `Cross out ${hit.map(x => `${x} = ${i}×${x / i}`).join(", ")}: each by its smallest prime factor, stopping at p = ${lpf[i]}` : "Nothing new to cross out"}` });
      }
      F.push({ rows: rows(0, []), text: `${primes.length} primes. Every composite is crossed out exactly once, by its smallest prime factor, so the sieve is O(n)` });
      return F;
    },
    mount: rowsMount,
  };

    title: "156 in binary and hexadecimal",
    frames() {
      const F = [], ns = [], rs = [];
      let n = 156;
      const snap = (text, mark) => F.push({ rows: [{ label: "n", vals: [...ns] }, { label: "n mod 2", vals: [...rs], marks: mark >= 0 ? { [mark]: "hit" } : {} }], text });
      snap("Divide by 2 again and again; each remainder is the next binary digit, lowest first", -1);
      while (n > 0) { ns.push(n); rs.push(n % 2); snap(`${n} = 2 × ${n >> 1} + ${n % 2}: write ${n % 2}, carry on with ${n >> 1}`, rs.length - 1); n >>= 1; }

    const q = bank.q.toLowerCase(), wants = bank.tags.map(tagWants);

      (bank.band === "all" || bandOf(x) === +bank.band) && (!bank.star || x.p.star) && (!bank.hide || !solved.has(x.p.id)) &&
      (!q || (x.p.id + " " + x.p.name).toLowerCase().includes(q)) &&
      wants.every(alts => x.p.tags.some(tag => alts.some(a => tag.toLowerCase().includes(a)))));

  function shareCode(p = prog) {

    A.forEach((c, i) => { bytes[i >> 2] |= ({ learning: 1, learned: 2 }[p[c.id]] || 0) << ((i & 3) * 2); });
    return btoa(String.fromCharCode(...bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function shareDecode(code) {
    const bin = atob(code.replace(/-/g, "+").replace(/_/g, "/")), p = {};
    A.forEach((c, i) => { const v = (bin.charCodeAt(i >> 2) >> ((i & 3) * 2)) & 3; if (v === 1) p[c.id] = "learning"; if (v === 2) p[c.id] = "learned"; });
    return p;
  }

    const ls = e.target.closest("[data-lstatus]");

      if (d.bankreset !== undefined) { Object.assign(bank, { tags: [], src: "all", lv: "all", band: "all", star: false, hide: false, q: "", sort: "easy" }); viewBank(); return; }

    }

  let pqTimer = 0;

  // Keys: / search, t tree, j / k next and previous chapter. Instant on purpose: shortcuts never animate.
  document.addEventListener("keydown", e => {

  // ---- search ----
  const index = [];
  function buildIndex() {
    A.forEach(c => {
      index.push({ c, kind: "Chapter", text: `${c.id} ${c.title} ${c.en} ${c.summary}`, show: c.summary, href: `#ch-${c.slug}` });
      c.boxes.forEach(b => index.push({ c, kind: KIND[b.kind] || b.kind, text: b.text, show: b.text, href: `#ch-${c.slug}` }));

      [...c.stars.luogu, ...c.stars.codeforces].forEach(p => index.push({ c, kind: "★ Problem", text: `${p.id} ${p.name}`, show: `${p.id} ${p.name}`, href: `#ch-${c.slug}-problems` }));
    });
  }
  const q = $("#q"), res = $("#results");
  let hits = [], hi = 0;
  function search() {
    const s = q.value.trim().toLowerCase();
    if (!s) markMapSearch(null);
    if (!s) { res.innerHTML = `<div class="none">Search chapters, concept boxes, programs and starred problems. Try 懒标记, dijkstra or P3372.<br>Start with # to find problems by tag: #线段树, #dp, #greedy</div>`; res.hidden = false; return; }
    const tagQ = s.match(/^(?:#|tag:)\s*(.*)$/);
    if (tagQ) return tagSearch(tagQ[1]);
    const words = s.split(/\s+/);
    const extra = Object.keys(ALIAS).filter(k => (" " + s + " ").includes(" " + k + " ")).map(k => ALIAS[k].toLowerCase());
    hits = index.filter(x => { const t = x.text.toLowerCase(); return words.every(w => t.includes(w)) || extra.some(a => t.includes(a)); });
    hits.sort((a, b) => (a.kind === "Chapter" ? 0 : 1) - (b.kind === "Chapter" ? 0 : 1));
    markMapSearch(new Set(hits.map(h => h.c.id)));
    hits = hits.slice(0, 30); hi = 0;
    const snip = t => { const i = t.toLowerCase().indexOf(words[0]); const a = Math.max(0, i - 40); return (a ? "…" : "") + t.slice(a, a + 140) + (t.length > a + 140 ? "…" : ""); };
    res.innerHTML = hits.length ? hits.map((x, i) => `<a href="${x.href}" data-loc="${x.c.id}" class="${i === 0 ? "on" : ""}"><span class="lv ${lvClass(x.c)}">${x.c.id}</span> <span class="cjk">${esc(x.c.title)}</span> <span class="pill">${esc(x.kind)}</span><small>${esc(snip(x.show))}</small></a>`).join("") : `<div class="none">No matches for “${esc(q.value)}”</div>`;
    res.hidden = false;

  let allP = null;

  function tagSearch(term) {
    if (!problems) {
      res.innerHTML = `<div class="none">Loading the problem lists</div>`; res.hidden = false;
      fetch("problems.json").then(r => r.json()).then(j => { problems = j; search(); }).catch(() => (res.innerHTML = `<div class="none">The problem lists didn't load</div>`));
      return;
    }
    allP = allP || A.flatMap(c => ["luogu", "codeforces"].flatMap(j => ((problems[c.id] || {})[j] || []).map(p => ({ p, j, c }))));
    const terms = term.split(/[,，\s]+/).filter(Boolean);
    if (!terms.length) {
      const count = {};
      allP.forEach(x => x.p.tags.forEach(t => (count[t] = (count[t] || 0) + 1)));
      const top = Object.entries(count).sort((a, b) => b[1] - a[1]).slice(0, 24);
      res.innerHTML = `<div class="none">Type a tag after #. Common tags:</div><div class="tagcloud">${top.map(([t, n]) => `<button class="chip" data-tagfill="${esc(t)}">${esc(t)} <span class="hint">${n}</span></button>`).join("")}</div>`;
      res.hidden = false; return;
    }
    const want = terms.map(t => [t, ...(ALIAS[t] ? [ALIAS[t].toLowerCase()] : [])]);
    const found = allP.filter(({ p }) => want.every(alts => p.tags.some(tag => alts.some(a => tag.toLowerCase().includes(a)))));
    found.sort((a, b) => (b.p.star | 0) - (a.p.star | 0) || ratingOf(a) - ratingOf(b));
    hi = 0;
    const diff = x => x.j === "luogu" ? `<span class="diff" style="background:${LUOGU[x.p.d][1]}">${LUOGU[x.p.d][0]}</span>` : `<span class="diff" style="background:${cfColor(x.p.r)}">${x.p.r}</span>`;
    res.innerHTML = `<div class="none">${found.length.toLocaleString("en-US")} problem${found.length === 1 ? "" : "s"} tagged ${terms.map(esc).join(" + ")}${found.length > 40 ? ", easiest 40 shown (★ first)" : ""}. <a href="#problems?tag=${encodeURIComponent(terms.join(","))}">See them all in Problems →</a></div>` +
      found.slice(0, 40).map((x, i) => `<a href="${problemUrl(x.j, x.p.id)}" target="_blank" rel="noopener" class="${i === 0 ? "on" : ""}">${x.p.star ? "★ " : ""}<span class="mono">${x.j === "luogu" ? esc(x.p.id) : "CF " + esc(x.p.id)}</span> <span class="cjk">${esc(x.p.name)}</span> ${diff(x)}<small>${esc(x.p.tags.slice(0, 5).join(", "))} · ${x.c.id} ${esc(x.c.title)}</small></a>`).join("");
    res.hidden = false;
  }
  document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "bankTagIn") { e.preventDefault(); bankTagAdd(e.target.value); e.target.value = ""; } });
  q.addEventListener("input", search);

    if (res.hidden) return;

    if ((e.key === "ArrowDown" || e.key === "ArrowUp") && links.length) { e.preventDefault(); hi = (hi + (e.key === "ArrowDown" ? 1 : -1) + links.length) % links.length; links.forEach((l, i) => l.classList.toggle("on", i === hi)); links[hi].scrollIntoView({ block: "nearest" }); }

  catch (e) { $("#view").insertAdjacentHTML("beforebegin", `<p class="storewarn wrap" role="status">This browser is blocking saved data (a private window?), so your progress will be lost when you close the tab. Progress → Download backup file keeps a copy.</p>`); }
  if ("serviceWorker" in navigator && document.querySelector('link[rel="manifest"]')) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  { const sk = skeletonHtml((location.hash.slice(1) || "home").split("?")[0]); if (sk) $("#view").innerHTML = sk; }
  addEventListener("hashchange", () => setTimeout(rollCounters, 30));
  fetch("atlas.json").then(r => r.json()).then(data => {
    A = data;
    A.forEach(c => {
      byId[c.id] = c; bySlug[c.slug] = c; c.fam = familyOf(c);
      // the chapter's typical difficulty: the middle of its starred Luogu problems
      const ds = c.stars.luogu.map(p => p.d).sort((a, b) => a - b);
      c.tier = ds.length ? ds[ds.length >> 1] : -1;
    });
    A.forEach(c => c.pre.forEach(p => (kids[p] = kids[p] || []).push(c.id)));
    buildIndex();
    route();
    rollCounters();
    $("#view").removeAttribute("aria-busy");
  }).catch(err => { console.error(err); $("#view").innerHTML = `<p class="empty">The chapter data didn't load. Reload the page to try again</p>`; });
})();
