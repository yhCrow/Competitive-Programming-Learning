<style>
/* Standalone reset (the Claude artifact wrapper adds this there). */
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html, body { margin: 0; }
img { max-width: 100%; }

/* Layout: a quiet judge-style bar over three views. The tree is the one rich element: a route map with one lane per
   level, coloured with Codeforces rating colours (基 pupil green, 进 expert blue, 拓 candidate-master violet, NOI master
   orange). Those four colours appear only on chapter ids and in the tree; everything else is a graphite ramp. */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --raised: #eef0f3;
  --line: rgba(17, 24, 39, 0.10);
  --line-strong: rgba(17, 24, 39, 0.18);
  --fg: #151a22;
  --fg-2: #4a5362;
  --muted: #6b7382;
  --accent: #2f5fd0;
  --lv-b: #1f8a4c;
  --lv-j: #2f5fd0;
  --lv-t: #9b3fb5;
  --lv-n: #c85d0b;
  --trap: #c2372f;
  --code-bg: #f8f9fb;
  --k-kw: #8a3fb0;
  --k-ty: #1f6fb0;
  --k-str: #2c7a3f;
  --k-num: #b45309;
  --k-com: #7b8594;
  --k-pre: #b0306a;
  --r-tag: 6px;
  --r-ctl: 8px;
  --r-card: 12px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --f-ui: "JetBrains Mono", "Noto Sans SC", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --f-cjk: "JetBrains Mono", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", monospace;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121417; --surface: #181b20; --raised: #20242a; --line: rgba(236, 239, 244, 0.08); --line-strong: rgba(236, 239, 244, 0.16);
    --fg: #eceff4; --fg-2: #b3b9c3; --muted: #8a919c; --accent: #7aa2ff;
    --lv-b: #4cc47e; --lv-j: #7aa2ff; --lv-t: #c98be0; --lv-n: #f2994a; --trap: #ff7b72; --code-bg: #15181c;
    --k-kw: #d2a8ff; --k-ty: #79c0ff; --k-str: #7ee787; --k-num: #f2b35a; --k-com: #7d8896; --k-pre: #ff8fc0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121417; --surface: #181b20; --raised: #20242a; --line: rgba(236, 239, 244, 0.08); --line-strong: rgba(236, 239, 244, 0.16);
  --fg: #eceff4; --fg-2: #b3b9c3; --muted: #8a919c; --accent: #7aa2ff;
  --lv-b: #4cc47e; --lv-j: #7aa2ff; --lv-t: #c98be0; --lv-n: #f2994a; --trap: #ff7b72; --code-bg: #15181c;
  --k-kw: #d2a8ff; --k-ty: #79c0ff; --k-str: #7ee787; --k-num: #f2b35a; --k-com: #7d8896; --k-pre: #ff8fc0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--f-ui); font-size: 14px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, h4 { font-weight: 500; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cjk { font-family: var(--f-cjk); }
.mono { font-family: var(--f-mono); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.label { font-size: 12px; color: var(--muted); margin: 0 0 8px; font-weight: 500; }
.hint { color: var(--muted); font-size: 13px; }

/* bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 12px; max-width: 1520px; margin: 0 auto; }
.brand { display: flex; align-items: baseline; gap: 12px; text-decoration: none; color: var(--fg); }
.brand b { font-weight: 500; font-size: 16px; }
.brand span { font-family: var(--f-cjk); color: var(--muted); font-size: 12px; }
.nav { display: flex; gap: 4px; }
.nav a { text-decoration: none; color: var(--fg-2); padding: 4px 12px; border-radius: var(--r-ctl); font-size: 13px; transition: background-color .15s var(--ease), color .15s var(--ease); }
.nav a:hover { background: var(--raised); }
.nav a[aria-current="page"] { color: var(--fg); background: var(--raised); box-shadow: inset 0 -2px 0 var(--accent); }
.search { position: relative; flex: 1 1 220px; max-width: 360px; margin-left: auto; }
.search input { width: 100%; height: 32px; padding: 0 12px 0 32px; border: 1px solid var(--line-strong); border-radius: var(--r-ctl); background: var(--bg); }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; fill: var(--muted); }
.results { position: absolute; top: calc(100% + 8px); left: 0; right: 0; min-width: 320px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-card); box-shadow: 0 8px 24px rgba(0, 0, 0, .10); max-height: 60vh; overflow: auto; padding: 4px; }
.results a { display: block; padding: 8px 12px; border-radius: var(--r-ctl); text-decoration: none; color: var(--fg); }
.results a:hover, .results a.on { background: var(--raised); }
.results small { display: block; color: var(--muted); font-size: 12px; }
.results .none { padding: 12px; color: var(--muted); font-size: 13px; }

main { max-width: 1520px; margin: 0 auto; padding-block: 24px 64px; }

/* level id: the signature */
.lv { --c: var(--muted); display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 12px; font-weight: 600; color: var(--c); }
.lv::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.lv-b { --c: var(--lv-b); } .lv-j { --c: var(--lv-j); } .lv-t { --c: var(--lv-t); } .lv-n { --c: var(--lv-n); }

/* progress strip */
.strip { display: flex; gap: 8px 32px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; font-size: 13px; color: var(--fg-2); }
.strip .item { display: inline-flex; align-items: center; gap: 8px; }
.strip .meter { width: 72px; height: 4px; background: var(--raised); border-radius: 2px; overflow: hidden; display: inline-flex; }
.strip .meter i { display: block; height: 100%; background: var(--c); }
.strip .meter i.half { opacity: .4; }
.strip .n { font-variant-numeric: tabular-nums; color: var(--muted); }
.strip .name { font-family: var(--f-cjk); }

.tools { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.chipset { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line-strong); background: var(--surface); height: 28px; padding: 0 12px; border-radius: 14px; font-size: 12px; transition: background-color .15s var(--ease); }
.chip:hover { background: var(--raised); }
.chip[aria-pressed="true"] { border-color: var(--fg); background: var(--fg); color: var(--bg); }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r-ctl); overflow: hidden; }
.seg button { border: 0; background: transparent; height: 28px; padding: 0 12px; font-size: 12px; color: var(--fg-2); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

/* tree */
.treeview { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; align-items: start; }
.canvas { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); overflow: auto; max-height: calc(100vh - 150px); min-height: 560px; position: relative; }
.canvas svg { display: block; }
.canvas { cursor: grab; touch-action: pan-x pan-y; }
.canvas.dragging { cursor: grabbing; user-select: none; }
.zoom button { min-width: 32px; }
.zoom .pct { display: inline-flex; align-items: center; justify-content: center; min-width: 52px; font-size: 12px; color: var(--fg-2); font-variant-numeric: tabular-nums; border-inline: 1px solid var(--line-strong); }
.lane-bg { fill: var(--c); opacity: .045; }
.lane-rule { stroke: var(--line); stroke-width: 1; }
.lane-name { font-family: var(--f-cjk); font-size: 15px; font-weight: 500; fill: var(--c); }
.lane-en, .lane-n { font-family: var(--f-mono); font-size: 11px; fill: var(--muted); }
.col-label { font-family: var(--f-mono); font-size: 11px; fill: var(--muted); }
.edge { fill: none; stroke: var(--line-strong); stroke-width: 1.2; }
.edge.hot { stroke: var(--fg); stroke-width: 2; }
.edge.dim { opacity: .2; }
.node { cursor: pointer; }
.node rect.box { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1; transition: stroke .12s ease; }
.node text.id { font-family: var(--f-mono); font-size: 11px; font-weight: 600; fill: var(--c); }
.node text.t { font-family: var(--f-cjk); font-size: 13px; font-weight: 500; fill: var(--fg); }
.node text.en { font-family: var(--f-mono); font-size: 10.5px; fill: var(--muted); }
.node circle.ready { fill: transparent; }
.node.ready circle.ready { fill: var(--c); }
.node.learning rect.box { stroke: var(--c); stroke-width: 1.5; stroke-dasharray: 5 3; }
.node.learned rect.box { fill: var(--c); stroke: var(--c); }
.node.learned text.t, .node.learned text.id { fill: var(--surface); }
.node.learned text.en { fill: var(--surface); opacity: .8; }
.node.sel rect.box { stroke: var(--fg); stroke-width: 2.5; }
.node.dim { opacity: .25; }
.node:hover rect.box { stroke: var(--fg); }
.node:focus-visible rect.box { stroke: var(--accent); stroke-width: 3; }
.legend { display: flex; gap: 8px 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 12px; }
.legend span { display: inline-flex; gap: 8px; align-items: center; }
.sw { width: 18px; height: 12px; border-radius: 3px; border: 1.5px solid var(--muted); display: inline-block; }
.sw.learning { border-style: dashed; }
.sw.learned { background: var(--muted); }

/* side and aside: plain sections, one card for the selected chapter */
.aside { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px); display: grid; gap: 24px; min-width: 0; align-content: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px; min-width: 0; }
.card h2 { margin: 8px 0 0; font-family: var(--f-cjk); font-size: 20px; line-height: 1.3; text-wrap: balance; }
.en { color: var(--muted); margin: 0 0 8px; }
.block p { margin: 0 0 8px; }
.block + .block { margin-top: 20px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.btn { border: 1px solid var(--line-strong); background: var(--surface); height: 32px; padding: 0 12px; border-radius: var(--r-ctl); font-size: 13px; text-decoration: none; color: var(--fg); display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; transition: background-color .15s var(--ease), border-color .15s var(--ease), transform .12s var(--ease); }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn:hover { border-color: var(--fg); }
.btn:active { transform: scale(.98); }
.btns.even { display: grid; grid-template-columns: 1fr 1fr; }
.links { display: flex; flex-wrap: wrap; gap: 4px; }
.links a { font-family: var(--f-mono); font-size: 12px; text-decoration: none; padding: 2px 8px; border-radius: var(--r-tag); background: var(--raised); color: var(--fg); }
.links a:hover { background: var(--line-strong); }
.links a.done { text-decoration: line-through; color: var(--muted); }
ol.path { margin: 0; padding-left: 24px; }
ol.path li { margin: 4px 0; }
ol.path a { text-decoration: none; color: var(--fg); }
ol.path a:hover .cjk { text-decoration: underline; }
.cc { font-family: var(--f-mono); font-size: 12px; background: var(--raised); border-radius: var(--r-ctl); padding: 8px 12px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0 0 4px; }

/* list view */
.levels { display: grid; gap: 40px; }
.level h2 { font-family: var(--f-cjk); margin: 0 0 12px; font-size: 18px; display: flex; gap: 12px; align-items: baseline; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.tile { display: grid; gap: 4px; text-decoration: none; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 12px 16px; min-width: 0; transition: border-color .15s var(--ease); }
.tile:hover { border-color: var(--line-strong); }
.tile .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tile .t { font-family: var(--f-cjk); font-weight: 500; }
.tile small { color: var(--muted); font-size: 12px; }
.tile.learned { border-color: var(--c); }
.tile.learning { border-style: dashed; border-color: var(--c); }
.pill { font-size: 11px; font-family: var(--f-mono); padding: 1px 6px; border-radius: var(--r-tag); background: var(--raised); color: var(--muted); white-space: nowrap; }

/* chapter view */
.chapter { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 40px; align-items: start; }
.crumbs { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-bottom: 12px; }
.crumbs a { color: var(--muted); }
.chead h1 { font-family: var(--f-cjk); font-size: clamp(28px, 4vw, 36px); line-height: 1.15; margin: 8px 0 4px; text-wrap: balance; }
.chead .en { font-size: 16px; }
.chead .sum { max-width: 72ch; margin: 12px 0 0; color: var(--fg-2); line-height: 1.7; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 24px 0 24px; overflow-x: auto; }
.tabs a { text-decoration: none; color: var(--muted); padding: 8px 12px; border-bottom: 2px solid transparent; white-space: nowrap; font-size: 13px; transition: color .15s var(--ease); }
.tabs a:hover { color: var(--fg); }
.tabs a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--fg); }
.tabs a small { font-family: var(--f-mono); font-size: 11px; color: var(--muted); margin-left: 4px; }
.sec { margin: 32px 0 12px; display: flex; gap: 12px; align-items: baseline; }
.sec:first-child { margin-top: 0; }
.sec .n { font-family: var(--f-mono); color: var(--muted); font-size: 13px; }
.sec h3 { margin: 0; font-family: var(--f-cjk); font-size: 17px; }
.box { --k: var(--accent); border: 1px solid color-mix(in srgb, var(--k) 28%, var(--line)); background: color-mix(in srgb, var(--k) 5%, var(--surface)); border-radius: var(--r-card); padding: 14px 18px 16px; max-width: 72ch; line-height: 1.85; }
.box.key { --k: var(--v-done); } .box.trap { --k: var(--trap); } .box.note { --k: var(--muted); }
.box b { font-family: var(--f-mono); font-size: 12px; font-weight: 600; color: var(--k); display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.box b .hint { font-weight: 400; }
.ci { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.box.trap { border-color: color-mix(in srgb, var(--trap) 35%, var(--line)); }
.box.trap b { color: var(--trap); }
.jump { font-size: 12px; color: var(--muted); text-decoration: none; }
.jump:hover { color: var(--fg); }
.flow { display: grid; gap: 12px; max-width: 72ch; }
.flow .sec { margin: 48px 0 4px; padding-top: 20px; border-top: 1px solid var(--line); }
.flow .sec:first-child { margin-top: 0; }
.flow .box { max-width: none; }
.sub { font-family: var(--f-cjk); font-size: 15px; margin: 28px 0 0; padding-left: 12px; border-left: 2px solid var(--line-strong); }
.sub .n, .outline .n { font-family: var(--f-mono); color: var(--muted); font-weight: 400; }
.lede { color: var(--fg-2); margin: -2px 0 6px; font-size: 15px; line-height: 1.6; }
.para { margin: 0; line-height: 1.9; font-size: 14.5px; }
.para.li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: start; }
.para.li .num { width: 24px; height: 24px; border-radius: 50%; background: var(--raised); color: var(--fg-2); display: grid; place-items: center; font-size: 11px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.tbl { display: grid; gap: 4px; }
.tbl pre { margin: 0; font-family: var(--f-mono); font-size: 12px; line-height: 1.7; background: var(--raised); border-radius: var(--r-card); padding: 12px 16px; overflow-x: auto; }
.fig { justify-self: start; }
.outline { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.outline li.h3 { padding-left: 16px; }
.linkish { border: 0; background: none; padding: 2px 0; text-align: left; color: var(--fg-2); font-size: 13px; cursor: pointer; }
.linkish:hover { color: var(--fg); }
.prog { border: 1px solid var(--line); border-radius: var(--r-card); background: var(--surface); margin: 0 0 16px; overflow: hidden; }
.prog header { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 12px 8px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.prog header .mono { font-weight: 600; }
.prog header small { color: var(--muted); font-size: 12px; }
pre.code { margin: 0; padding: 12px 16px; background: var(--code-bg); overflow-x: auto; font-family: var(--f-mono); font-size: 13px; line-height: 1.6; tab-size: 4; counter-reset: ln; }
pre.code .l { display: block; }
pre.code .l::before { counter-increment: ln; content: counter(ln); display: inline-block; width: 2.6em; margin-right: 12px; text-align: right; color: var(--k-com); opacity: .7; user-select: none; }
.io { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); border-top: 1px solid var(--line); }
.io > div { padding: 8px 16px 12px; min-width: 0; }
.io > div + div { border-left: 1px solid var(--line); }
.io b { font-size: 12px; font-weight: 500; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
.io pre { margin: 4px 0 0; font-family: var(--f-mono); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.copy { border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r-tag); font-size: 12px; height: 24px; padding: 0 8px; color: var(--fg-2); transition: background-color .15s var(--ease); }
.copy:hover { background: var(--raised); }
.hljs-keyword, .hljs-built_in { color: var(--k-kw); }
.hljs-type { color: var(--k-ty); }
.hljs-string, .hljs-char { color: var(--k-str); }
.hljs-number, .hljs-literal { color: var(--k-num); }
.hljs-comment { color: var(--k-com); }
.hljs-meta, .hljs-meta .hljs-keyword { color: var(--k-pre); }
.hljs-meta .hljs-string { color: var(--k-str); }
.hljs-title { color: var(--k-ty); }

.ptools { display: flex; gap: 8px 12px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.ptools select, .ptools input[type="text"] { border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r-ctl); height: 28px; padding: 0 8px; font-size: 12px; }
.ptools label { font-size: 12px; color: var(--fg-2); display: inline-flex; gap: 6px; align-items: center; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-card); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 12px; color: var(--muted); font-weight: 500; background: var(--raised); position: sticky; top: 0; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: color-mix(in srgb, var(--raised) 60%, transparent); }
td.num { font-variant-numeric: tabular-nums; text-align: right; color: var(--muted); font-size: 12px; }
td.id a { font-weight: 600; text-decoration: none; }
tr.solved td:not(:first-child) { opacity: .5; }
.diff { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: var(--r-tag); color: #fff; white-space: nowrap; }
.star { color: var(--lv-n); }
.reader { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px 20px; white-space: pre-wrap; font-family: var(--f-cjk); font-size: 13px; line-height: 1.8; overflow-wrap: anywhere; max-width: 88ch; }
.reader .pg { display: block; font-family: var(--f-mono); font-size: 11px; color: var(--muted); border-top: 1px dashed var(--line-strong); margin: 16px 0 8px; padding-top: 8px; }
textarea.notes { width: 100%; min-height: 260px; border: 1px solid var(--line-strong); border-radius: var(--r-card); background: var(--surface); padding: 12px 16px; line-height: 1.7; }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 40px; flex-wrap: wrap; }
.pager a { text-decoration: none; border: 1px solid var(--line); border-radius: var(--r-card); padding: 12px 16px; color: var(--fg); background: var(--surface); flex: 1 1 200px; min-width: 0; transition: border-color .15s var(--ease); }
.pager a:hover { border-color: var(--line-strong); }
.pager a small { display: block; color: var(--muted); font-size: 12px; }
.pager a.next { text-align: right; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 8px); opacity: 0; pointer-events: none; background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: var(--r-ctl); font-size: 13px; z-index: 20; transition: opacity .15s var(--ease), transform .15s var(--ease); }
.toast.show { opacity: 1; transform: translate(-50%, 0); transition-duration: .2s; } /* arrive in 200ms, leave in 150ms */
/* motion: press feedback, solved-row fade, map zoom origin */
.status button:active, .copy:active, .chip:active, .seg button:active { transform: scale(.97); }
.copy, .chip, .seg button { transition: background-color .15s var(--ease), transform .12s var(--ease); }
tr td { transition: opacity .15s var(--ease); }
.canvas svg { transform-origin: 0 0; }
.resume { font-size: 13px; color: var(--fg-2); margin: -4px 0 16px; }
.resume a { text-decoration: none; }
.resume a:hover .cjk { text-decoration: underline; }
/* front page */
.home { display: grid; gap: 96px; }
.hero { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 48px; align-items: center; min-height: calc(100vh - 160px); }
.hero > * { animation: rise .32s var(--ease) both; }
.hero > * + * { animation-delay: .06s; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
.home h1 { font-family: var(--f-cjk); font-size: clamp(30px, 4vw, 44px); line-height: 1.15; margin: 0 0 16px; text-wrap: balance; letter-spacing: -0.01em; }
.home h2 { font-family: var(--f-cjk); font-size: clamp(22px, 2.6vw, 28px); line-height: 1.25; margin: 0 0 12px; text-wrap: balance; }
.home .fact { font-size: 13px; color: var(--fg); font-variant-numeric: tabular-nums; margin: 0 0 16px; }
.home .lead { color: var(--fg-2); max-width: 56ch; line-height: 1.7; margin: 0 0 24px; }
.frame { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; min-width: 0; }
.frame .top { display: flex; justify-content: space-between; gap: 12px; padding: 8px 16px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.frame svg { display: block; width: 100%; height: auto; }
.showcase { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 48px; align-items: start; }
.showcase .prog { margin: 0; }
.stars { display: grid; gap: 8px; margin: 16px 0 0; padding: 0; list-style: none; }
.stars li { display: flex; gap: 12px; align-items: center; font-size: 13px; }
.stars a { font-weight: 600; text-decoration: none; }
.term { background: var(--code-bg); border: 1px solid var(--line); border-radius: var(--r-card); padding: 16px; font-family: var(--f-mono); font-size: 13px; line-height: 1.9; }
.term .p { color: var(--muted); }
.outlinks { display: flex; gap: 8px 20px; flex-wrap: wrap; font-size: 13px; }
.close { border-top: 1px solid var(--line); padding-top: 48px; display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap; }
.close h2 { margin: 0; }
.empty { color: var(--muted); padding: 24px; text-align: center; }
.status { display: flex; border: 1px solid var(--line-strong); border-radius: var(--r-ctl); overflow: hidden; }
.status button { flex: 1 1 auto; border: 0; background: transparent; height: 32px; padding: 0 8px; font-size: 12px; color: var(--fg-2); white-space: nowrap; transition: background-color .15s var(--ease), transform .12s var(--ease); }
.status button:hover { background: var(--raised); }
.status button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.progress-page { display: grid; gap: 32px; max-width: 880px; }
.side { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px 40px; align-items: start; min-width: 0; }
.selcard { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px 40px; align-items: start; }
.selcard .block + .block { margin-top: 16px; }

/* loading skeleton: the page's own outline, still (no shimmer) */
.skeleton { display: grid; gap: 24px; }
.sk { background: linear-gradient(90deg, var(--raised) 0%, color-mix(in srgb, var(--raised) 55%, var(--surface)) 50%, var(--raised) 100%); background-size: 200% 100%; border-radius: var(--r-ctl); animation: shimmer 1.4s linear infinite; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
.sk-strip { height: 16px; width: min(560px, 100%); }
.sk-hero { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 48px; align-items: center; min-height: calc(100vh - 220px); }
.sk-h1 { height: 40px; margin-bottom: 12px; } .sk-h1.short { width: 60%; }
.sk-line { height: 14px; margin-top: 16px; width: 90%; }
.sk-btns { height: 32px; width: 260px; margin-top: 24px; }
.sk-map { height: 340px; border-radius: var(--r-card); }

/* topic icons and pills */
.ficon { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.fam { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
.ichip { display: inline-flex; align-items: center; gap: 6px; }

/* minimap */
.mapwrap { position: relative; min-width: 0; }
.minimap { position: absolute; right: 12px; bottom: 12px; width: 200px; height: auto; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-ctl); box-shadow: 0 4px 12px rgba(0, 0, 0, .12); cursor: pointer; touch-action: none; }
.mm-view { fill: color-mix(in srgb, var(--accent) 14%, transparent); stroke: var(--accent); stroke-width: 1.5; vector-effect: non-scaling-stroke; }

/* visualizers */
.vis { border: 1px solid var(--line); border-radius: var(--r-card); background: var(--surface); padding: 16px; display: grid; gap: 12px; margin-bottom: 20px; }
.vis-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
.vis-head b { font-weight: 500; }
.vis-stage { min-height: 120px; overflow-x: auto; position: relative; }
.vis-cap { margin: 0; min-height: 3.2em; color: var(--fg-2); line-height: 1.6; }
.vis-ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.vis-ctl input[type="range"] { flex: 1 1 160px; accent-color: var(--accent); }
.bars { height: 172px; min-width: 352px; }
.vbar { position: absolute; bottom: 24px; left: 0; width: 36px; background: var(--raised); border: 1px solid var(--line-strong); border-radius: 6px 6px 0 0; transition: transform .3s cubic-bezier(0.77, 0, 0.175, 1), background-color .15s ease; }
.vbar span { position: absolute; bottom: -22px; width: 100%; text-align: center; font-size: 12px; color: var(--fg-2); }
.vbar.done { background: color-mix(in srgb, var(--accent) 22%, var(--surface)); }
.vbar.on { background: var(--accent); border-color: var(--accent); }
.cells .row { display: flex; gap: 4px; }
.cell { width: 36px; height: 44px; flex: none; display: grid; place-items: center; border: 1px solid var(--line-strong); border-radius: 6px; font-size: 13px; position: relative; transition: opacity .15s ease, background-color .15s ease; }
.cell small { position: absolute; top: 2px; left: 4px; font-size: 9px; color: var(--muted); }
.cell.out { opacity: .3; }
.cell.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
.cell.hit { background: var(--accent); color: var(--bg); }
.ptrs { position: relative; height: 24px; margin-top: 6px; }
.ptr { position: absolute; left: 0; width: 36px; text-align: center; font-size: 11px; color: var(--accent); transition: transform .3s cubic-bezier(0.77, 0, 0.175, 1), opacity .15s ease; }
.ptr.lo, .ptr.hi { color: var(--muted); }
.ptr.mid { top: 10px; }
.gsvg, .tsvg { width: 100%; max-width: 480px; height: auto; display: block; }
.gsvg line, .tsvg line { stroke: var(--line-strong); stroke-width: 1.5; }
.gn circle { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.5; transition: fill .15s ease; }
.gn text { text-anchor: middle; font-size: 12px; fill: var(--fg); font-family: var(--f-mono); }
.gn text.d { fill: var(--accent); font-size: 11px; }
.gn.seen circle { fill: color-mix(in srgb, var(--accent) 22%, var(--surface)); stroke: var(--accent); }
.gn.cur circle { fill: var(--accent); }
.gn.cur text:not(.d) { fill: var(--bg); }
.queue { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; margin-top: 8px; font-size: 12px; }
.qcell { border: 1px solid var(--accent); border-radius: 4px; padding: 2px 8px; font-family: var(--f-mono); }
.tn rect { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.2; transition: fill .15s ease; }
.tn text { text-anchor: middle; font-family: var(--f-mono); fill: var(--fg); }
.tn .rg { font-size: 10px; } .tn .sm { font-size: 9px; fill: var(--muted); }
.tn.full rect { fill: var(--accent); stroke: var(--accent); }
.tn.full text { fill: var(--bg); }
.tn.split rect { stroke: var(--accent); stroke-width: 2; }
.tn.out { opacity: .35; }
.mem { display: grid; gap: 12px; }
.memrow { display: flex; gap: 12px; align-items: center; }
.memrow .hint, .ptrlbl { width: 64px; flex: none; font-size: 12px; }
.ptrlbl { color: var(--accent); font-family: var(--f-mono); }
.blk { display: flex; gap: 3px; flex-wrap: wrap; }
.mc { width: 26px; height: 26px; border: 1px solid var(--line-strong); border-radius: 4px; display: grid; place-items: center; font-size: 11px; font-family: var(--f-mono); }
.mc.f { background: color-mix(in srgb, var(--accent) 22%, var(--surface)); border-color: var(--accent); }
.memrow.old .mc { opacity: .45; text-decoration: line-through; }

/* heatmap, cheat-sheet, Big-O */
.heat { display: grid; grid-template-rows: repeat(7, 12px); grid-auto-flow: column; grid-auto-columns: 12px; gap: 3px; overflow-x: auto; }
.hm { border-radius: 2px; background: var(--raised); }
.hm.l1 { background: color-mix(in srgb, var(--accent) 30%, var(--raised)); }
.hm.l2 { background: color-mix(in srgb, var(--accent) 60%, var(--raised)); }
.hm.l3 { background: var(--accent); }
.cheat td, .cheat th { white-space: nowrap; }
code.bigo { font-family: var(--f-mono); font-size: .92em; background: var(--raised); border-radius: 4px; padding: 0 4px; white-space: nowrap; }


/* visualizer colour grammar, shared by every visualizer */
:root { --v-cur: #4f5fd6; --v-cmp: #c98a00; --v-done: #2b8a57; --v-bad: #d0453b; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --v-cur: #8f9bff; --v-cmp: #f0b429; --v-done: #4cc38a; --v-bad: #ff7b72; } }
:root[data-theme="dark"] { --v-cur: #8f9bff; --v-cmp: #f0b429; --v-done: #4cc38a; --v-bad: #ff7b72; }
.vkey { display: inline-flex; gap: 6px; align-items: center; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
.vkey i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-left: 6px; }
.k-cur { background: var(--v-cur); } .k-cmp { background: var(--v-cmp); } .k-done { background: var(--v-done); } .k-bad { background: var(--v-bad); }
.cell.on, .vbar.on { background: color-mix(in srgb, var(--v-cmp) 28%, var(--surface)); border-color: var(--v-cmp); }
.cell.hit { background: var(--v-done); border-color: var(--v-done); color: #fff; }
.cell.done, .vbar.done { background: color-mix(in srgb, var(--v-done) 18%, var(--surface)); border-color: color-mix(in srgb, var(--v-done) 50%, var(--line-strong)); }
.cell.bad { background: color-mix(in srgb, var(--v-bad) 22%, var(--surface)); border-color: var(--v-bad); }
.cell.pad { opacity: .45; }
.ptr.mid { color: var(--v-cmp); }
.gn.cur circle, .rn.cur circle { fill: var(--v-cur); stroke: var(--v-cur); }
.gn.cur text:not(.d) { fill: #fff; }
.gn.seen circle, .rn.ret circle { fill: color-mix(in srgb, var(--v-done) 22%, var(--surface)); stroke: var(--v-done); }
.gn.open circle { stroke: var(--v-cmp); }
.tn.full rect { fill: var(--v-done); stroke: var(--v-done); }
.tn.split rect { stroke: var(--v-cmp); }
.gsvg line.hot { stroke: var(--v-cmp); } .gsvg line.mst { stroke: var(--v-done); } .gsvg line.skip { stroke: var(--v-bad); }
.ivs rect.take { fill: var(--v-done); stroke: var(--v-done); } .ivs rect.cur { stroke: var(--v-cmp); }
.vis-ctl select { border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r-ctl); height: 32px; padding: 0 6px; font-size: 12px; }
.mvar { border: 1px solid var(--line-strong); border-radius: var(--r-ctl); padding: 8px 12px; display: grid; gap: 6px; }
.mvar.bad { border-color: var(--v-bad); background: color-mix(in srgb, var(--v-bad) 8%, var(--surface)); }
.mhead { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.mhead b { margin-left: auto; }
.bytes { display: flex; gap: 4px; flex-wrap: wrap; }
.byte { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; padding: 2px 6px; border-radius: 4px; background: var(--raised); }
.mvar.bad .byte { background: color-mix(in srgb, var(--v-bad) 18%, var(--surface)); }

/* chapter header card, done bar, ladder, mastery */
.metacard { margin-top: 20px; display: grid; gap: 12px; padding: 16px 18px; border: 1px solid var(--line); border-radius: var(--r-card); background: var(--surface); max-width: 72ch; }
.metarow { display: flex; gap: 8px 20px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--fg-2); }
.metarow b { color: var(--fg); font-variant-numeric: tabular-nums; }
.stars { color: var(--v-cmp); letter-spacing: 2px; white-space: nowrap; } .stars i { color: var(--line-strong); font-style: normal; }
.goals ul { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 2px; font-size: 13px; }
.donebar { margin-top: 48px; padding: 16px 18px; border: 1px dashed var(--line-strong); border-radius: var(--r-card); display: flex; gap: 12px 20px; align-items: center; flex-wrap: wrap; max-width: 72ch; }
.donebar .status { flex: 1 1 280px; }
.ladder { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin: 0 0 20px; }
.tier { border: 1px solid var(--line); border-radius: var(--r-card); padding: 12px 14px; display: grid; gap: 6px; align-content: start; background: var(--surface); }
.tier .label { margin: 0 0 4px; }
.tp { text-decoration: none; color: var(--fg); font-size: 13px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tp:hover .cjk { text-decoration: underline; }
.mastery { display: grid; gap: 8px; }
.mrow { display: grid; grid-template-columns: 200px minmax(0, 1fr) 48px; gap: 12px; align-items: center; font-size: 13px; }
.mrow .fam { color: var(--fg-2); }
.mbar { height: 6px; background: var(--raised); border-radius: 3px; overflow: hidden; }
.mbar i { display: block; height: 100%; background: var(--v-done); transform-origin: left; animation: grow .7s var(--ease) both; }
.mrow .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.outline .linkish.active { color: var(--fg); font-weight: 600; }
.outline .linkish.active .n { color: var(--accent); }
.prefs { display: flex; gap: 4px; }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }
.readbar { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + var(--bar-h, 57px)); height: 2px; background: var(--accent); transform-origin: left; transform: scaleX(0); opacity: 0; z-index: 6; transition: opacity .2s ease; }

/* themes picked by hand: light, dark, warm paper (the default follows the system) */
:root[data-skin="light"] { --bg: #f6f7f9; --surface: #ffffff; --raised: #eef0f3; --line: rgba(17, 24, 39, 0.10); --line-strong: rgba(17, 24, 39, 0.18); --fg: #151a22; --fg-2: #4a5362; --muted: #6b7382; --accent: #2f5fd0; --lv-b: #1f8a4c; --lv-j: #2f5fd0; --lv-t: #9b3fb5; --lv-n: #c85d0b; --trap: #c2372f; --code-bg: #f8f9fb; --k-kw: #8a3fb0; --k-ty: #1f6fb0; --k-str: #2c7a3f; --k-num: #b45309; --k-com: #7b8594; --k-pre: #b0306a; --v-cur: #4f5fd6; --v-cmp: #c98a00; --v-done: #2b8a57; --v-bad: #d0453b; color-scheme: light; }
:root[data-skin="dark"] { --bg: #0b0f17; --surface: #111827; --raised: #1b2433; --line: rgba(226, 232, 240, 0.08); --line-strong: rgba(226, 232, 240, 0.16); --fg: #e2e8f0; --fg-2: #b4bfcd; --muted: #8b96a8; --accent: #8ea8ff; --lv-b: #4cc47e; --lv-j: #8ea8ff; --lv-t: #c98be0; --lv-n: #f2994a; --trap: #ff7b72; --code-bg: #0d131d; --k-kw: #d2a8ff; --k-ty: #79c0ff; --k-str: #7ee787; --k-num: #f2b35a; --k-com: #7d8896; --k-pre: #ff8fc0; --v-cur: #8f9bff; --v-cmp: #f0b429; --v-done: #4cc38a; --v-bad: #ff7b72; color-scheme: dark; }
:root[data-skin="paper"] { --bg: #f4efe4; --surface: #fbf8f1; --raised: #ece5d6; --line: rgba(60, 45, 20, 0.12); --line-strong: rgba(60, 45, 20, 0.22); --fg: #2b2418; --fg-2: #574c3a; --muted: #7d705b; --accent: #9a5b13; --lv-b: #3f7d3a; --lv-j: #2f5f9a; --lv-t: #8a3f8f; --lv-n: #b5520f; --trap: #b23b2e; --code-bg: #f6f1e6; --k-kw: #7d3f93; --k-ty: #2a5d8f; --k-str: #3f6e2c; --k-num: #9a5b13; --k-com: #8a7c66; --k-pre: #a0375f; --v-cur: #2f5f9a; --v-cmp: #b07a00; --v-done: #3f7d3a; --v-bad: #b23b2e; color-scheme: light; }
@media (max-width: 560px) { .mrow { grid-template-columns: 140px minmax(0, 1fr) 40px; } .prefs { order: 2; } }
@media (prefers-reduced-motion: reduce) { .sk, .mbar i { animation: none; } }

/* a chapter card's title grows into the chapter heading */
::view-transition-group(chtitle) { animation-duration: .3s; animation-timing-function: cubic-bezier(0.23, 1, 0.32, 1); }

/* this round: merged programs, tag search, more visualizers, motion */
details.prog { border: 1px solid var(--line); border-radius: var(--r-card); background: var(--surface); overflow: hidden; }
details.prog summary { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; padding: 10px 16px; cursor: pointer; list-style: none; }
details.prog summary::-webkit-details-marker { display: none; }
details.prog summary .mono { font-weight: 600; }
details.prog summary small { color: var(--muted); font-size: 12px; }
details.prog summary .show { margin-left: auto; font-size: 12px; color: var(--accent); }
details.prog summary .show::before { content: "▸ "; display: inline-block; transition: transform .2s var(--ease); }
details.prog[open] summary .show::before { transform: rotate(90deg); }
details.prog[open] summary .show { color: var(--muted); }
details.prog[open] summary { border-bottom: 1px solid var(--line); }
.progbar { display: flex; justify-content: flex-end; padding: 6px 12px 0; background: var(--code-bg); }
details.prog[open] .progbody { animation: rise .22s var(--ease) both; }
.tagcloud { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 8px 8px; }
.results:not([hidden]) { animation: pop .14s var(--ease) both; transform-origin: top; }
@keyframes pop { from { opacity: 0; transform: scale(.98) translateY(-4px); } }
.arow { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
.alabel { width: 92px; flex: none; font-size: 11px; color: var(--muted); text-align: right; }
.cell.done { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.gsvg line.hot { stroke: var(--accent); stroke-width: 3; }
.gsvg line.mst { stroke: var(--accent); stroke-width: 4; }
.gsvg line.skip { stroke-dasharray: 4 4; opacity: .5; }
.gsvg text.w { font-size: 10px; fill: var(--muted); text-anchor: middle; font-family: var(--f-mono); }
.gn.open circle { stroke: var(--accent); stroke-dasharray: 3 3; }
.rn circle { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1.2; transition: fill .15s ease; }
.rn text { text-anchor: middle; font-family: var(--f-mono); font-size: 10px; fill: var(--fg); }
.rn text.v { fill: var(--accent); font-size: 9px; }
.rn { opacity: 0; transition: opacity .2s ease; }
.rn.on { opacity: 1; }
.rn.ret circle { fill: color-mix(in srgb, var(--accent) 20%, var(--surface)); }
.rn.cur circle { stroke: var(--accent); stroke-width: 2.5; }
.tsvg line { transition: opacity .2s ease; }
.ivs rect { fill: var(--raised); stroke: var(--line-strong); }
.ivs rect.take { fill: var(--accent); stroke: var(--accent); }
.ivs rect.skip { opacity: .35; }
.ivs rect.cur { stroke: var(--fg); stroke-width: 2; }
.ivs .tick { font-size: 10px; fill: var(--muted); font-family: var(--f-mono); }

/* the map draws itself the first time it appears, column by column */
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes nodein { from { opacity: 0; transform: translateY(6px); } }
.intro .edge { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .9s var(--ease) forwards; animation-delay: calc(var(--d) * 70ms); }
.intro .node > * { animation: nodein .4s var(--ease) both; animation-delay: calc(var(--d) * 70ms); }
/* a chosen chapter's path draws in */
.edge.hot { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .6s var(--ease) forwards; }
/* a chapter just marked learned pops */
@keyframes popnode { 40% { transform: scale(1.08); } }
.node.pop rect.box { transform-box: fill-box; transform-origin: center; animation: popnode .45s var(--ease); }
/* checkmarks draw themselves */
.chk { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; margin-right: 4px; vertical-align: -1px; }
.chk path { stroke-dasharray: 1; stroke-dashoffset: 1; }
[aria-pressed="true"] .chk path { animation: draw .35s var(--ease) .05s forwards; }
.tick { display: inline-grid; place-items: center; width: 18px; height: 18px; border: 1.5px solid var(--line-strong); border-radius: 5px; cursor: pointer; position: relative; transition: background-color .15s ease, border-color .15s ease; }
.tick input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.tick svg { width: 14px; height: 14px; fill: none; stroke: var(--bg); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.tick path { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset .3s var(--ease); }
.tick:has(input:checked) { background: var(--accent); border-color: var(--accent); }
.tick:has(input:checked) path { stroke-dashoffset: 0; }
.tick:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
/* progress bars grow in when a view opens */
@keyframes grow { from { transform: scaleX(0); } }
.strip:not(.still) .meter i { transform-origin: left; animation: grow .7s var(--ease) both; }
.cheat tbody tr { animation: rise .35s var(--ease) both; animation-delay: calc(var(--i) * 45ms); }
/* page changes by click: the old view lifts away, the new one settles in */
@keyframes vt-out { to { opacity: 0; transform: translateY(-6px); } }
@keyframes vt-in { from { opacity: 0; transform: translateY(10px); } }
::view-transition-old(root) { animation: vt-out .16s var(--ease) both; }
::view-transition-new(root) { animation: vt-in .26s var(--ease) both; }
@media (prefers-reduced-motion: reduce) {
  .intro .edge, .edge.hot { animation: none; stroke-dasharray: none; stroke-dashoffset: 0; }
  .intro .node > *, .node.pop rect.box, .strip .meter i, .cheat tbody tr, details.prog[open] .progbody, .results:not([hidden]) { animation: none; }
}

@media (max-width: 1000px) {
  .treeview, .chapter, .hero, .showcase { grid-template-columns: minmax(0, 1fr); }
  .hero { min-height: 0; }
  .home { gap: 64px; }
  .side, .aside { position: static; }
}
@media (max-width: 560px) {
  .bar-in { gap: 8px 12px; padding-block: 8px; }
  .brand span { display: none; }
  .search { order: 3; flex-basis: 100%; max-width: none; }
  .strip { gap: 4px 16px; font-size: 12px; }
  .strip .meter, .strip .en { display: none; }
  .canvas { max-height: 64vh; min-height: 200px; }
  .minimap { width: 120px; }
  .sk-hero { grid-template-columns: minmax(0, 1fr); min-height: 0; }
  .frame .top span + span, .tools .hint { display: none; }
  .ptag { display: none; }
  .results { min-width: 0; }
}
/* Reduced motion: drop movement, keep the fades and colour changes that confirm an action. */
@media (prefers-reduced-motion: reduce) {
  .hero > * { animation: none; }
  .toast, .toast.show { transform: translate(-50%, 0); }
  .btn:active, .status button:active, .copy:active, .chip:active, .seg button:active { transform: none; }
}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in wrap">
    <a class="brand" href="#home"><b>Contest Chapter Atlas</b><span>深入浅出程序设计竞赛 · 101 章</span></a>
    <nav class="nav" aria-label="Views">
      <a href="#tree" id="nav-tree" data-t="tree">Tree</a>
      <a href="#list" id="nav-list" data-t="list">Chapters</a>
      <a href="#progress" id="nav-progress" data-t="progress">Progress</a>
    </nav>
    <div class="prefs"><button class="btn sm" id="langBtn" data-lang aria-label="Switch interface language">中</button><button class="btn sm" id="skinBtn" data-skin aria-label="Change theme">Auto</button></div>
    <div class="search" role="search">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M11.7 10.3a6 6 0 1 0-1.4 1.4l3.6 3.6 1.4-1.4-3.6-3.6zM6.8 11a4.2 4.2 0 1 1 0-8.4 4.2 4.2 0 0 1 0 8.4z"/></svg>
      <input id="q" type="search" placeholder="Search" autocomplete="off" aria-label="Search chapters, concepts, programs and problems">
      <div class="results" id="results" hidden></div>
    </div>
  </div>
</header>

<main class="wrap" id="view" aria-busy="true">
  <div class="skeleton" aria-label="Loading">
    <div class="sk sk-strip"></div>
    <div class="sk-hero"><div><div class="sk sk-h1"></div><div class="sk sk-h1 short"></div><div class="sk sk-line"></div><div class="sk sk-line"></div><div class="sk sk-btns"></div></div><div class="sk sk-map"></div></div>
  </div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="readbar" id="readbar" aria-hidden="true"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
(function () {
  "use strict";
  const LEVELS = [
    { key: "基", slug: "b", name: "基础篇", en: "Basics" },
    { key: "进", slug: "j", name: "进阶篇", en: "Intermediate" },
    { key: "拓", slug: "t", name: "拓展篇", en: "Extended" },
    { key: "N", slug: "n", name: "NOI篇", en: "NOI" },
  ];
  const LUOGU = [
    ["入门", "#fe4c61"], ["普及−", "#f39c11"], ["普及", "#d99500"], ["普及+/提高−", "#3fa415"],
    ["提高", "#3498db"], ["提高+/省选−", "#9d3dcf"], ["省选/NOI−", "#0e1d69"], ["NOI/NOI+/CTS", "#222222"],
  ];
  const cfColor = r => r < 1200 ? "#808080" : r < 1400 ? "#2e8b2e" : r < 1600 ? "#03a89e" : r < 1900 ? "#3b5bdb" : r < 2100 ? "#a0a" : r < 2400 ? "#e08a00" : "#d22";
  const KIND = { "IDEA": "Idea", "KEY POINT": "Key point", "TRAP": "Trap", "NOTE": "Note", "TIP": "Tip", "WARNING": "Warning" };

  let A = [], byId = {}, bySlug = {}, kids = {};
  let problems = null, selected = null, levelFilter = "all";
  let introPending = true, justLearned = null;
  let zoomS = null, curS = 1; // chosen map scale (null = fit) and the one drawn now
  const ZMIN = 0.2, ZSTEPS = [0.2, 0.3, 0.45, 0.6, 0.8, 1];

  // ---- per-viewer storage (this browser only) ----
  const store = {
    get(k, d) { try { const v = localStorage.getItem("atlas." + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("atlas." + k, JSON.stringify(v)); } catch (e) { /* storage blocked: keep in memory */ } },
  };
  let prog = store.get("progress", {});
  let solved = new Set(store.get("solved", []));
  let notes = store.get("notes", {});
  const statusOf = id => prog[id] || "none";
  function setStatus(id, s) {
    const key = id.replace(/\d+$/, ""), full = () => A.filter(c => c.id.startsWith(key)).every(c => statusOf(c.id) === "learned");
    const was = full();
    if (s === "none") delete prog[id]; else prog[id] = s;
    store.set("progress", prog);
    if (s === "learned") { justLearned = id; setTimeout(() => (justLearned = null), 700); }
    if (s === "learned") { learnedAt[id] = Date.now(); delete reviews[id]; store.set("learnedAt", learnedAt); store.set("reviews", reviews); }
    logDay();
    toast(`${id} · ${s === "none" ? "not started" : s}`);
    if (!was && full()) setTimeout(() => celebrate(key)); // after the caller re-renders
  }
  // Rare moment, so it may run longer than UI motion: the finished lane lights up once.
  function celebrate(key) {
    toast(`${LEVELS.find(l => l.key === key).name} complete`);
    // An opacity glow with no movement, so it stays under reduced motion.
    const lane = document.querySelector(`.lane-bg[data-lv="${key}"]`);
    if (lane) lane.animate([{ opacity: 0.045 }, { opacity: 0.22 }, { opacity: 0.045 }], { duration: 900, easing: "cubic-bezier(0.23, 1, 0.32, 1)" });
  }
  function toggleSolved(pid) { solved.has(pid) ? solved.delete(pid) : solved.add(pid); store.set("solved", [...solved]); logDay(); }

  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const lvOf = c => LEVELS.find(l => c.id.startsWith(l.key));
  const lvClass = c => "lv-" + lvOf(c).slug;
  const isReady = c => statusOf(c.id) !== "learned" && c.pre.every(p => statusOf(p) === "learned");
  let toastTimer = 0;
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800); }
  const problemUrl = (judge, id) => judge === "luogu" ? `https://www.luogu.com.cn/problem/${id}` : (m => m ? `https://codeforces.com/problemset/problem/${m[1]}/${m[2]}` : "#")(id.match(/^(\d+)([A-Z]\d?)$/));
  // First starred problem of a chapter not ticked yet (the stars in atlas.json, so no extra fetch).
  function nextStar(c) {
    const x = [...c.stars.luogu.map(p => ["luogu", p]), ...c.stars.codeforces.map(p => ["codeforces", p])].find(([, p]) => !solved.has(p.id));
    return x ? { judge: x[0], p: x[1], label: (x[0] === "luogu" ? "" : "CF ") + x[1].id, url: problemUrl(x[0], x[1].id) } : null;
  }
  function resumeHtml() {
    const cur = A.find(c => statusOf(c.id) === "learning") || A.find(isReady) || A.find(c => statusOf(c.id) !== "learned");
    if (!cur) return "";
    const s = nextStar(cur);
    return `<p class="resume">Continue: <a href="#ch-${cur.slug}"><span class="lv ${lvClass(cur)}">${cur.id}</span> <span class="cjk">${esc(cur.title)}</span></a>${s ? ` → next ★ <a href="${s.url}" target="_blank" rel="noopener" class="mono">${esc(s.label)}</a> <span class="cjk">${esc(s.p.name)}</span>` : ""}</p>`;
  }
  // FLIP: draw the full-size map at the clicked box's old size, then let it grow into place.
  function zoomFrom(before, id) {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const svg = document.querySelector("#canvas svg"), node = document.querySelector(`.node[data-id="${id}"]`);
    if (!svg || !node) return;
    const after = node.getBoundingClientRect(), o = svg.getBoundingClientRect(), s = before.width / after.width;
    const tx = before.left - o.left - s * (after.left - o.left), ty = before.top - o.top - s * (after.top - o.top);
    svg.style.transition = "none";
    svg.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
    svg.getBoundingClientRect();
    svg.style.transition = "transform 280ms var(--ease)";
    svg.style.transform = "";
    svg.addEventListener("transitionend", () => (svg.style.transition = ""), { once: true });
  }
  async function copy(text) {
    try { await navigator.clipboard.writeText(text); toast("Copied"); }
    catch (e) {
      const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); toast("Copied"); } catch (e2) { toast("Select the text and copy it"); }
      ta.remove();
    }
  }

  // ---- graph helpers ----
  function ancestors(id, acc = new Set()) { for (const p of byId[id].pre) if (!acc.has(p)) { acc.add(p); ancestors(p, acc); } return acc; }
  function descendants(id, acc = new Set()) { for (const k of kids[id] || []) if (!acc.has(k)) { acc.add(k); descendants(k, acc); } return acc; }
  const depth = {};
  function depthOf(id) { if (depth[id] !== undefined) return depth[id]; const c = byId[id]; depth[id] = c.pre.length ? 1 + Math.max(...c.pre.map(depthOf)) : 0; return depth[id]; }
  function pathTo(id) {
    const need = [...ancestors(id)].filter(x => statusOf(x) !== "learned");
    need.sort((a, b) => depthOf(a) - depthOf(b) || A.indexOf(byId[a]) - A.indexOf(byId[b]));
    return need;
  }

  // ---- lane layout: one horizontal lane per level, columns = prerequisite depth ----
  const W = 212, H = 56, COLW = 244, ROWH = 68, LANEW = 132, PADY = 36, LANEGAP = 16, LANEPAD = 14;
  let layout = null;
  function computeLayout() {
    const order = A.map(c => c.id);
    const maxD = Math.max(...A.map(c => depthOf(c.id)));
    const cells = {}; // level -> depth -> [ids]
    LEVELS.forEach(l => (cells[l.key] = Array.from({ length: maxD + 1 }, () => [])));
    A.forEach(c => cells[lvOf(c).key][depthOf(c.id)].push(c.id));
    const xy = {};
    let lanes = [];
    const place = () => {
      let y = PADY;
      lanes = LEVELS.map(l => {
        const rows = Math.max(1, ...cells[l.key].map(col => col.length));
        const top = y;
        cells[l.key].forEach((col, d) => col.forEach((id, i) => (xy[id] = { x: LANEW + d * COLW, y: top + LANEPAD + i * ROWH })));
        y += rows * ROWH + LANEPAD * 2 - (ROWH - H) + LANEGAP;
        return { level: l, top, height: y - top - LANEGAP };
      });
      return y;
    };
    let height = place();
    for (let sweep = 0; sweep < 6; sweep++) {
      LEVELS.forEach(l => cells[l.key].forEach(col => {
        const key = id => { const ps = byId[id].pre; return ps.length ? ps.reduce((s, p) => s + xy[p].y, 0) / ps.length : xy[id].y; };
        col.sort((a, b) => key(a) - key(b) || order.indexOf(a) - order.indexOf(b));
      }));
      height = place();
    }
    layout = { xy, lanes, maxD, width: LANEW + maxD * COLW + W + 24, height: height - LANEGAP + 12 };
  }

  function svgTree() {
    const { xy, width, height, lanes, maxD } = layout;
    const anc = selected ? ancestors(selected) : null, desc = selected ? descendants(selected) : null;
    const hot = selected ? new Set([selected, ...anc, ...desc]) : null;
    let out = "";
    lanes.forEach(({ level: l, top, height: h }) => {
      const list = A.filter(c => c.id.startsWith(l.key));
      const done = list.filter(c => statusOf(c.id) === "learned").length;
      out += `<g style="--c: var(--lv-${l.slug})"><rect class="lane-bg" data-lv="${l.key}" x="0" y="${top}" width="${width}" height="${h}"/>
        <line class="lane-rule" x1="0" x2="${width}" y1="${top}" y2="${top}"/>
        <text class="lane-name" x="16" y="${top + 28}">${l.name}</text>
        <text class="lane-en" x="16" y="${top + 46}">${l.en}</text>
        <text class="lane-n" x="16" y="${top + 62}">${done}/${list.length}</text></g>`;
    });
    for (let d = 0; d <= maxD; d++) out += `<text class="col-label" x="${LANEW + d * COLW}" y="22">Step ${d + 1}</text>`;
    A.forEach(c => c.pre.forEach(p => {
      const a = xy[p], b = xy[c.id];
      const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + H / 2, mx = x1 + Math.max(24, (x2 - x1) / 2);
      const on = selected && ((c.id === selected && anc.has(p)) || (p === selected) || (anc.has(c.id) && anc.has(p)) || (desc.has(c.id) && (desc.has(p) || p === selected)));
      const filtered = levelFilter !== "all" && !(c.id.startsWith(levelFilter) || p.startsWith(levelFilter));
      out += `<path class="edge${on ? " hot" : ""}${(selected && !on) || filtered ? " dim" : ""}" pathLength="1" style="--d:${depthOf(p)}" d="M${x1},${y1} C${mx},${y1} ${x2 - Math.max(24, (x2 - x1) / 2)},${y2} ${x2},${y2}"/>`;
    }));
    A.forEach(c => {
      const { x, y } = xy[c.id];
      const st = statusOf(c.id);
      const dim = (hot && !hot.has(c.id)) || (levelFilter !== "all" && !c.id.startsWith(levelFilter)) || (topicFilter !== "all" && c.fam !== topicFilter);
      const title = c.title.length > 15 ? c.title.slice(0, 14) + "…" : c.title;
      const en = c.en.length > 30 ? c.en.slice(0, 29) + "…" : c.en;
      out += `<g class="node ${st}${isReady(c) ? " ready" : ""}${selected === c.id ? " sel" : ""}${dim ? " dim" : ""}${justLearned === c.id ? " pop" : ""}" data-id="${c.id}" tabindex="0" role="button" aria-label="${esc(c.id + " " + c.title + ", " + c.en + ", " + (st === "none" ? "not started" : st))}" style="--c: var(--${lvClass(c)}); --d:${depthOf(c.id)}" transform="translate(${x},${y})">
        <title>${esc(c.id + " " + c.title + " · " + c.en)}</title>
        <rect class="box" width="${W}" height="${H}" rx="8"/>
        <text class="id" x="12" y="18">${esc(c.id)}</text>
        <circle class="ready" cx="${W - 12}" cy="14" r="4"/>
        <text class="t" x="12" y="36">${esc(title)}</text>
        <text class="en" x="12" y="49">${esc(en)}</text>
      </g>`;
    });
    const intro = introPending; introPending = false; // the first map drawn each visit builds itself
    return `<svg class="${intro ? "intro" : ""}" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMinYMin meet" role="img" aria-label="Route map of all 101 chapters, one lane per level">${out}</svg>`;
  }

  // ---- shared bits ----
  function stripHtml(still) {
    return `<div class="strip${still ? " still" : ""}">${LEVELS.map(l => {
      const list = A.filter(c => c.id.startsWith(l.key));
      const done = list.filter(c => statusOf(c.id) === "learned").length;
      const half = list.filter(c => statusOf(c.id) === "learning").length;
      return `<span class="item lv-${l.slug}" style="--c: var(--lv-${l.slug})"><span class="lv lv-${l.slug}">${l.key}</span><span class="name">${l.name}</span><span class="meter"><i style="width:${done / list.length * 100}%"></i><i class="half" style="width:${half / list.length * 100}%"></i></span><span class="n">${done}/${list.length}</span></span>`;
    }).join("")}</div>${resumeHtml()}`;
  }
  const chLink = id => `<a class="${statusOf(id) === "learned" ? "done" : ""}" href="#ch-${byId[id].slug}" title="${esc(byId[id].title + " · " + byId[id].en)}">${esc(id)}</a>`;
  function statusButtons(id) {
    const st = statusOf(id);
    return `<div class="status" role="group" aria-label="Status">${[["none", "Not started"], ["learning", "Learning"], ["learned", "Learned"]].map(([s, label]) => `<button data-status="${s}" data-id="${id}" aria-pressed="${st === s}">${s === "learned" ? '<svg class="chk" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" pathLength="1"/></svg>' : ""}${label}</button>`).join("")}</div>`;
  }
  const pathList = ids => `<ol class="path">${ids.map(id => `<li><a href="#ch-${byId[id].slug}"><span class="lv ${lvClass(byId[id])}">${id}</span> <span class="cjk">${esc(byId[id].title)}</span></a></li>`).join("")}</ol>`;

  function sideCard() {
    if (!selected) {
      const ready = A.filter(isReady).slice(0, 8).map(c => c.id);
      return `<div class="block"><p class="label">How to read the map</p>
        <p>Each lane is one level of the course. A line runs from a chapter to the chapters that build on it, left to right. Click a chapter to trace its path.</p>
        <div class="legend"><span><i class="sw"></i>Not started</span><span><i class="sw learning"></i>Learning</span><span><i class="sw learned"></i>Learned</span><span><svg width="10" height="10" aria-hidden="true"><circle cx="5" cy="5" r="4" fill="var(--muted)"/></svg>Ready to learn</span></div>
        <p class="hint" style="margin-top:12px">Prerequisites are estimated from the chapter contents</p></div>
        <div class="block"><p class="label">Ready to learn next</p>${ready.length ? pathList(ready) : `<p class="hint">Everything is learned</p>`}</div>`;
    }
    const c = byId[selected];
    const need = pathTo(c.id);
    return `<div class="card selcard" style="--c: var(--${lvClass(c)})">
      <div><span class="lv ${lvClass(c)}">${c.id} · ${lvOf(c).name} 第${c.num}章</span>
      <h2>${esc(c.title)}</h2><p class="en">${esc(c.en)}</p>
      <p class="hint" style="margin:0 0 12px">${esc(c.summary)}</p>
      ${statusButtons(c.id)}
      <div class="btns even"><a class="btn primary" href="#ch-${c.slug}">Open chapter</a><a class="btn" href="handouts/${c.slug}.pdf" target="_blank" rel="noopener">Handout PDF</a></div>
      <div class="btns"><button class="btn" data-clear>Clear selection</button></div></div>
      <div><div class="block"><p class="label">Needs</p><div class="links">${c.pre.length ? c.pre.map(chLink).join("") : '<span class="hint">Nothing, a starting point</span>'}</div></div>
      <div class="block"><p class="label">Unlocks</p><div class="links">${(kids[c.id] || []).length ? kids[c.id].map(chLink).join("") : '<span class="hint">Nothing further in the course</span>'}</div></div>

    </div>`;
  }

  // ---- views ----
  // ---- map zoom: the svg is redrawn at width x scale, so text stays sharp and the canvas scrolls natively ----
  const clampS = s => Math.min(1, Math.max(ZMIN, s));
  const viewH = () => Math.max(560, innerHeight - 150);
  const fitScale = canvas => clampS((canvas.clientWidth - 2) / layout.width);
  function sizeSvg(canvas, s) {
    const svg = canvas.querySelector("svg");
    curS = s;
    svg.setAttribute("width", Math.round(layout.width * s));
    svg.setAttribute("height", Math.round(layout.height * s));
    const pct = $("#zoomPct");
    if (pct) pct.textContent = Math.round(s * 100) + "%";
    requestAnimationFrame(updateMinimap); // after the caller has moved the scroll position
  }
  // Zoom keeping the map point under (ax, ay), canvas coordinates, where it is.
  function zoomAt(canvas, s, ax = canvas.clientWidth / 2, ay = canvas.clientHeight / 2) {
    s = clampS(s);
    const mx = (canvas.scrollLeft + ax) / curS, my = (canvas.scrollTop + ay) / curS;
    sizeSvg(canvas, s);
    zoomS = s;
    canvas.scrollLeft = mx * s - ax;
    canvas.scrollTop = my * s - ay;
  }
  function fitBox(canvas, x0, y0, x1, y1) {
    const s = clampS(Math.min(canvas.clientWidth / (x1 - x0), viewH() / (y1 - y0)));
    sizeSvg(canvas, s);
    zoomS = s;
    canvas.scrollLeft = x0 * s;
    canvas.scrollTop = y0 * s;
  }
  function fitLane(canvas, key) {
    const ids = A.filter(c => c.id.startsWith(key)).map(c => layout.xy[c.id]);
    const lane = layout.lanes.find(l => l.level.key === key);
    fitBox(canvas, Math.min(...ids.map(p => p.x)) - 24, lane.top, Math.max(...ids.map(p => p.x)) + W + 24, lane.top + lane.height);
  }
  function placeCanvas() {
    const canvas = $("#canvas");
    if (!canvas) return;
    sizeSvg(canvas, zoomS ?? fitScale(canvas));
    if (zoomS === null) return;
    const focusId = selected || (A.find(c => statusOf(c.id) !== "learned") || A[0]).id;
    const p = layout.xy[focusId];
    canvas.scrollLeft = Math.max(0, p.x * curS - (selected ? canvas.clientWidth / 2 - W * curS / 2 : LANEW * curS));
    canvas.scrollTop = Math.max(0, p.y * curS - canvas.clientHeight / 2 + H * curS / 2);
  }
  // Drag to pan with a mouse; pinch to zoom on touch (one finger still scrolls natively).
  let dragMoved = false;
  function wireCanvas(canvas) {
    let drag = null;
    const touches = new Map();
    let pinch = null;
    canvas.addEventListener("pointerdown", e => {
      if (e.pointerType === "mouse" && e.button === 0) drag = { x: e.clientX, y: e.clientY, sl: canvas.scrollLeft, st: canvas.scrollTop };
      if (e.pointerType === "touch") {
        touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (touches.size === 2) { const [a, b] = [...touches.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), s: curS }; }
      }
    });
    canvas.addEventListener("pointermove", e => {
      if (drag) {
        const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
        if (!dragMoved && Math.abs(dx) + Math.abs(dy) > 4) { dragMoved = true; canvas.classList.add("dragging"); }
        if (dragMoved) { canvas.scrollLeft = drag.sl - dx; canvas.scrollTop = drag.st - dy; }
      }
      if (pinch && touches.has(e.pointerId)) {
        touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
        const [a, b] = [...touches.values()], r = canvas.getBoundingClientRect();
        zoomAt(canvas, pinch.s * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top);
      }
    });
    const end = e => {
      drag = null; canvas.classList.remove("dragging");
      setTimeout(() => (dragMoved = false)); // let the click that ends a drag see the flag first
      touches.delete(e.pointerId); if (touches.size < 2) pinch = null;
    };
    canvas.addEventListener("pointerup", end);
    canvas.addEventListener("pointercancel", end);
    canvas.addEventListener("wheel", e => {
      if (!e.ctrlKey) return; // plain wheel scrolls; Ctrl+wheel and trackpad pinch zoom
      e.preventDefault();
      const r = canvas.getBoundingClientRect();
      zoomAt(canvas, curS * Math.exp(-e.deltaY * 0.002), e.clientX - r.left, e.clientY - r.top);
    }, { passive: false });
  }
  function viewTree() {
    if (!layout) computeLayout();

    canvas.innerHTML = svgTree();
    sizeSvg(canvas, curS);
    canvas.scrollLeft = sl; canvas.scrollTop = st;
    const mm = $("#minimap");
    if (mm) { mm.outerHTML = minimapHtml(); wireMinimap(); updateMinimap(); }

  function viewList() {

  function codeHtml(code) {
    let html;
    try { html = window.hljs ? hljs.highlight(code, { language: "cpp", ignoreIllegals: true }).value : esc(code); } catch (e) { html = esc(code); }
    const out = []; const open = [];
    html.split("\n").forEach(line => {
      const prefix = open.join("");
      (line.match(/<span[^>]*>|<\/span>/g) || []).forEach(t => (t.startsWith("</") ? open.pop() : open.push(t)));
      out.push(`<span class="l">${prefix}${line}${"</span>".repeat(open.length)}</span>`);
    });
    return out.join("");
  }

  // The handout in reading order: headings, paragraphs, boxes, tables, numbered points, program links.
  const secId = num => "sec-" + num.replace(/\./g, "-");
  function concepts(c) {
    // Each chapter's text is its own file, fetched the first time the chapter opens.
    if (c.flow === undefined) {
      fetch(`handouts/${c.slug}.flow.json`).then(r => r.json()).then(f => { c.flow = f; route(); }).catch(() => { c.flow = null; route(); });
      return `<p class="empty">Loading the chapter text</p>`;
    }
    const pdf = page => `handouts/${c.slug}.pdf#page=${page}`;
    const vis = VIS[c.id] ? `<div class="vis" id="vis"></div>` : "";
    const html = vis + (c.flow || []).map(b => {
      switch (b.t) {
        case "h2": return `<div class="sec" id="${secId(b.num)}"><span class="n">${b.num}</span><h3>${esc(b.title)}</h3></div>`;
        case "h3": return `<h4 class="sub" id="${secId(b.num)}"><span class="n">${b.num}</span> ${esc(b.title)}</h4>`;
        case "lede": return `<p class="lede">${bigO(esc(b.text))}</p>`;
        case "p": return `<p class="para">${bigO(esc(b.text))}</p>`;
        case "li": { const m = b.text.match(/^(\d+)\.\s*([\s\S]*)$/); return m ? `<p class="para li"><span class="num">${m[1]}</span><span>${bigO(esc(m[2]))}</span></p>` : `<p class="para li">${bigO(esc(b.text))}</p>`; }
        case "box": { const k = CALLOUT[b.kind] || CALLOUT.NOTE; return `<div class="box ${k.cls}"><b>${k.icon}<span>${k.zh}</span><span class="hint">${k.en}</span></b><div>${bigO(esc(b.text))}</div></div>`; }
        case "pre": return `<div class="tbl"><pre>${esc(b.lines.join("\n"))}</pre><a class="jump" href="${pdf(b.page)}" target="_blank" rel="noopener">Laid out properly in the PDF, page ${b.page} →</a></div>`;
        case "fig": return `<a class="jump fig" href="${pdf(b.page)}" target="_blank" rel="noopener">Diagram on PDF page ${b.page} →</a>`;
        case "prog": { const k = c.programs.findIndex(p => p.file === b.file); return k < 0 ? "" : progBlock(c, k); }
        default: return "";
      }
    }).join("");

    const placed = new Set((c.flow || []).filter(b => b.t === "prog").map(b => b.file));
    const rest = c.programs.map((p, k) => (placed.has(p.file) ? "" : progBlock(c, k))).join("");
    const all = html + (rest ? `<div class="sec"><span class="n">+</span><h3>More programs</h3></div>${rest}` : "");
    return all ? `<div class="flow">${all}</div>` : `<p class="empty">This handout's text could not be read. Open the PDF instead</p>`;
  }

  function problemRows(c, judge, filter) {

    A = data;

    A.forEach(c => c.pre.forEach(p => (kids[p] = kids[p] || []).push(c.id)));
    buildIndex();
    route();
    $("#view").removeAttribute("aria-busy");
  }).catch(err => { console.error(err); $("#view").innerHTML = `<p class="empty">The chapter data didn't load. Reload the page to try again</p>`; });
})();
</script>
</body>
</html>
